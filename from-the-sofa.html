<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SofaTravel – Norske reiseguider som tar deg med på en levende sofareise gjennom Norges mest fascinerende steder." />
  <title>SofaTravel – Reise fra der du er</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #130C06; --panel: #1A0D06; --card: #1E0F07; --border: #3A2010;
      --gold: #C9A84C; --text: #F0E6CF; --muted: #907055; --sub: #B09870;
      --input-bg: #261408; --msg-user: #3A2010; --msg-bot: #201208;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Crimson Text', Georgia, serif; }

    /* ── HERO ── */
    .hero {
      padding: 70px 32px 50px; text-align: center;
      background: linear-gradient(170deg, #221008 0%, var(--bg) 100%);
      border-bottom: 1px solid rgba(201,168,76,.15);
    }
    .hero-eyebrow { letter-spacing: .45em; font-size: 11px; color: var(--gold); margin-bottom: 18px; }
    .hero h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.6rem, 7vw, 5.2rem);
      color: var(--text); margin-bottom: 18px; line-height: 1.08; font-weight: 700;
    }
    .hero p { font-size: 1.15rem; color: var(--sub); font-style: italic; max-width: 480px; margin: 0 auto; }

    /* ── GUIDE GRID ── */
    .guides-section { max-width: 1200px; margin: 0 auto; padding: 56px 32px 80px; }
    .section-label { letter-spacing: .35em; font-size: 10.5px; color: rgba(201,168,76,.55); text-align: center; margin-bottom: 40px; }
    .guides-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 22px; }
    .guide-card {
      cursor: pointer; border-radius: 6px; overflow: hidden;
      background: var(--card); border: 1px solid var(--border);
      transition: transform .22s, border-color .22s, box-shadow .22s; outline: none;
    }
    .guide-card:hover, .guide-card:focus { transform: translateY(-4px); }
    .guide-card-img-wrap { position: relative; height: 210px; overflow: hidden; }
    .guide-card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
    .guide-card:hover .guide-card-img-wrap img,
    .guide-card:focus .guide-card-img-wrap img { transform: scale(1.05); }
    .guide-card-overlay { position: absolute; inset: 0; }
    .guide-card-label { position: absolute; bottom: 12px; left: 14px; }
    .guide-card-city { letter-spacing: .22em; font-size: 9.5px; color: var(--gold); margin-bottom: 2px; }
    .guide-card-name { font-family: 'Playfair Display', Georgia, serif; font-size: 1.25rem; color: var(--text); font-weight: 700; }
    .guide-card-body { padding: 14px 16px 18px; }
    .guide-card-tagline { font-size: .8rem; color: var(--muted); line-height: 1.55; font-style: italic; min-height: 44px; margin-bottom: 14px; }
    .guide-card-btn { border-radius: 4px; padding: 8px 0; text-align: center; font-size: .82rem; color: var(--text); letter-spacing: .08em; }

    /* ── CHAT ── */
    #page-chat { display: none; height: 100vh; overflow: hidden; flex-direction: row; }
    #page-chat.active { display: flex; }
    .chat-left { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chat-header {
      padding: 16px 22px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 18px; background: var(--panel); flex-shrink: 0;
    }
    .back-btn {
      background: none; border: 1px solid rgba(201,168,76,.3); color: var(--gold);
      padding: 6px 14px; border-radius: 4px; cursor: pointer;
      font-size: .82rem; letter-spacing: .06em; font-family: inherit;
    }
    .back-btn:hover { border-color: var(--gold); }
    .chat-guide-city { letter-spacing: .22em; font-size: 9.5px; color: var(--gold); margin-bottom: 2px; }
    .chat-guide-name { font-family: 'Playfair Display', Georgia, serif; font-size: 1.1rem; color: var(--text); }

    .voice-toggle { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .voice-toggle-btn {
      background: var(--input-bg); border: 1px solid var(--border); color: var(--muted);
      padding: 5px 12px; border-radius: 20px; cursor: pointer;
      font-size: .75rem; font-family: inherit; transition: all .2s;
    }
    .voice-toggle-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,.1); }

    .messages { flex: 1; overflow-y: auto; padding: 24px 22px; display: flex; flex-direction: column; gap: 18px; }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg-row { display: flex; gap: 10px; align-items: flex-start; }
    .msg-row.user { justify-content: flex-end; }
    .msg-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; margin-top: 2px; }
    .msg-bubble { max-width: 70%; padding: 12px 16px; line-height: 1.8; font-size: .93rem; white-space: pre-wrap; }
    .msg-bubble.bot { background: var(--msg-bot); color: #DDD0B8; border: 1px solid var(--border); border-radius: 8px 8px 8px 2px; }
    .msg-bubble.user-bubble { background: var(--msg-user); color: var(--text); border-radius: 8px 8px 2px 8px; }
    .msg-bubble.error { background: #3A0A00; color: #FF9966; border-color: #8B2000; font-style: italic; }
    .speak-btn {
      display: inline-block; margin-top: 8px; background: none;
      border: 1px solid var(--border); color: var(--muted); border-radius: 4px;
      padding: 3px 10px; font-size: .72rem; cursor: pointer; font-family: inherit;
      transition: all .2s; letter-spacing: .04em;
    }
    .speak-btn:hover { border-color: var(--gold); color: var(--gold); }
    .speak-btn.playing { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,.1); }
    .typing { color: var(--gold); letter-spacing: .3em; font-size: 1.1rem; }

    .input-row {
      display: flex; gap: 8px; padding: 14px 22px;
      border-top: 1px solid var(--border); background: var(--panel); flex-shrink: 0;
    }
    #chat-input {
      flex: 1; background: var(--input-bg); border: 1px solid var(--border);
      color: var(--text); padding: 11px 16px; border-radius: 6px;
      font-size: .93rem; outline: none; font-family: 'Crimson Text', Georgia, serif;
    }
    #chat-input:focus { border-color: rgba(201,168,76,.4); }
    #send-btn { width: 46px; height: 46px; border-radius: 6px; border: none; color: var(--text); font-size: 1.2rem; cursor: pointer; }
    #send-btn:disabled { opacity: .5; cursor: default; }

    /* ── RIGHT PANEL ── */
    .chat-right {
      width: 260px; background: var(--panel); border-left: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0;
      transform: translateX(100%); opacity: 0;
      transition: transform .65s cubic-bezier(.16,1,.3,1), opacity .65s ease;
    }
    .chat-right.visible { transform: translateX(0); opacity: 1; }
    .guide-portrait { position: relative; height: 300px; overflow: hidden; }
    .guide-portrait img { width: 100%; height: 100%; object-fit: cover; }
    .guide-portrait-fade { position: absolute; inset: 0; background: linear-gradient(to top, var(--panel) 0%, transparent 50%); }
    .guide-portrait-info { position: absolute; bottom: 16px; left: 18px; }
    .guide-portrait-city { letter-spacing: .22em; font-size: 9.5px; color: var(--gold); margin-bottom: 4px; }
    .guide-portrait-name { font-family: 'Playfair Display', Georgia, serif; font-size: 1.5rem; color: var(--text); font-weight: 700; line-height: 1.1; }
    .guide-online { position: absolute; top: 12px; right: 12px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #4CAF50; background: rgba(76,175,80,.15); }
    .guide-tagline-box { padding: 16px 18px; border-top: 1px solid var(--border); }
    .guide-tagline-box p { font-style: italic; color: var(--muted); line-height: 1.85; font-size: .86rem; }
    .topics-nav { padding: 0 18px 12px; }
    .topics-label { letter-spacing: .2em; font-size: 9px; color: #605040; margin-bottom: 10px; }
    .topic-btn {
      display: block; width: 100%; text-align: left; cursor: pointer;
      padding: 7px 12px; margin-bottom: 6px; background: var(--input-bg);
      border: 1px solid var(--border); border-radius: 4px;
      font-size: .78rem; color: #C9B890; letter-spacing: .03em; font-family: inherit; transition: all .15s;
    }
    .topic-btn:hover { border-color: var(--gold); color: var(--text); }
    .atlas-tip { margin: auto 14px 14px; padding: 10px 12px; background: #1E1208; border: 1px solid var(--border); border-radius: 5px; }
    .atlas-tip p { font-size: .72rem; color: #605040; line-height: 1.7; }
    .atlas-tip strong { color: var(--gold); }
  </style>
</head>
<body>

<!-- ══ LANDING ════════════════════════════════════════════════════════════════ -->
<div id="page-landing" role="main">
  <header class="hero" role="banner">
    <p class="hero-eyebrow" aria-hidden="true">SOFATRAVEL · NORSKE GUIDER</p>
    <h1>Reise fra der du er</h1>
    <p>Velg din guide. Sett deg godt. La deg føres gjennom Norges skjulte historier — via chat og stemme, 24/7.</p>
  </header>
  <section class="guides-section" aria-label="Velg blant norske reiseguider">
    <p class="section-label" aria-hidden="true">VELG DIN GUIDE</p>
    <div class="guides-grid" role="list" id="guides-grid"></div>
  </section>
</div>

<!-- ══ CHAT ═══════════════════════════════════════════════════════════════════ -->
<div id="page-chat" role="application">
  <div class="chat-left">
    <header class="chat-header" role="navigation">
      <button class="back-btn" id="back-btn">← Guider</button>
      <div>
        <p class="chat-guide-city" id="header-city"></p>
        <p class="chat-guide-name" id="header-name"></p>
      </div>
      <div class="voice-toggle">
        <button class="voice-toggle-btn" id="voice-toggle-btn">🔇 Stemme av</button>
      </div>
    </header>
    <div class="messages" id="messages" role="log" aria-live="polite"></div>
    <div class="input-row">
      <input type="text" id="chat-input" autocomplete="off" aria-label="Skriv melding til guiden" />
      <button id="send-btn">→</button>
    </div>
  </div>

  <aside class="chat-right" id="chat-right">
    <div class="guide-portrait">
      <img id="portrait-img" src="" alt="" />
      <div class="guide-portrait-fade" aria-hidden="true"></div>
      <div class="guide-portrait-info">
        <p class="guide-portrait-city" id="portrait-city"></p>
        <p class="guide-portrait-name" id="portrait-name"></p>
      </div>
      <div class="guide-online" title="Tilgjengelig nå"></div>
    </div>
    <div class="guide-tagline-box"><p id="portrait-tagline"></p></div>
    <nav class="topics-nav" aria-label="Foreslåtte temaer">
      <p class="topics-label" aria-hidden="true">FORESLÅTTE TEMAER</p>
      <div id="topics-list"></div>
    </nav>
    <div class="atlas-tip">
      <p>💬 Åpne i <strong>ChatGPT Atlas</strong>: klikk sidepanelet og spør Atlas om hva du ser.</p>
    </div>
  </aside>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════
// VOICE (ElevenLabs — valgfri, brukers eget abonnement)
// ════════════════════════════════════════════════════════════════════════
let ELEVEN_KEY  = localStorage.getItem('st_eleven') || '';
let voiceOn     = false;
let currentAudio = null;

document.getElementById('voice-toggle-btn').addEventListener('click', () => {
  if (!ELEVEN_KEY) {
    const k = prompt('ElevenLabs API-nøkkel (elevenlabs.io):');
    if (k && k.length > 10) { ELEVEN_KEY = k; localStorage.setItem('st_eleven', k); }
    else return;
  }
  voiceOn = !voiceOn;
  updateVoiceBtn();
});

function updateVoiceBtn() {
  const btn = document.getElementById('voice-toggle-btn');
  btn.textContent = voiceOn ? '🔊 Stemme på' : '🔇 Stemme av';
  btn.classList.toggle('active', voiceOn);
}

// ════════════════════════════════════════════════════════════════════════
// GUIDE DATA
// ════════════════════════════════════════════════════════════════════════
const guides = [
  { id:'bergen',       name:'Astrid',  city:'Bergen',       tagline:'Hanseatenes by og fjordenes port',       img:'https://i.pravatar.cc/400?img=47', accent:'#8B1A2F', voiceId:'XB0fDUnXU5powFXDhCwa' },
  { id:'oslo',         name:'Henrik',  city:'Oslo',         tagline:'Kongebyen ved Oslofjorden',              img:'https://i.pravatar.cc/400?img=68', accent:'#1A3A5C', voiceId:'VR6AewLTigWG4xSOukaG' },
  { id:'tromso',       name:'Sigrid',  city:'Tromsø',       tagline:'Nordlysets by under arktisk himmel',     img:'https://i.pravatar.cc/400?img=49', accent:'#2A1A5C', voiceId:'XrExE9yKIg1WjnnlVkGX' },
  { id:'stavanger',    name:'Magnus',  city:'Stavanger',    tagline:'Preikestolens by og oljeeventyret',      img:'https://i.pravatar.cc/400?img=60', accent:'#1E4A28', voiceId:'TxGEqnHWrfWFTfGW9XjX' },
  { id:'alesund',      name:'Ingrid',  city:'Ålesund',      tagline:'Jugendstilbyen midt i havgapet',         img:'https://i.pravatar.cc/400?img=48', accent:'#5C3A1A', voiceId:'EXAVITQu4vr4xnSDxMaL' },
  { id:'lofoten',      name:'Hilde',   city:'Lofoten',      tagline:'Fiskernes paradis — magisk og uberørt', img:'https://i.pravatar.cc/400?img=16', accent:'#1A3D4F', voiceId:'jsCqWAovK2LkecY7zXl4' },
  { id:'flam',         name:'Maja',    city:'Flåm',         tagline:'Verdens vakreste togtur starter her',    img:'https://i.pravatar.cc/400?img=44', accent:'#2D4A1A', voiceId:'XrExE9yKIg1WjnnlVkGX' },
  { id:'geiranger',    name:'Erik',    city:'Geiranger',    tagline:'UNESCO-fjordens stille vokter',          img:'https://i.pravatar.cc/400?img=69', accent:'#1E3A4A', voiceId:'VR6AewLTigWG4xSOukaG' },
  { id:'kristiansand', name:'Sofia',   city:'Kristiansand', tagline:'Sørlandets perle og sommerbyen',         img:'https://i.pravatar.cc/400?img=46', accent:'#7A3520', voiceId:'EXAVITQu4vr4xnSDxMaL' },
  { id:'trondheim',    name:'Olav',    city:'Trondheim',    tagline:'Nidarosdomen og vikingenes arv',         img:'https://i.pravatar.cc/400?img=57', accent:'#4A2D1A', voiceId:'TxGEqnHWrfWFTfGW9XjX' },
];

const topicsByGuide = {
  bergen:  ['Bryggen og hanseatene','Edvard Grieg og Troldhaugen','Shetlandsbussen og krigen','Fisketorget og lokalmaten','De syv fjell og Fløibanen','Spedalskhetens museum'],
  lofoten: ['Midnattssolen over Lofoten','Fiskevær og rørbuer','Nordnorsk mat og tørrfisk','Lofotveggen og fjordene','Vikinghistorie på Borg','Havørn og villmarken'],
  default: ['Historiske steder','Lokalmaten','Skjulte perler','Naturopplevelser'],
};

// ════════════════════════════════════════════════════════════════════════
// SYSTEM PROMPTS
// ════════════════════════════════════════════════════════════════════════
const BERGEN_KB = `GRUNNLEGGENDE: Bergen grunnlagt 1070 av Olav Kyrre. Norges nest største by (~295.000 innb.). De syv fjell: Fløyen, Ulriken, Sandviken, Rundemanen, Løvstakken, Damsgårdsfjell, Lyderhorn. Ca. 230 regndager. Bergensere har «ti ord for regn».
BRYGGEN: UNESCO-verdensarv 1979. Hansa 1360–1750 — handlet tørrfisk. Opprinnelig «Tyskebryggen». Enhjørningsgården, Svendsgården. Bak Bryggen: Steinkjelleren (Norges eldste bordell). Schøtstuene.
BRANNER: 1702 (90% brant), 1413, 1476, 1582, 1675, 1686, 1751, 1771, 1901, 1955.
SVARTEDAUDEN: 1349 — engelsk skip. Tre fjerdedeler av befolkningen døde.
BERGENHUS: Fra 1240-tallet. Håkonshallen 1247–61. Rosenkrantztårnet 1560-tallet.
MARIAKIRKEN: Eldste bygning, 1130–1170. Gudstjenester på tysk under Hansa. Øvregaten = Norges første gate.
GRIEG: Edvard Grieg 1843–1907. Troldhaugen fra 1885. Kona Nina fant på navnet. Kremert (nr. 7 i Norge). Rød komponisthytte. Drives nå av KODE.
LEPRAMUSEET: Armauer Hansen oppdaget leprabasillen 1873. «Hansens sykdom». St. Jørgens Hospital.
KRIGEN: Okkupert 1940–45. Shetlandsbussen — Leif Larsen: 52 tokt, statue bak fisketorget. Theta-museet bak Enhjørningsgården.
MAT: Fisketorget siden 1200-tallet. Kaffemisjonen (Norges beste). Colonialen. Raspeball, fårikål.
KULTUR: Festspillene i Bergen (mai/juni). Buekorps siden 1850-tallet. Bergen Filharmoniske Orkester (gr. 1765). Ingen billboards.`;

const LOFOTEN_KB = `GEOGRAFI: Øygruppe i Nordland, strekker seg 170 km ut i havet. Lofotveggen reiser seg rett fra havet.
LYS: Midnattssol 28. mai–14. juli. Mørketid 8. des–4. jan. Nordlys september–mars.
FISK: Verdens viktigste tørrfiskprodusent. Skrei (vandrende torsk) gyter jan–april. Tørrfisk eksporteres til Italia, Nigeria, Brasil.
STEDER: Å i Lofoten — et av de vakreste fiskevær. Henningsvær — «Lofotens Venezia». Reine — kåret til ett av verdens vakreste steder. Nusfjord — bevart 1800-talls fiskevær.
RØRBUER: Opprinnelig arbeiderboliger for fiskere, nå romantiske feriehytter rett over vannet.
VIKINGER: Borg i Vestvågøy — Norges største vikingkongehall (83 m lang). Lofotr Vikingmuseum.
MAT: Bacalao, skreimølje (dampet skrei med lever og rogn), lofotlam. Anita's Sjømat i Henningsvær er legendarisk.
NATUR: Tetteste havørnbestand i Europa — vingespenn inntil 2,5 m. Reinebringen (448 moh.) — Lofotens mest fotograferte utsikt.`;

function getSystemPrompt(g) {
  if (g.id === 'bergen') return `Du er Astrid, en varm og kunnskapsrik sofareiseguide fra Bergen. Du snakker alltid norsk.
PERSONLIGHET: Bergenser til fingerspissene. Elsker regnet. Maler scener med lyder, lukter og stemninger. Bruk «vi» — dere reiser SAMMEN.
KUNNSKAP:\n${BERGEN_KB}
STIL: 3–5 rike avsnitt i flytende prosa. Aldri punktlister. Start gjerne poetisk. Avslutt alltid med spørsmål.`;

  if (g.id === 'lofoten') return `Du er Hilde, en varm og naturglad sofareiseguide fra Lofoten. Snakker norsk, men gjerne noen tyske/nederlandske gloser («Wunderschön!», «Prachtig!») siden mange gjester er tyske og nederlandske.
PERSONLIGHET: Oppvokst i Henningsvær. Kjenner lyset, midnattssolen, lukten av tørrfisk, lydene av havørn. Forteller med hjertevarme og naturrespekt.
KUNNSKAP:\n${LOFOTEN_KB}
STIL: 3–5 rike avsnitt i flytende prosa. Aldri punktlister. Avslutt alltid med spørsmål.`;

  return `Du er ${g.name}, en kunnskapsrik og personlig sofareiseguide til ${g.city}. Led gjesten på en levende sofareise. Bruk «vi». Svar alltid på norsk i rik, flytende prosa. 3–5 avsnitt. Avslutt alltid med spørsmål.`;
}

// ════════════════════════════════════════════════════════════════════════
// STATE & DOM
// ════════════════════════════════════════════════════════════════════════
let currentGuide = null;
let history = [];
let isLoading = false;

const pageLanding = document.getElementById('page-landing');
const pageChat    = document.getElementById('page-chat');
const messagesEl  = document.getElementById('messages');
const chatInput   = document.getElementById('chat-input');
const sendBtn     = document.getElementById('send-btn');
const chatRight   = document.getElementById('chat-right');
const topicsList  = document.getElementById('topics-list');

// Build guide cards
guides.forEach(g => {
  const el = document.createElement('article');
  el.className = 'guide-card';
  el.setAttribute('role', 'listitem');
  el.setAttribute('tabindex', '0');
  el.innerHTML = `
    <div class="guide-card-img-wrap">
      <img src="${g.img}" alt="${g.name}, guide til ${g.city}" loading="lazy" />
      <div class="guide-card-overlay" style="background:linear-gradient(to top,${g.accent}DD 0%,transparent 55%)" aria-hidden="true"></div>
      <div class="guide-card-label">
        <p class="guide-card-city">${g.city.toUpperCase()}</p>
        <p class="guide-card-name">${g.name}</p>
      </div>
    </div>
    <div class="guide-card-body">
      <p class="guide-card-tagline">${g.tagline}</p>
      <div class="guide-card-btn" style="background:${g.accent}">Start reisen →</div>
    </div>`;
  el.addEventListener('click', () => startChat(g));
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') startChat(g); });
  document.getElementById('guides-grid').appendChild(el);
});

document.getElementById('back-btn').addEventListener('click', () => {
  stopAudio();
  pageChat.classList.remove('active');
  pageLanding.style.display = '';
  chatRight.classList.remove('visible');
  history = [];
  messagesEl.innerHTML = '';
});

function startChat(g) {
  currentGuide = g;
  history = [];
  messagesEl.innerHTML = '';

  document.getElementById('header-city').textContent   = g.city.toUpperCase();
  document.getElementById('header-name').textContent   = g.name;
  document.getElementById('portrait-city').textContent = g.city.toUpperCase();
  document.getElementById('portrait-name').textContent = g.name;
  document.getElementById('portrait-tagline').textContent = `"${g.tagline}"`;
  document.getElementById('portrait-img').src = g.img;
  document.getElementById('portrait-img').alt = `${g.name}, guide til ${g.city}`;
  sendBtn.style.background = g.accent;
  chatInput.placeholder    = `Spør ${g.name} om ${g.city}…`;

  topicsList.innerHTML = '';
  (topicsByGuide[g.id] || topicsByGuide.default).forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn';
    btn.textContent = t;
    btn.addEventListener('click', () => sendMessage(t));
    topicsList.appendChild(btn);
  });

  pageLanding.style.display = 'none';
  pageChat.classList.add('active');
  setTimeout(() => chatRight.classList.add('visible'), 400);
  setTimeout(() => chatInput.focus(), 700);

  const welcome = `Hei, og hjertelig velkommen til ${g.city}!\n\nJeg er ${g.name} — din personlige sofaguide. Akkurat nå, akkurat her, fra sofaen din, tar jeg deg med på en reise gjennom ${g.city}s gater, historier og hemmeligheter.\n\nHvor vil du starte? Skal vi gå til et historisk sted, smake på lokalmaten — eller utforske noe litt ukjent og overraskende?`;
  appendMessage('assistant', welcome);
  history.push({ role:'assistant', content:welcome });
  if (voiceOn && ELEVEN_KEY) speakText(welcome, g.voiceId);
}

// ════════════════════════════════════════════════════════════════════════
// CHAT — kaller Netlify proxy, ingen API-nøkkel i frontend
// ════════════════════════════════════════════════════════════════════════
sendBtn.addEventListener('click', () => sendMessage());
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

async function sendMessage(text) {
  const msg = (text || chatInput.value).trim();
  if (!msg || isLoading) return;
  stopAudio();
  chatInput.value = '';
  appendMessage('user', msg);
  history.push({ role:'user', content:msg });

  const typingId = showTyping();
  isLoading = true;
  sendBtn.disabled = true;

  try {
    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: getSystemPrompt(currentGuide),
        messages: history.filter(m => m.role !== 'system'),
      }),
    });

    const data = await res.json();

    if (data.error) {
      removeTyping(typingId);
      appendMessage('error', `Noe gikk galt — prøv igjen om litt.`);
    } else {
      const reply = data.content?.[0]?.text || 'Tomt svar — prøv igjen.';
      removeTyping(typingId);
      appendMessage('assistant', reply, true);
      history.push({ role:'assistant', content:reply });
      if (voiceOn && ELEVEN_KEY) speakText(reply, currentGuide.voiceId);
    }
  } catch (err) {
    removeTyping(typingId);
    appendMessage('error', 'Kunne ikke koble til — sjekk internett og prøv igjen.');
  }

  isLoading = false;
  sendBtn.disabled = false;
  chatInput.focus();
}

// ════════════════════════════════════════════════════════════════════════
// MESSAGES
// ════════════════════════════════════════════════════════════════════════
function appendMessage(role, text, withSpeakBtn = false) {
  const row = document.createElement('div');
  row.className = `msg-row${role === 'user' ? ' user' : ''}`;

  if (role !== 'user') {
    const img = document.createElement('img');
    img.className = 'msg-avatar';
    img.src = currentGuide?.img || '';
    img.alt = currentGuide?.name || '';
    img.style.border = `1px solid ${currentGuide?.accent || '#C9A84C'}88`;
    row.appendChild(img);
  }

  const bubble = document.createElement('div');
  bubble.className = `msg-bubble ${role === 'user' ? 'user-bubble' : role === 'error' ? 'bot error' : 'bot'}`;
  const t = document.createElement('div');
  t.textContent = text;
  bubble.appendChild(t);

  if (withSpeakBtn && role === 'assistant') {
    const btn = document.createElement('button');
    btn.className = 'speak-btn';
    btn.textContent = '🔊 Hør guiden';
    btn.addEventListener('click', () => speakText(text, currentGuide.voiceId, btn));
    bubble.appendChild(btn);
  }

  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const id = 'typing-' + Date.now();
  const row = document.createElement('div');
  row.className = 'msg-row'; row.id = id;
  const img = document.createElement('img');
  img.className = 'msg-avatar'; img.src = currentGuide?.img || ''; img.alt = '';
  img.style.border = `1px solid ${currentGuide?.accent}88`;
  const bub = document.createElement('div');
  bub.className = 'msg-bubble bot';
  bub.innerHTML = '<span class="typing">···</span>';
  row.appendChild(img); row.appendChild(bub);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return id;
}
function removeTyping(id) { const el = document.getElementById(id); if (el) el.remove(); }

// ════════════════════════════════════════════════════════════════════════
// ELEVENLABS TTS
// ════════════════════════════════════════════════════════════════════════
function stopAudio() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.querySelectorAll('.speak-btn.playing').forEach(b => {
    b.classList.remove('playing'); b.textContent = '🔊 Hør guiden';
  });
}

async function speakText(text, voiceId, btn) {
  if (!ELEVEN_KEY) return;
  stopAudio();
  if (btn) { btn.classList.add('loading'); btn.textContent = '⏳ Laster…'; }
  const trimmed = text.length > 2500 ? text.substring(0, 2500) + '…' : text;
  try {
    const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'xi-api-key': ELEVEN_KEY },
      body: JSON.stringify({
        text: trimmed,
        model_id: 'eleven_multilingual_v2',
        voice_settings: { stability: 0.5, similarity_boost: 0.75, style: 0.3, use_speaker_boost: true },
      }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;
    if (btn) { btn.classList.remove('loading'); btn.classList.add('playing'); btn.textContent = '⏹ Stopp'; }
    audio.addEventListener('ended', () => {
      currentAudio = null; URL.revokeObjectURL(url);
      if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 Hør guiden'; }
    });
    if (btn) btn.onclick = () => { stopAudio(); btn.onclick = () => speakText(text, voiceId, btn); };
    audio.play();
  } catch (err) {
    if (btn) { btn.classList.remove('loading', 'playing'); btn.textContent = '⚠️ Feil'; }
  }
}
</script>
