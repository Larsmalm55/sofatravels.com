<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olav · Trondheim · SofaTravels</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-50X2YGHD2J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-50X2YGHD2J');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Crimson+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #14100C;
      --border: #2E2418;
      --wood:   #A8702F;
      --wood-lt:#D4A059;
      --gold:   #C9A84C;
      --text:   #EAE0CF;
      --sub:    #B0A08A;
      --muted:  #6A5A48;
      --card-bg:#1C1610;
    }
    html, body {
      height: 100%; background: var(--bg);
      font-family: 'Crimson Text', Georgia, serif;
      color: var(--text); overflow: hidden;
    }

    /* ══ TOP BAR ══ */
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 46px;
      background: rgba(20,16,12,.96); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; gap: 12px;
    }
    #back-btn {
      background: none; border: 1px solid rgba(201,168,76,.3); color: var(--gold);
      padding: 4px 12px; border-radius: 4px; cursor: pointer;
      font-size: .72rem; letter-spacing: .1em; font-family: inherit;
      transition: all .2s; text-decoration: none;
    }
    #back-btn:hover { border-color: var(--gold); background: rgba(201,168,76,.08); }
    .hdr-center {
      flex: 1; text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: .8rem; letter-spacing: .25em; color: var(--sub);
    }
    .hdr-center span { color: var(--gold); }
    .hdr-right { display: flex; gap: 6px; }
    .hdr-btn {
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(28,22,16,.7); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; font-size: .8rem;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    .hdr-btn:hover { border-color: var(--wood); color: var(--text); }
    .hdr-btn.active { border-color: var(--wood); color: var(--wood-lt); background: rgba(168,112,47,.15); }

    /* ══ MAIN ══ */
    #app { display: flex; height: 100vh; padding-top: 46px; overflow: hidden; }

    /* ══ LEFT — SLIDESHOW ══ */
    #left-col {
      flex: 0 0 62%; position: relative;
      background: #000; overflow: hidden; min-width: 300px;
    }
    .portrait-slide {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center top;
      opacity: 0; transition: opacity 2.2s ease;
    }
    .portrait-slide.active { opacity: 1; }
    #left-mist {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
      height: 28%; pointer-events: none;
      background: linear-gradient(to top, rgba(20,16,12,1) 0%, rgba(20,16,12,.5) 45%, transparent 100%);
    }
    #left-mist-side {
      position: absolute; top: 0; right: 0; bottom: 0; z-index: 2;
      width: 16%; pointer-events: none;
      background: linear-gradient(to left, rgba(20,16,12,.85) 0%, transparent 100%);
    }

    #guide-badge {
      position: absolute; top: 14px; left: 14px; z-index: 10;
      display: flex; align-items: center; gap: 9px;
    }
    .badge-av { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; border: 1.5px solid rgba(168,112,47,.5); }
    .badge-av img { width: 100%; height: 100%; object-fit: cover; }
    .badge-name { font-family: 'Playfair Display', serif; font-size: .9rem; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.9); }
    .online-dot { width: 7px; height: 7px; border-radius: 50%; background: #4CC87A; box-shadow: 0 0 6px rgba(76,200,122,.8); animation: pdot 3s infinite; }
    @keyframes pdot { 0%,100%{box-shadow:0 0 4px rgba(76,200,122,.4)} 50%{box-shadow:0 0 10px rgba(76,200,122,.9)} }

    #loc-badge {
      position: absolute; top: 14px; right: 14px; z-index: 10;
      background: rgba(20,16,12,.65); backdrop-filter: blur(12px);
      border: 1px solid rgba(201,168,76,.25); border-radius: 4px;
      padding: 5px 12px; text-align: right;
    }
    #loc-region { font-size: 7.5px; letter-spacing: .35em; color: var(--gold); margin-bottom: 1px; }
    #loc-name { font-family: 'Playfair Display', serif; font-size: .85rem; color: var(--text); }

    #slide-dots {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; gap: 6px;
    }
    .sdot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.22); transition: all .3s; cursor: pointer; }
    .sdot.active { background: var(--gold); transform: scale(1.35); }

    /* ══ INFO CARD OVERLAY ══ */
    #info-card {
      position: absolute; inset: 0; z-index: 20;
      background: rgba(20,16,12,.97);
      display: flex; flex-direction: column;
      opacity: 0; pointer-events: none;
      transition: opacity .4s ease;
      overflow: hidden;
    }
    #info-card.visible { opacity: 1; pointer-events: all; }

    #info-card-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid rgba(201,168,76,.2);
      display: flex; align-items: flex-start; justify-content: space-between;
      flex-shrink: 0;
    }
    #info-card-label {
      font-size: 7.5px; letter-spacing: .4em; color: var(--gold);
      margin-bottom: 4px; display: block;
    }
    #info-card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem; color: var(--text); line-height: 1.2;
    }
    #info-card-close {
      background: rgba(168,112,47,.15); border: 1px solid rgba(168,112,47,.3);
      color: var(--sub); width: 30px; height: 30px; border-radius: 50%;
      cursor: pointer; font-size: .85rem; flex-shrink: 0; margin-left: 12px;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s; margin-top: 4px;
    }
    #info-card-close:hover { border-color: var(--wood); color: var(--text); background: rgba(168,112,47,.25); }

    #info-card-image {
      width: 100%; height: 38%; flex-shrink: 0; overflow: hidden;
      position: relative; background: #0A0806;
    }
    #info-card-image img {
      width: 100%; height: 100%; object-fit: cover; object-position: center;
      opacity: .8;
    }
    #info-card-image-cap {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 20px 20px 8px;
      background: linear-gradient(to top, rgba(20,16,12,.9) 0%, transparent 100%);
      font-size: .65rem; color: var(--muted); letter-spacing: .1em;
    }

    #info-card-body {
      flex: 1; overflow-y: auto; padding: 16px 22px 20px;
    }
    #info-card-body::-webkit-scrollbar { width: 2px; }
    #info-card-body::-webkit-scrollbar-thumb { background: rgba(168,112,47,.2); }
    .info-section { margin-bottom: 14px; }
    .info-section-label {
      font-size: 7px; letter-spacing: .35em; color: var(--gold);
      margin-bottom: 5px; display: block;
    }
    .info-section p {
      font-size: .92rem; line-height: 1.7; color: #C8BBAA;
      margin-bottom: 8px;
    }
    .info-section p strong { color: var(--text); font-weight: 600; }

    #info-card-footer {
      padding: 10px 20px 12px;
      border-top: 1px solid var(--border);
      font-size: .72rem; color: var(--muted); font-style: italic;
      flex-shrink: 0;
    }

    /* ══ RIGHT COL ══ */
    #right-col {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      background: var(--bg); overflow: hidden;
      border-left: 1px solid var(--border);
    }

    #right-top {
      display: flex; flex-direction: row;
      flex: 0 0 44%; border-bottom: 1px solid var(--border); overflow: hidden;
    }

    #topics-panel {
      flex: 0 0 48%; padding: 12px 12px 10px;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .tp-region { font-size: 7px; letter-spacing: .35em; color: var(--gold); margin-bottom: 1px; }
    .tp-name { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--text); margin-bottom: 1px; }
    .tp-tagline { font-size: .68rem; color: var(--muted); font-style: italic; margin-bottom: 8px; line-height: 1.4; }
    .tp-label { font-size: 7px; letter-spacing: .3em; color: var(--muted); margin-bottom: 5px; flex-shrink: 0; }
    #topics { display: flex; flex-direction: column; gap: 4px; overflow: hidden; flex: 1; }
    .topic-btn {
      background: rgba(28,22,16,.9); border: 1px solid rgba(168,112,47,.18);
      color: var(--sub); padding: 5px 10px; border-radius: 4px;
      font-size: .72rem; cursor: pointer; font-family: inherit;
      text-align: left; transition: all .2s; line-height: 1.3; flex-shrink: 0;
    }
    .topic-btn:hover { border-color: rgba(168,112,47,.55); color: var(--text); background: rgba(168,112,47,.1); }
    .topic-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,.08); }

    #olav-panel {
      flex: 1; position: relative; overflow: hidden; background: #0A0806;
    }
    #olav-panel video, #olav-panel img {
      width: 100%; height: 100%; object-fit: cover; object-position: 68% top;
    }
    #olav-panel-overlay {
      position: absolute; inset: 0; pointer-events: none;
      background:
        linear-gradient(to top, rgba(20,16,12,.85) 0%, rgba(20,16,12,.1) 35%, transparent 65%),
        linear-gradient(to right, rgba(20,16,12,.5) 0%, transparent 40%);
    }
    #olav-panel-name {
      position: absolute; bottom: 10px; left: 12px;
      font-family: 'Playfair Display', serif; font-size: .8rem; color: rgba(234,224,207,.8);
    }
    #olav-panel-sub { font-size: .58rem; letter-spacing: .15em; color: var(--gold); display: block; margin-bottom: 1px; }

    #chat-col { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    #tip-bar { padding: 5px 14px 3px; font-size: .67rem; color: var(--muted); border-bottom: 1px solid rgba(46,36,24,.4); flex-shrink: 0; }
    #messages { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 14px 6px; display: flex; flex-direction: column; gap: 8px; }
    #messages::-webkit-scrollbar { width: 2px; }
    #messages::-webkit-scrollbar-thumb { background: rgba(168,112,47,.2); }
    .msg-row { display: flex; gap: 7px; align-items: flex-end; }
    .msg-row.user { justify-content: flex-end; }
    .msg-av { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1px solid rgba(168,112,47,.3); }
    .msg-bubble { max-width: 86%; padding: 8px 12px; line-height: 1.6; font-size: .88rem; }
    .msg-bubble.bot { background: rgba(28,22,16,.92); color: #D4C8B6; border: 1px solid rgba(168,112,47,.18); border-radius: 10px 10px 10px 2px; }
    .msg-bubble.bot em { color: rgba(201,168,76,.6); font-style: italic; }
    .msg-bubble.user-b { background: rgba(36,28,20,.92); color: var(--text); border: 1px solid rgba(168,112,47,.15); border-radius: 10px 10px 2px 10px; }
    .msg-bubble.error { background: rgba(60,10,0,.85); color: #FF9966; border-radius: 6px; }
    .speak-btn { display: inline-block; margin-top: 5px; background: none; border: 1px solid rgba(168,112,47,.2); color: var(--muted); border-radius: 4px; padding: 2px 7px; font-size: .64rem; cursor: pointer; font-family: inherit; transition: all .2s; }
    .speak-btn:hover { border-color: var(--wood); color: var(--wood-lt); }
    .speak-btn.playing { border-color: var(--wood); color: var(--wood-lt); background: rgba(168,112,47,.1); }
    .typing { color: var(--wood); letter-spacing: .3em; animation: blink 1.4s infinite; }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
    #input-row { display: flex; gap: 8px; padding: 9px 12px 12px; background: rgba(20,16,12,.96); backdrop-filter: blur(16px); border-top: 1px solid var(--border); flex-shrink: 0; }
    #chat-input { flex: 1; background: rgba(28,22,16,.94); border: 1px solid var(--border); color: var(--text); padding: 9px 16px; border-radius: 20px; font-size: .88rem; outline: none; font-family: 'Crimson Text', Georgia, serif; transition: border-color .2s; }
    #chat-input:focus { border-color: rgba(168,112,47,.5); }
    #chat-input::placeholder { color: var(--muted); }
    #send-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--wood); color: #fff; font-size: 1rem; cursor: pointer; transition: all .2s; flex-shrink: 0; align-self: center; }
    #send-btn:hover { background: var(--wood-lt); transform: scale(1.06); }
    #send-btn:disabled { opacity: .35; cursor: default; transform: none; }

    .api-banner { display: none; position: fixed; top: 46px; left: 0; right: 0; z-index: 99; background: #1A140E; border-bottom: 2px solid var(--wood); padding: 8px 20px; align-items: center; gap: 10px; flex-wrap: wrap; }
    .api-banner.show { display: flex; }
    .api-banner label { font-size: .8rem; color: var(--text); }
    .api-banner label strong { color: var(--wood); }
    .api-banner input { flex: 1; min-width: 180px; background: #0F0B08; border: 1px solid rgba(168,112,47,.4); color: var(--text); padding: 5px 10px; border-radius: 4px; font-size: .78rem; font-family: monospace; outline: none; }
    .api-banner button { background: var(--wood); border: none; color: #fff; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: .78rem; }
    .banner-close { background: none !important; color: var(--muted) !important; }
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

    /* ══ MOBIL (≤768px) ══ */
    @media (max-width: 768px) {
      #app { flex-direction: column; height: 100vh; overflow: hidden; }
      #left-col { flex: 0 0 38vh; height: 38vh; width: 100%; min-width: unset; }
      #right-col {
        flex: 1; height: calc(62vh - 42px); width: 100%; min-width: unset;
        border-left: none; border-top: 1px solid var(--border);
        display: flex; flex-direction: column; overflow: hidden;
      }
      #left-mist { height: 35%; }
      #left-mist-side { display: none; }
      #guide-badge { top: 10px; left: 10px; }
      .badge-name { font-size: .8rem; }
      #loc-badge { top: 10px; right: 10px; padding: 4px 8px; }
      #loc-region { font-size: 6.5px; }
      #loc-name { font-size: .75rem; }
      #slide-dots { bottom: 6px; }
      #info-card-image { height: 30%; }
      #info-card-title { font-size: 1.1rem; }
      #right-top { flex: 0 0 auto; flex-direction: column; height: auto; border-bottom: 1px solid var(--border); overflow: visible; }
      #topics-panel { flex: none; width: 100%; padding: 6px 10px 6px; border-right: none; border-bottom: none; overflow: hidden; }
      .tp-name { font-size: .82rem; margin-bottom: 0; }
      .tp-tagline { display: none; }
      .tp-label { display: none; }
      #topics { flex-direction: row; overflow-x: auto; overflow-y: hidden; flex-wrap: nowrap; gap: 5px; padding-bottom: 2px; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin-top: 4px; }
      #topics::-webkit-scrollbar { display: none; }
      .topic-btn { white-space: nowrap; flex-shrink: 0; padding: 4px 9px; font-size: .68rem; }
      #olav-panel { display: none; }
      #chat-col { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
      #tip-bar { display: none; }
      #messages { flex: 1; padding: 8px 10px 4px; gap: 6px; min-height: 0; }
      .msg-bubble { font-size: .84rem; padding: 7px 10px; }
      .msg-av { width: 22px; height: 22px; }
      #input-row { padding: 7px 10px 10px; gap: 6px; flex-shrink: 0; position: sticky; bottom: 0; background: rgba(20,16,12,.98); }
      #chat-input { padding: 8px 14px; font-size: .84rem; }
      #send-btn { width: 36px; height: 36px; font-size: .9rem; }
      #info-card { position: fixed; inset: 42px 0 0 0; z-index: 100; overflow-y: auto; }
      #info-card-close { width: 38px; height: 38px; font-size: 1.1rem; background: rgba(168,112,47,.3); border: 2px solid rgba(168,112,47,.6); }
      #info-card-image { height: 28%; }
      #info-card-title { font-size: 1.1rem; }
      #top-bar { height: 42px; padding: 0 12px; }
      #back-btn { padding: 3px 8px; font-size: .66rem; }
      .hdr-center { font-size: .72rem; letter-spacing: .15em; }
      #app { padding-top: 42px; }
    }
    @media (max-width: 390px) {
      #left-col { flex: 0 0 32vh; }
      #right-top { max-height: 28vh; }
      .msg-bubble { font-size: .8rem; }
    }
  </style>
</head>
<body>

<header id="top-bar">
  <a href="/regions/" id="back-btn">← Regioner</a>
  <div class="hdr-center">SOFATRAVELS · <span>TRONDHEIM</span></div>
  <div class="hdr-right">
    <button class="hdr-btn" id="voice-btn" title="Olavs stemme">🔇</button>
    <button class="hdr-btn" id="settings-btn" title="Innstillinger">⚙</button>
  </div>
</header>

<div id="eleven-banner" class="api-banner">
  <label><strong>ElevenLabs API-nøkkel</strong> — for Olavs stemme</label>
  <input type="password" id="eleven-key-input" placeholder="sk_..." autocomplete="off" />
  <button id="eleven-key-save">Lagre</button>
  <button class="banner-close" id="eleven-banner-close">✕</button>
</div>

<div id="app">

  <!-- LEFT: SLIDESHOW + INFO CARD -->
  <div id="left-col">
    <img class="portrait-slide active" src="olav-nidarosdomen.jpg" alt="Olav ved Nidarosdomen" />
    <img class="portrait-slide" src="nidarosdomen-aerial.jpg" alt="Nidarosdomen sett fra luften" />
    <img class="portrait-slide" src="kort-stiklestad.jpg" alt="Slaget på Stiklestad, 1030 — kunstnerisk gjengivelse" />
    <img class="portrait-slide" src="kort-kirke1070.jpg" alt="Den første kirken, bygget rundt 1070 — kunstnerisk gjengivelse" />
    <img class="portrait-slide" src="kort-kister-restaurering.jpg" alt="Kister funnet under restaureringsarbeidet, fotografert 1903" />
    <div id="left-mist"></div>
    <div id="left-mist-side"></div>
    <div id="guide-badge">
      <div class="badge-av"><img src="olav-video-poster.jpg" alt="Olav" /></div>
      <span class="badge-name">Olav</span>
      <span class="online-dot"></span>
    </div>
    <div id="loc-badge">
      <div id="loc-region">TRØNDELAG · NORGE</div>
      <div id="loc-name">Trondheim</div>
    </div>
    <div id="slide-dots">
      <div class="sdot active" data-idx="0"></div>
      <div class="sdot" data-idx="1"></div>
      <div class="sdot" data-idx="2"></div>
      <div class="sdot" data-idx="3"></div>
      <div class="sdot" data-idx="4"></div>
    </div>

    <!-- INFO CARD OVERLAY -->
    <div id="info-card">
      <div id="info-card-header">
        <div>
          <span id="info-card-label">TRONDHEIM · HISTORIE</span>
          <div id="info-card-title">—</div>
        </div>
        <button id="info-card-close" title="Tilbake til bildene">✕</button>
      </div>
      <div id="info-card-image">
        <img id="info-card-img" src="" alt="" />
        <div id="info-card-image-cap" id="info-img-cap"></div>
      </div>
      <div id="info-card-body"></div>
      <div id="info-card-footer">💬 Spør Olav i chatten — han ser det samme som deg</div>
    </div>

  </div>

  <!-- RIGHT -->
  <div id="right-col">
    <div id="right-top">

      <!-- Topics -->
      <div id="topics-panel">
        <div class="tp-region">TRONDHEIM</div>
        <div class="tp-name">Olav</div>
        <div class="tp-tagline">«Det begynte med et tapt slag»</div>
        <div class="tp-label">FORESLÅTTE TEMAER</div>
        <div id="topics">
          <button class="topic-btn" data-topic="nidarosdomen">Nidarosdomen · fra død konge til katedral</button>
        </div>
      </div>

      <!-- Olav portrait -->
      <div id="olav-panel">
        <video autoplay muted loop playsinline src="olav-trondheim.mp4" poster="olav-video-poster.jpg"></video>
        <div id="olav-panel-overlay"></div>
        <div id="olav-panel-name">
          <span id="olav-panel-sub">GUIDE</span>Olav
        </div>
      </div>

    </div>

    <!-- Chat -->
    <div id="chat-col">
      <div id="tip-bar">💬 Klikk et tema for å utforske — eller spør Olav direkte</div>
      <div id="messages" role="log" aria-live="polite"></div>
      <div id="input-row">
        <input type="search" id="chat-input" autocomplete="off"
               autocorrect="off" autocapitalize="off" spellcheck="false"
               placeholder="Spør Olav om Trondheim…" />
        <button id="send-btn">→</button>
      </div>
    </div>
  </div>
</div>

<script>
// ══ INFO CARD DATA ══
const CARDS = {
  nidarosdomen: {
    title: 'Nidarosdomen',
    subtitle: 'Fra død konge til katedral',
    img: 'nidarosdomen-aerial.jpg',
    imgCap: 'Nidarosdomen og Erkebispegården sett fra luften',
    sections: [

const slides = document.querySelectorAll('.portrait-slide');
const dots = document.querySelectorAll('.sdot');
let slideIdx = 0;
function showSlide(i) {
  slides.forEach(s => s.classList.remove('active'));
  dots.forEach(d => d.classList.remove('active'));
  slides[i].classList.add('active');
  dots[i].classList.add('active');
  slideIdx = i;
}
dots.forEach(d => d.addEventListener('click', () => showSlide(+d.dataset.idx)));
setInterval(() => showSlide((slideIdx + 1) % slides.length), 7000);

const NIDAROSDOMEN_KB = `
NIDAROSDOMEN — FAKTA OG HISTORIER

DØDEN VED STIKLESTAD (utgangspunktet):
Olav Haraldsson — senere kjent som Olav den hellige — var konge av Norge. Han døde i slaget på Stiklestad i 1030. Han tapte. Han ble drept. I utgangspunktet et politisk nederlag som skulle blitt glemt.

VENDEPUNKTET — FRA GRAV TIL HELGEN:
Kroppen hans ble fraktet til Trondheim og gravlagt. Kort tid senere begynte det å gå historier: folk mente det skjedde ting ved graven — helbredelser, tegn, noe som ikke kunne forklares. Kirken erklærte ham helgen. Dette er vendepunktet: graven blir et mål. Folk reiser hit — ikke bare fra Norge, men fra store deler av Europa — for å komme nær relikviene, i håp om helse, tilgivelse, håp.

DEN FØRSTE KIRKEN (ca. 1070):
Da mange nok reiste til ett sted, oppsto behov for struktur. Den første kirken bygget her rundt 1070 var liten, tilpasset et lokalt behov. Behovet vokste raskt — flere mennesker, flere ritualer, mer kontroll. En enkel kirke holdt ikke lenger.

BYGGEMATERIALET — KLEBERSTEIN:
Man begynte å bygge i stein. Materialet er kleberstein — ikke fordi det er eksklusivt, men fordi det fungerer. Finnes i regionen, blant annet Oppdal og Selbu. Nyhugget er steinen relativt myk og lett å forme; den herdes etter hvert. Gjør den ideell for bygging.

UTVINNING OG TRANSPORT:
I steinbruddene hugges spor i fjellet, kiler drives inn, blokker løsner kontrollert. Blokkene grovformes før transport (mindre vekt = enklere frakt). Først med sleder/vogner til nærmeste vannvei, deretter med båt inn til Trondheim. Uten sjøtransport ville bygging i denne skalaen vært nesten umulig.

STEINHUGGERNE:
Når steinen ankommer, finformer steinhuggere hver blokk med meisler, hammere, enkle måleverktøy. Alt manuelt. Presisjonen kommer fra tid og erfaring, ikke teknologi. Hver stein tilpasses de andre. Vestfronten har figurnisjer med konger og helgener, alt hugget for hånd.

FRA ROMANSK TIL GOTISK:
Bygget vokser gradvis. Først kompakt romansk stil, tykke vegger. Senere utvides det i gotisk stil — høyere rom, større vinduer, mer lys. Ikke bare estetikk — handler om kapasitet: flere mennesker skal bevege seg gjennom rommet uten å stoppe alt annet som skjer der.

SYSTEMET I DRIFT:
Dette er ikke bare en kirke, det er et system. Pilegrimer beveger seg mot alteret, kanskje ned mot områdene nær graven, og ut igjen — samtidig som messer og ritualer pågår parallelt. Rett ved siden av ligger Erkebispegården: administrasjonen, beslutningene, økonomien. Kirken håndterer troen. Gården håndterer kontrollen. Sammen: maktsenteret i Norge i middelalderen.

BRUDDET — REFORMASJONEN (1537):
Norge blir protestantisk. Pilegrimene slutter å komme. Relikviene mister sin betydning. Økonomien forsvinner. Systemet kollapser. Bygget står igjen uten funksjonen det var laget for.

I DAG — RESTAURERT:
Det du ser i dag er delvis gjenoppbygd — store deler av domen ble restaurert på 1800- og 1900-tallet, basert på antatt opprinnelig form. Strukturen er likevel den samme som middelalderens.

OPPSUMMERING:
Én hendelse (et tapt slag). Én tolkning (helgenkåringen). Og flere hundre år med arbeid, transport og presisjon.

PRAKTISK INFORMASJON:
Adresse: Bispegata 7, 7012 Trondheim. 5 minutters gange fra jernbanestasjonen.
Åpningstider (varierer med sesong — sjekk nidarosdomen.no): Man–fre 09:00–18:00, lør 09:00–14:00, søn 13:00–18:00.
Billett: Voksne fra 120 kr, studenter 65 kr, barn under 7 år gratis. Tårnbestigning tilgjengelig sommerstid.
Tips: Stå ved vestfasaden først — hovedinngangen pilegrimene ankom fra. Gå rundt utsiden før du går inn, legg merke til de to steinstilene.
I nærheten: Erkebispegården, 50 meter unna — i dag museum med en av de bedre faste utstillingene om norsk middelalder.
`;

const OLAV_TIL_NIDAROSDOMEN = `
OLAVS FORHOLD TIL NIDAROSDOMEN:
Ikke hans hjemsted i håndverket — kleberstein er ikke tre, og restaurering av domen er et eget fagmiljø han ikke selv har vært del av. Men som restaureringstømrer har han jobbet på nok gamle kirker og naust i Trøndelag til å kjenne igjen samme type presisjon når han ser den — bare i et annet materiale.

Han kommer hit iblant, ikke fast. Mest når han uansett er i Trondheim for et annet oppdrag, og har en ledig time. Går gjerne rundt utsiden først, ser på steinarbeidet med et fagblikk — samme måte han ville sett på et gammelt tømmerlaft.

Det som fascinerer ham mest er ikke selve bygget, men hvorfor det ble så stort: at én manns død, tolket på riktig måte til riktig tid, kunne sette i gang flere hundre år med arbeid. Noe han kjenner igjen fra eget fag — hvordan én beslutning tidlig setter spor som varer i generasjoner.

STEMNING: Rolig, ikke andektig. Han er ikke religiøs og spiller ikke det — fascinasjonen er ved håndverket og systemet, ikke helgenen selv. Kan påpeke tørt at en manns uflaks i et slag endte med å bygge en katedral: "det er vel ingen som hadde planlagt akkurat det."

KULTURELL BREDDE:

BLI-KJENT-FASEN: Start alltid med å bli kjent. Spør hvem de er. Hva som tok dem hit.

function getSystemPrompt() {

// ══ CHAT ══
let history = [], loading = false;
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('chat-input');
const sendEl     = document.getElementById('send-btn');

function parse(t) {
  return t.replace(/<!--[^>]*-->/g,'').trim()
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
    .replace(/\*([^*\n]+)\*/g,'<em>$1</em>')
    .replace(/\n/g,'<br>');
}

function addMsg(role, text, withSpeak=false) {
  const row = document.createElement('div');
  row.className = 'msg-row' + (role==='user' ? ' user' : '');
  if (role !== 'user') {
    const av = document.createElement('img');
    av.src = 'olav-video-poster.jpg'; av.className = 'msg-av'; av.alt = 'Olav';
    row.appendChild(av);
  }
  const bub = document.createElement('div');
  bub.className = 'msg-bubble ' + (role==='user' ? 'user-b' : role==='error' ? 'error' : 'bot');
  bub.innerHTML = parse(text);
  if (withSpeak && ELEVEN_KEY) {
    const sp = document.createElement('button');
    sp.className = 'speak-btn'; sp.textContent = '🔊 Hør';
    sp.onclick = () => speak(text, sp);
    bub.appendChild(sp);
  }
  row.appendChild(bub);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row'; row.id = 'typing-row';
  const av = document.createElement('img');
  av.src = 'olav-video-poster.jpg'; av.className = 'msg-av'; av.alt = 'Olav';
  row.appendChild(av);
  const bub = document.createElement('div');
  bub.className = 'msg-bubble bot';
  bub.innerHTML = '<span class="typing">···</span>';
  row.appendChild(bub);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeTyping() { document.getElementById('typing-row')?.remove(); }

async function send(override) {
  const msg = override || inputEl.value.trim();
  if (!msg || loading) return;
  inputEl.value = '';
  loading = true; sendEl.disabled = true;
  addMsg('user', msg);
  history.push({ role: 'user', content: msg });
  addTyping();
  try {
    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, system: getSystemPrompt(), sted: 'trondheim' })
    });
    removeTyping();
    if (!res.ok) { addMsg('error', 'Serverfeil ' + res.status); }
    else {
      const data = await res.json();
      if (data.error) { addMsg('error', 'API-feil: ' + data.error.message); }
      else {
        const reply = data.content?.[0]?.text || '';
        history.push({ role: 'assistant', content: reply });
        addMsg('assistant', reply, true);
        if (voiceOn && ELEVEN_KEY) speak(reply, null);
      }
    }
  } catch(e) { removeTyping(); addMsg('error', 'Nettverksfeil: ' + e.message); }
  loading = false; sendEl.disabled = false;
  inputEl.focus();
}

sendEl.onclick = () => send();
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

document.querySelectorAll('.topic-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.topic;
    const card = CARDS[key];
    showCard(key);
    send(`Fortell meg om ${card.title} — ${card.subtitle}`);
  });
});

// ══ TTS ══
let ELEVEN_KEY = null;
let VOICE_ID = ''; // [ÅPENT: ingen ElevenLabs voice ID valgt ennå for Olav]
let voiceOn = false;
let currentAudio = null;

async function speak(text, btn) {
  if (!ELEVEN_KEY || !VOICE_ID) return;
  const plain = text.replace(/<[^>]+>/g,'').replace(/\*[^*]+\*/g,'').trim();
  if (!plain) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (btn) btn.textContent = '⏳';
  try {
    const r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
      method: 'POST',
      headers: { 'xi-api-key': ELEVEN_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: plain, model_id: 'eleven_multilingual_v2',
        voice_settings: { stability: 0.5, similarity_boost: 0.8, style: 0.1, use_speaker_boost: true }
      })
    });
    if (!r.ok) throw new Error();
    const url = URL.createObjectURL(await r.blob());
    currentAudio = new Audio(url);
    if (btn) { btn.textContent = '⏸ Pause'; btn.classList.add('playing'); }
    currentAudio.onended = () => {
      if (btn) { btn.textContent = '🔊 Hør'; btn.classList.remove('playing'); }
      currentAudio = null;
    };
    currentAudio.play();
    if (btn) btn.onclick = () => {
      if (currentAudio) {
        currentAudio.pause(); currentAudio = null;
        btn.textContent = '🔊 Hør'; btn.classList.remove('playing');
      } else speak(text, btn);
    };
  } catch(e) {
    if (btn) { btn.textContent = '🔊 Hør'; btn.classList.remove('playing'); }
  }
}
