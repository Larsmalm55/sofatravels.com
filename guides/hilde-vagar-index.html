  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #080E14;
      --dark:     #0A1018;
      --border:   #1A2E3A;
      --sea:      #2A7FA8;
      --sea-lt:   #4DCCF0;
      --gold:     #C9A84C;
      --gold-lt:  #E8C97A;
      --text:     #EAE0CF;
      --sub:      #9AB0BA;
      --muted:    #5A7A8A;
      --panel:    #0C1820;
    }
    html, body {
      height: 100%; background: var(--bg);
      font-family: 'Crimson Text', Georgia, serif;
      color: var(--text); overflow: hidden;
    }

    /* ── LAYOUT ── */
    #app {
      display: flex; height: 100vh; overflow: hidden;
    }

    /* ── LEFT: PORTRAIT ── */
    #portrait-col {
      flex: 1; min-width: 0; position: relative;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    #portrait-inner {
      position: relative;
      height: 100%; aspect-ratio: 3/4;
      flex-shrink: 0; overflow: hidden;
      background: #000;
    }
    .portrait-slide {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain; object-position: center top;
      opacity: 0; transition: opacity 2s ease;
    }
    .portrait-slide.active { opacity: 1; }

    /* light overlay */
    #portrait-light {
      position: absolute; inset: 0; pointer-events: none; z-index: 1;
      background: linear-gradient(155deg, rgba(8,14,20,0.08) 0%, transparent 50%);
      animation: lightshift 20s ease-in-out infinite;
    }
    @keyframes lightshift { 0%,100%{opacity:1} 50%{opacity:.6} }

    /* bottom mist */
    #portrait-mist {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 2; pointer-events: none;
      height: 52%;
      background: linear-gradient(to top,
        rgba(8,14,20,.97) 0%, rgba(8,14,20,.8) 22%,
        rgba(8,14,20,.35) 50%, transparent 100%);
    }

    /* guide badge */
    #guide-badge {
      position: absolute; top: 16px; left: 16px; z-index: 10;
      display: flex; align-items: center; gap: 10px;
    }
    .badge-avatar {
      width: 34px; height: 34px; border-radius: 50%; overflow: hidden;
      border: 1.5px solid rgba(42,127,168,.5);
    }
    .badge-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .badge-name {
      font-family: 'Playfair Display', serif;
      font-size: .95rem; color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,.8);
    }
    .online-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #4CC87A; box-shadow: 0 0 7px rgba(76,200,122,.7);
      animation: op 3s infinite;
    }
    @keyframes op { 0%,100%{box-shadow:0 0 5px rgba(76,200,122,.4)} 50%{box-shadow:0 0 12px rgba(76,200,122,.9)} }

    /* sted badge */
    #sted-badge {
      position: absolute; top: 16px; right: 16px; z-index: 10;
      background: rgba(8,14,20,.6); backdrop-filter: blur(12px);
      border: 1px solid rgba(201,168,76,.25); border-radius: 4px;
      padding: 5px 12px; text-align: right;
    }
    #sted-region { font-size: 8px; letter-spacing: .35em; color: var(--gold); margin-bottom: 1px; }
    #sted-name { font-family: 'Playfair Display', serif; font-size: .88rem; color: var(--text); }

    /* slide dots */
    #slide-dots {
      position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; gap: 6px; align-items: center;
    }
    .sdot {

<script>
// ════════════════════════════════════════
// SLIDESHOW
// ════════════════════════════════════════
const slides = document.querySelectorAll('.portrait-slide');
const dots = document.querySelectorAll('.sdot');
let currentSlide = 0;
let slideInterval;

function goToSlide(n) {
  slides[currentSlide].classList.remove('active');
  dots[currentSlide].classList.remove('active');
  currentSlide = (n + slides.length) % slides.length;
  slides[currentSlide].classList.add('active');
  dots[currentSlide].classList.add('active');
}

function startSlideshow() {
  slideInterval = setInterval(() => goToSlide(currentSlide + 1), 12000);
}

dots.forEach(dot => {
  dot.addEventListener('click', () => {
    clearInterval(slideInterval);
    goToSlide(parseInt(dot.dataset.idx));
    startSlideshow();
  });
});

startSlideshow();

// ════════════════════════════════════════
// ELEVENLABS
// ════════════════════════════════════════
let ELEVEN_KEY = localStorage.getItem('st_eleven') || '';
let voiceOn = false;
let currentAudio = null;
const HILDE_VOICE_ID = 'jsCqWAovK2LkecY7zXl4';

document.getElementById('eleven-key-save').onclick = () => {
  const v = document.getElementById('eleven-key-input').value.trim();
  if (v.length > 10) {
    ELEVEN_KEY = v; localStorage.setItem('st_eleven', v);
    document.getElementById('eleven-banner').classList.remove('show');
    enableVoice();
  }
};
document.getElementById('eleven-banner-close').onclick = () =>
  document.getElementById('eleven-banner').classList.remove('show');
document.getElementById('settings-btn').onclick = () =>
  document.getElementById('eleven-banner').classList.toggle('show');
document.getElementById('voice-btn').onclick = () => {
  if (!ELEVEN_KEY) { document.getElementById('eleven-banner').classList.add('show'); return; }
  voiceOn = !voiceOn; updateVoiceBtn();
};
function enableVoice() { voiceOn = true; updateVoiceBtn(); }
function updateVoiceBtn() {
  const b = document.getElementById('voice-btn');
  b.textContent = voiceOn ? '🔊' : '🔇';
  b.classList.toggle('active', voiceOn);
}
if (ELEVEN_KEY) enableVoice();

// ════════════════════════════════════════
// UI CONTROLS
// ════════════════════════════════════════
let chatHidden = false;
document.getElementById('eye-btn').onclick = () => {
  chatHidden = !chatHidden;
  document.getElementById('chat-area').classList.toggle('hidden', chatHidden);
  document.getElementById('eye-btn').classList.toggle('active', chatHidden);
};
document.getElementById('sound-ctrl-btn').onclick = () =>
  document.getElementById('sound-btn').click();

// ════════════════════════════════════════
// AMBIENT SOUND
// ════════════════════════════════════════
let audioCtx = null, ambientNodes = [], ambientOn = false;

function makeNoise(ctx, s=3) {
  const b = ctx.createBuffer(1, ctx.sampleRate*s, ctx.sampleRate);
  const d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const src = ctx.createBufferSource();
  src.buffer=b; src.loop=true; return src;
}
function nl(ctx,f,q,g,dest) {
  const s=makeNoise(ctx),fi=ctx.createBiquadFilter(),gn=ctx.createGain();
  fi.type='bandpass';fi.frequency.value=f;fi.Q.value=q;gn.gain.value=0;
  s.connect(fi);fi.connect(gn);gn.connect(dest);s.start();
  gn.gain.linearRampToValueAtTime(g,ctx.currentTime+2.5);
  return {src:s,gainNode:gn};
}
function wave(ctx,dest,i=1) {
  const n=[];
  n.push(nl(ctx,60,.4,.07*i,dest));
  n.push(nl(ctx,280,.6,.05*i,dest));
  n.push(nl(ctx,2200,1.2,.025*i,dest));
  const lfo=ctx.createOscillator(),lg=ctx.createGain();
  lfo.frequency.value=.12+Math.random()*.06;lg.gain.value=.03*i;
  lfo.connect(lg);lg.connect(n[1].gainNode.gain);lfo.start();
  n.push({src:lfo,gainNode:lg});return n;
}
function wind(ctx,dest,i=1) {
  const n=[];
  n.push(nl(ctx,180,.35,.05*i,dest));
  n.push(nl(ctx,900,.9,.02*i,dest));
  const lfo=ctx.createOscillator(),lg=ctx.createGain();
  lfo.frequency.value=.05+Math.random()*.04;lg.gain.value=.025*i;
  lfo.connect(lg);lg.connect(n[0].gainNode.gain);lfo.start();
  n.push({src:lfo,gainNode:lg});return n;
}
function gull(ctx,dest,d=1) {
  function s(){
    if(!ambientOn)return;
    const t=ctx.currentTime+1+Math.random()*(9/d);
    const o=ctx.createOscillator(),mo=ctx.createOscillator(),mg=ctx.createGain(),eg=ctx.createGain();
    const bf=900+Math.random()*400;o.frequency.value=bf;o.type='sine';
    mo.frequency.value=4+Math.random()*3;mg.gain.value=60+Math.random()*40;
    eg.gain.value=0;mo.connect(mg);mg.connect(o.frequency);o.connect(eg);eg.connect(dest);
    const dur=.6+Math.random()*.8;o.start(t);mo.start(t);
    eg.gain.setValueAtTime(0,t);eg.gain.linearRampToValueAtTime(.055,t+.08);
    eg.gain.setValueAtTime(.055,t+dur*.6);eg.gain.linearRampToValueAtTime(0,t+dur);
    o.frequency.setValueAtTime(bf,t);o.frequency.linearRampToValueAtTime(bf*.72,t+dur);
    o.stop(t+dur+.1);mo.stop(t+dur+.1);
    setTimeout(s,(t-ctx.currentTime+.5)*1000*(.5+Math.random()));
  }s();
}

function startAmbient() {
  if(audioCtx) stopAmbient();
  try {
    audioCtx = new(window.AudioContext||window.webkitAudioContext)();
    const master = audioCtx.createGain(); master.gain.value=.82; master.connect(audioCtx.destination);
    // Vågar: sheltered harbour, more gulls, boat activity
    ambientNodes.push(...wave(audioCtx,master,.7));
    ambientNodes.push(...wind(audioCtx,master,.35));
    gull(audioCtx,master,1.3);
    ambientNodes.push({src:null,gainNode:master});
  } catch(e){}
}
function stopAmbient() {
  ambientNodes.forEach(n=>{
    try{if(n.gainNode)n.gainNode.gain.linearRampToValueAtTime(0,(audioCtx?.currentTime||0)+1);
    if(n.src&&n.src.stop)setTimeout(()=>{try{n.src.stop();}catch(e){}},1100);}catch(e){}
  });
  ambientNodes=[];
  setTimeout(()=>{if(audioCtx){try{audioCtx.close();}catch(e){}audioCtx=null;}},1300);
}

document.getElementById('sound-btn').onclick = () => {
  ambientOn=!ambientOn;
  const b=document.getElementById('sound-btn');
  if(ambientOn){startAmbient();b.classList.add('active');b.textContent='🔊';}
  else{stopAmbient();b.classList.remove('active');b.textContent='🌊';}
  document.getElementById('sound-bars').classList.toggle('paused',!ambientOn);
  document.getElementById('sound-label').textContent=ambientOn?'Vågar · havn og sjø':'Lyd av';
  document.getElementById('sound-ctrl-btn').textContent=ambientOn?'🔔':'🔕';
  document.getElementById('sound-ctrl-btn').classList.toggle('active',ambientOn);
};

const VIKTEN_KB = `
VÅGAR/KABELVÅG — FAKTA OG HISTORIER

STEDET:
Kabelvåg er Lofotens eldste fiskevær. Det som i dag er en stille liten by folk kjører gjennom på vei til Reine — var i middelalderen Nord-Norges viktigste handelsplass. Stedet het Vágar.

DET SOM LIGGER UNDER BAKKEN:
Ved Nyvågar Rorbu Hotel ligger et arkeologisk utgravingsfelt med bosetninger tilbake til 700-tallet. I dag er bare 1% av området utgravd — og allerede er over 100.000 gjenstander funnet. 99% av middelalderbyen ligger fortsatt under bakken. Folk går over den hver dag uten å vite det.

KONG ØYSTEIN OG RORBUENS FØDSEL:

TØRRFISKENS IMPERIUM:
På 1300-tallet utgjorde tørrfisk over 80% av Norges nasjonale eksport. Vágar var Norges viktigste handelsplass. Oslo var ingenting. Bergen var ingenting. Det som i dag er en stille kystby var da Norges kommersielle hjerte.

KABELVÅG-NAVNET:
Kabelvåg betyr «kapellvågen» — fordi kong Øystein lot bygge en kirke her. Vågan kirke fra 1898 har 1200 sitteplasser og kalles Lofotkatedralen.

ALPEROSEN:
Lofotens eldste fiskerhytte fra 1797 ligger her. Den heter Alperosen.

JOHAN HAMMOND WOLFF:
Væreieren som eide alt i Kabelvåg på 1800-tallet. Navnet hans henger på veggen i hovedbygningen fra 1815 ved Lofotmuseet. Han styrte stedet som en liten stat.

OVERNATTING:
Nyvågar Rorbu Hotel — midt på tuftene av middelalderbyen. Man sover bokstavelig talt over 1200 år med historie.

MAT OG DRIKKE:
Børsen Spiseri i Handelsbrygga fra 1828. Åpent fra kl. 17. Spesialitet: tørrfisk. Flytende sauna utenfor.

BOBIL:

`;

// SYSTEM PROMPT
// ════════════════════════════════════════
function getSystemPrompt(n) {
  const fase = n >= 8
    ? 'DYPERE LAG (melding ' + n + '): La noe av det skjulte komme frem. Én ting. Naturlig. Aldri brått.'
    : 'TIDLIG (melding ' + n + '): Bli kjent. Still spørsmål. Stedet kommer når det passer.';

  return HILDE_KB
    + '\n\n' + fase
    + '\n\nSTEDSKUNNSKAP:\n' + VIKTEN_KB
    + '\n\nSTIL — STRENGT:'
    + '\nMaks 50 ord per svar. Tell dem. Aldri mer.'
    + '\nAldri punktlister. Aldri oppsummeringer.'
    + '\nEn tanke. En detalj. En setning som henger igjen.'
    + '\nAvslutt med ett spørsmål ELLER én observasjon — aldri begge.'
    + '\nHandlinger på egen linje, kursiv, maks 5 ord: *setter fra seg kaffekoppen*'
    + '\nAltid norsk.';
}

// ════════════════════════════════════════
// MESSAGES
// ════════════════════════════════════════
let chatHistory = [], isLoading = false, userMsgCount = 0;
const messagesEl = document.getElementById('messages');
const chatInput = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');

function parseLinks(t) {
  const clean = t.replace(/<!--[^>]*-->/g, '').trim();
  return clean
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*([^*\n]+)\*/g,'<em>$1</em>')
    .replace(/\n\n\n+/g,'\n\n')
    .replace(/\n/g,'<br>');
}

function appendMessage(role, text, withSpeak=false) {
  const row = document.createElement('div');
  row.className = 'msg-row' + (role==='user' ? ' user' : '');
  if (role !== 'user') {
    const av = document.createElement('img');
    av.className = 'msg-avatar';
    av.src = slides[currentSlide].src;
    av.alt = 'Hilde';
    row.appendChild(av);
  }
  const b = document.createElement('div');
  b.className = 'msg-bubble ' + (role==='user' ? 'user-b' : role==='error' ? 'error' : 'bot');
  const t = document.createElement('div');
  t.innerHTML = role==='assistant' ? parseLinks(text) : text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  b.appendChild(t);
  if (withSpeak && role==='assistant') {
    const btn = document.createElement('button');
    btn.className = 'speak-btn'; btn.textContent = '🔊 Hør Hilde';
    btn.onclick = () => speakText(text, btn);
    b.appendChild(btn);
  }
  row.appendChild(b);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const id = 't' + Date.now();
  const row = document.createElement('div');
  row.className = 'msg-row'; row.id = id;
  const av = document.createElement('img');
  av.className = 'msg-avatar'; av.src = slides[currentSlide].src; av.alt='';
  const b = document.createElement('div');
  b.className = 'msg-bubble bot';
  b.innerHTML = '<span class="typing">···</span>';
  row.appendChild(av); row.appendChild(b);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return id;
}
function removeTyping(id) { const e=document.getElementById(id); if(e) e.remove(); }

// ════════════════════════════════════════
// SEND
// ════════════════════════════════════════
sendBtn.onclick = () => sendMessage();
chatInput.onkeydown = e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} };

async function sendMessage(text) {
  const msg = (text || chatInput.value).trim();
  if (!msg || isLoading) return;
  stopAudio(); chatInput.value = '';
  appendMessage('user', msg);
  chatHistory.push({role:'user', content:msg});
  userMsgCount++;
  const tid = showTyping();
  isLoading = true; sendBtn.disabled = true;
  try {
    const res = await fetch('/.netlify/functions/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514', max_tokens:220,
        system: getSystemPrompt(userMsgCount),
        messages: chatHistory.filter(m=>m.role!=='system'),
      }),
    });
    removeTyping(tid);
    if (!res.ok && !res.headers.get('content-type')?.includes('application/json')) {
      appendMessage('error', 'Serverfeil ' + res.status);
    } else {
      const data = await res.json();
      if (data.error) { appendMessage('error', 'API-feil: ' + data.error.message); }
      else {
        const reply = data.content?.[0]?.text || 'Tomt svar.';
        appendMessage('assistant', reply, true);
        chatHistory.push({role:'assistant', content:reply});
        if (voiceOn && ELEVEN_KEY) speakText(reply);
      }
    }
  } catch(err) { removeTyping(tid); appendMessage('error', 'Nettverksfeil: ' + err.message); }
  isLoading = false; sendBtn.disabled = false; chatInput.focus();
}

// ════════════════════════════════════════
// ELEVENLABS TTS
// ════════════════════════════════════════
function stopAudio() {
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  document.querySelectorAll('.speak-btn.playing').forEach(b=>{b.classList.remove('playing');b.textContent='🔊 Hør Hilde';});
}
async function speakText(text, btn) {
  if(!ELEVEN_KEY){document.getElementById('eleven-banner').classList.add('show');return;}
  stopAudio();
  if(btn){btn.classList.add('loading');btn.textContent='⏳';}
  const trimmed = text.length>2500 ? text.substring(0,2500)+'…' : text;
  const clean = trimmed.replace(/<!--[^>]*-->/g,'').replace(/\*([^*]+)\*/g,'$1');
  try {
    const res = await fetch('https://api.elevenlabs.io/v1/text-to-speech/'+HILDE_VOICE_ID, {
      method:'POST',
      headers:{'Content-Type':'application/json','xi-api-key':ELEVEN_KEY},
      body:JSON.stringify({text:clean,model_id:'eleven_multilingual_v2',voice_settings:{stability:.5,similarity_boost:.75,style:.3,use_speaker_boost:true}}),
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const url = URL.createObjectURL(await res.blob());
    const audio = new Audio(url); currentAudio=audio;
    if(btn){btn.classList.remove('loading');btn.classList.add('playing');btn.textContent='⏹';}
    audio.onended=()=>{currentAudio=null;URL.revokeObjectURL(url);if(btn){btn.classList.remove('playing');btn.textContent='🔊 Hør Hilde';}};
    if(btn) btn.onclick=()=>{stopAudio();btn.onclick=()=>speakText(text,btn);};
    audio.play();
  } catch(err){if(btn){btn.classList.remove('loading','playing');btn.textContent='⚠️';}}
}

// INIT
// ════════════════════════════════════════
function init() {
  const welcome = '*sitter på kaikanten, kaffekopp i hånden*\n\nHei. Jeg er Hilde.\n\n*pause*\n\nVet du at du sitter på Nord-Norges første by akkurat nå?\n\nHva heter du?';
  appendMessage('assistant', welcome);
  chatHistory.push({role:'assistant', content:welcome});
  setTimeout(() => chatInput.focus(), 600);
}
init();
