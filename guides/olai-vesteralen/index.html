<script>
// ════════════════════════════════════════════════════════════════════════
// OLAI VOICE & KEYS
// ════════════════════════════════════════════════════════════════════════
const OLAI_VOICE_ID = 'TxGEqnHWrfWFTfGW9XjX';
let ELEVEN_KEY = localStorage.getItem('st_eleven') || '';
let voiceOn    = false;
let currentAudio = null;

document.getElementById('eleven-key-save').addEventListener('click', () => {
  const v = document.getElementById('eleven-key-input').value.trim();
  if (v.length > 10) {
    ELEVEN_KEY = v;
    localStorage.setItem('st_eleven', v);
    document.getElementById('eleven-banner').classList.remove('show');
    voiceOn = true; updateVoiceBtn();
  }
});
document.getElementById('eleven-banner-close').addEventListener('click', () => {
  document.getElementById('eleven-banner').classList.remove('show');
});
document.getElementById('route-eleven-btn').addEventListener('click', () => {
  document.getElementById('eleven-banner').classList.toggle('show');
});
document.getElementById('route-voice-btn').addEventListener('click', () => {
  if (!ELEVEN_KEY) { document.getElementById('eleven-banner').classList.add('show'); return; }
  voiceOn = !voiceOn; updateVoiceBtn();
});
function updateVoiceBtn() {
  const btn = document.getElementById('route-voice-btn');
  btn.textContent = voiceOn ? '🔊 Stemme på' : '🔇 Stemme av';
  btn.classList.toggle('active', voiceOn);
}
function stopAudio() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
}
async function speakText(text, btn) {
  if (!ELEVEN_KEY || !voiceOn) return;
  stopAudio();
  if (btn) { btn.classList.add('loading'); btn.textContent = '⏳ Laster…'; }
  const trimmed = text.length > 2500 ? text.substring(0, 2500) + '…' : text;
  try {
    const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${OLAI_VOICE_ID}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'xi-api-key': ELEVEN_KEY },
      body: JSON.stringify({
        text: trimmed, model_id: 'eleven_multilingual_v2',
        voice_settings: { stability: 0.55, similarity_boost: 0.75, style: 0.2, use_speaker_boost: true },
      }),
    });
    if (!res.ok) throw new Error(`${res.status}`);
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    currentAudio = new Audio(url);
    currentAudio.play();
    if (btn) { btn.classList.remove('loading'); btn.textContent = '🔊 Hør Olai'; }
  } catch (err) {
    if (btn) { btn.classList.remove('loading'); btn.textContent = '🔊 Hør Olai'; }
    console.error('ElevenLabs feil:', err.message);
  }
}
if (ELEVEN_KEY) { voiceOn = true; updateVoiceBtn(); }

// ════════════════════════════════════════════════════════════════════════
// STAGE DATA
// ════════════════════════════════════════════════════════════════════════
const STAGES = [
  {
    id: 'evenes',
    title: 'Evenes — der reisen begynner',
    sub: 'Harstad/Narvik lufthavn · Ofotfjorden · 800 år med historie',
    images: [
      { src: '/images/vesteralen/Evenes_flyplass.jpeg', alt: 'Evenes flyplass fra luften' },
      { src: '/images/vesteralen/Evenes_friluft.jpeg', alt: 'Evenestangen og Ofotfjorden' },
      { src: '/images/vesteralen/Evenes_kirke.jpg', alt: 'Evenes kirke fra 1800' },
      { src: '/images/vesteralen/Tysk_bunker.jpeg', alt: 'Tysk bunker fra andre verdenskrig' },
    ],
    tags: ['Evenes kirke — 1250', 'Tirpitz gjemte seg her', 'Evenestangen fort', 'Várdobáiki samisk senter'],
    overnatting: 'Evenes Airport Hotel',
    opener: 'Velkommen til Evenes.\n\nDe fleste henter bilen og kjører videre. Det er synd.\n\nFor akkurat her begynner historien. Under andre verdenskrig gjemte verdens største slagskip seg inne i fjorden. For åtte hundre år siden bygde kongen kirke her. Og lenge før det fulgte samiske familier de samme dalene som vi skal reise gjennom.\n\nVi stopper ett sted før vi kjører mot Vesterålen. Det tar tjue minutter. Men etterpå vil du forstå hvorfor reisen måtte begynne akkurat her.',
    kb: `EVENES — DER REISEN BEGYNNER:

EVENES KIRKE:
Blant de eldste kirkestedene i Ofoten. Første kirke reist rundt 1250 under kong Håkon Håkonsson.
Dagens trekirke innviet i 1800, men inneholder døpefont fra middelalderen.
Olai: «Før flyplassen kom, var det kirka folk navigerte etter. Den har stått her i snart åtte hundre år.»

TIRPITZ OG KRIGSHISTORIEN:
Det tyske slagskipet Tirpitz lå gjentatte ganger skjult i fjordene ved Evenes og Bogen under andre verdenskrig.
Fjordene ga naturlig beskyttelse mot allierte angrep. Området ble sterkt befestet av tyske styrker.
Evenes er en sentral del av krigshistorien i Nord-Norge — men få besøkende vet det.

EVENESTANGEN FORT:
Rester av tyske bunkere, kanonstillinger og løpegraver med utsikt over Ofotfjorden.
Midt blant krigsminnene står kunstverket Steinkirka — en monumental granittskulptur av dansk kunstner Bjørn Nørgaard.
Kontrasten mellom krig og kunst gjør stedet unikt og vanskelig å glemme.

TROLLKIRKA:
En kort fottur fra veien. En grotte omgitt av lokale sagn om troll og underjordiske vesener.
Nordnorsk folketro er ikke bare eventyr — det er en måte å forstå et landskap på.

SAMISK HISTORIE:
Evenes ligger i grenselandet mellom norsk og samisk bosetning.
Várdobáiki samisk senter like ved formidler markesamisk språk, kultur og historie.
Samiske familier har brukt disse dalene i århundrer — lenge før flyplassen, lenge før veiene.

FLYPLASSEN:
Harstad/Narvik lufthavn Evenes fungerer både som sivil lufthavn og militær base.
Et av Norges viktigste strategiske knutepunkter i nord. Dualiteten er ikke tilfeldig.`,
  },
  {
    id: 'sortland',
    title: 'Evenes → Sortland',

// ════════════════════════════════════════════════════════════════════════
// GALLERY STATE
// ════════════════════════════════════════════════════════════════════════
let currentSlide = 0;

function buildGallery(stage) {
  const slidesEl = document.getElementById('gallery-slides');
  const dotsEl   = document.getElementById('gallery-dots');
  slidesEl.innerHTML = '';
  dotsEl.innerHTML   = '';
  currentSlide = 0;

  stage.images.forEach((img, i) => {
    if (img.src) {
      const el = document.createElement('img');
      el.className = 'stage-gallery-slide';
      el.src = img.src;
      el.alt = img.alt;
      el.loading = i === 0 ? 'eager' : 'lazy';
      el.style.width = '100%';
      el.style.maxWidth = '100%';
      slidesEl.appendChild(el);
    } else {
      const el = document.createElement('div');
      el.className = 'stage-gallery-placeholder';
      el.innerHTML = '<span>BILDE KOMMER</span>';
      slidesEl.appendChild(el);
    }
    const dot = document.createElement('div');
    dot.className = 'gallery-dot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', () => goToSlide(i));
    dotsEl.appendChild(dot);
  });

  slidesEl.style.transform = 'translateX(0)';
}

function goToSlide(idx) {
  const slides = document.getElementById('gallery-slides');
  const dots   = document.querySelectorAll('.gallery-dot');
  const count  = STAGES[currentStageIdx].images.length;
  currentSlide = (idx + count) % count;
  slides.style.transform = `translateX(-${currentSlide * 100}%)`;
  dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
}

document.getElementById('gallery-prev').addEventListener('click', () => goToSlide(currentSlide - 1));
document.getElementById('gallery-next').addEventListener('click', () => goToSlide(currentSlide + 1));

// ════════════════════════════════════════════════════════════════════════
// STAGE NAV
// ════════════════════════════════════════════════════════════════════════
let currentStageIdx = 0;
let routeHistory    = [];
let routeLoading    = false;

function buildStageStrip() {
  const strip = document.getElementById('stage-strip');
  strip.innerHTML = '';
  STAGES.forEach((s, i) => {
    if (i > 0) {
      const arrow = document.createElement('span');
      arrow.className = 'stage-pip-arrow';
      arrow.textContent = '›';
      strip.appendChild(arrow);
    }
    const pip = document.createElement('button');
    pip.className = 'stage-pip' + (i === 0 ? ' active' : '');
    pip.textContent = s.title.split('→')[0].trim();
    pip.dataset.idx = i;
    pip.addEventListener('click', () => {
      if (parseInt(pip.dataset.idx) !== currentStageIdx) loadStage(parseInt(pip.dataset.idx));
    });
    strip.appendChild(pip);
  });
}

function updateStageStrip(idx) {
  document.querySelectorAll('.stage-pip').forEach((p, i) => {
    p.classList.remove('active', 'visited');
    if (i === idx) p.classList.add('active');
    else if (i < idx) p.classList.add('visited');
  });
  const activePip = document.querySelector('.stage-pip.active');
  if (activePip) activePip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

function loadStage(idx) {
  currentStageIdx = idx;
  const stage = STAGES[idx];

  updateStageStrip(idx);
  buildGallery(stage);

  document.getElementById('stage-num').textContent   = `ETAPPE ${idx + 1} AV ${STAGES.length}`;
  document.getElementById('stage-title').textContent  = stage.title;
  document.getElementById('stage-sub').textContent    = stage.sub;
  document.getElementById('olai-stage-label').textContent = stage.title;

  const tagsEl = document.getElementById('stage-tags');
  tagsEl.innerHTML = stage.tags.map(t => `<span class="stage-tag">${t}</span>`).join('');

  const ovEl = document.getElementById('stage-overnatting');
  ovEl.innerHTML = `<span class="stage-overnatting-label">OVERNATTING</span><div class="stage-overnatting-list">${stage.overnatting}</div>`;

  document.getElementById('stage-prev-btn').disabled = idx === 0;
  const nextBtn = document.getElementById('stage-next-btn');
  nextBtn.disabled = false;
  nextBtn.textContent = idx === STAGES.length - 1 ? 'Avslutt reisen ✓' : 'Neste etappe →';

  routeHistory = [];
  document.getElementById('route-messages').innerHTML = '';
  appendRouteMessage('olai', stage.opener);
  routeHistory.push({ role: 'assistant', content: stage.opener });

  if (voiceOn && ELEVEN_KEY) speakText(stage.opener);
  setTimeout(() => document.getElementById('route-input').focus(), 400);
}

document.getElementById('stage-prev-btn').addEventListener('click', () => {
  if (currentStageIdx > 0) loadStage(currentStageIdx - 1);
});
document.getElementById('stage-next-btn').addEventListener('click', () => {
  if (currentStageIdx < STAGES.length - 1) {
    loadStage(currentStageIdx + 1);
  } else {
    window.location.href = '/from-the-sofa.html';
  }
});

// ════════════════════════════════════════════════════════════════════════
// OLAI SYSTEM PROMPT
// ════════════════════════════════════════════════════════════════════════
function getOlaiPrompt(stage) {
  return `Du er Olai. 54 år. Fra Nyksund i Vesterålen — ett av de siste barna der før fraflyttingen på 70-tallet. Faren din var hvalfanger. Morfaren din var skreifisker. Du kjenner denne kysten som en gammel bekjent.

PERSONLIGHET:
- Ettertenksom, rolig. Forteller historier som om de var egne minner.
- Korte setninger med rom mellom. Sier «en» istedenfor «man».
- Bruker gamle stedsnavn naturlig. Forklarer bare hvis noen spør.
- «Havet glømme aldri.» — ikke et slagord. Noe du sier når noe treffer.
- Ikke varm velkomst-guide. Du er der, du vet, du forteller — på dine premisser.
- Du snakker alltid norsk.

NÅVÆRENDE POSISJON: ${stage.title}
${stage.sub}

KUNNSKAP OM DENNE ETAPPEN:
${stage.kb}

STIL:
- Maks 4–6 linjer per svar. Ikke ett ord mer.
- Aldri punktlister, aldri oppsummeringer.
- Presis og konkret — én ting om gangen.
- Avslutt ALLTID med enten ett åpent spørsmål ELLER én observasjon som bare henger der.
- Du sier «vi» — vi reiser dette sammen.

EKSEMPEL på tonen din:
«Havet glømme aldri.»
«Det var ikke abstrakt politikk — det var naboer som pakket.»
«Andøya ser ut som en annen planet. Men en planet som kjenner seg selv.»`;
}

// ════════════════════════════════════════════════════════════════════════
// CHAT
// ════════════════════════════════════════════════════════════════════════
const routeInput = document.getElementById('route-input');
const routeSend  = document.getElementById('route-send');

routeSend.addEventListener('click', () => sendRouteMessage());
routeInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendRouteMessage(); }
});

async function sendRouteMessage(text) {
  const msg = (text || routeInput.value).trim();
  if (!msg || routeLoading) return;
  stopAudio();
  routeInput.value = '';
  appendRouteMessage('user', msg);
  routeHistory.push({ role: 'user', content: msg });

  const typingId = showTyping();
  routeLoading = true;
  routeSend.disabled = true;

  try {
    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 500,
        system: getOlaiPrompt(STAGES[currentStageIdx]),
        messages: routeHistory.slice(-12).filter(m => m.role !== 'system'),
      }),
    });

    removeTyping(typingId);

    if (!res.ok && !res.headers.get('content-type')?.includes('application/json')) {
      appendRouteMessage('error', `Serverfeil ${res.status}`);
    } else {
      const data = await res.json();
      if (data.error) {
        appendRouteMessage('error', `API-feil: ${data.error.message}`);
      } else {
        const reply = data.content?.[0]?.text || 'Tomt svar.';
        appendRouteMessage('olai', reply, true);
        routeHistory.push({ role: 'assistant', content: reply });
        if (voiceOn && ELEVEN_KEY) speakText(reply);
      }
    }
  } catch (err) {
    removeTyping(typingId);
    appendRouteMessage('error', `Nettverksfeil: ${err.message}`);
  }
  routeLoading = false;
  routeSend.disabled = false;
  routeInput.focus();
}

function appendRouteMessage(role, text, withSpeakBtn = false) {
  const msgs = document.getElementById('route-messages');
  const row  = document.createElement('div');
  row.className = `route-msg-row${role === 'user' ? ' user' : ''}`;

  if (role === 'olai') {
    const av = document.createElement('img');
    av.className = 'route-olai-avatar';
    av.src = '/images/vesteralen/Olai.jpeg'; av.alt = 'Olai';
    row.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = `route-bubble ${role === 'user' ? 'user' : role === 'error' ? 'error' : 'olai'}`;

  const textNode = document.createElement('div');
  textNode.textContent = text;
  bubble.appendChild(textNode);

  if (withSpeakBtn && role === 'olai') {
    const btn = document.createElement('button');
    btn.className = 'speak-btn';
    btn.textContent = '🔊 Hør Olai';
    btn.addEventListener('click', () => speakText(text, btn));
    bubble.appendChild(btn);
  }

  row.appendChild(bubble);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

let typingCounter = 0;
function showTyping() {
  const id = 'typing-' + (++typingCounter);
  const msgs = document.getElementById('route-messages');
  const row  = document.createElement('div');
  row.className = 'route-msg-row';
  row.id = id;
  const av = document.createElement('img');
  av.className = 'route-olai-avatar';
  av.src = '/images/vesteralen/Olai.jpeg'; av.alt = 'Olai';
  row.appendChild(av);
  const bubble = document.createElement('div');
  bubble.className = 'route-bubble olai';
  bubble.innerHTML = '<div class="route-typing"><span></span><span></span><span></span></div>';
  row.appendChild(bubble);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return id;
}
function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

// ════════════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════════════
buildStageStrip();
loadStage(0);
</script>
