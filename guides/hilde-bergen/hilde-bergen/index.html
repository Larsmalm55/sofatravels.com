<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hilde · Bergen · SofaTravels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Crimson+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #080E14;
      --dark:     #0A1018;
      --border:   #1A2E3A;
      --sea:      #2A7FA8;
      --sea-lt:   #4DCCF0;
      --gold:     #C9A84C;
      --gold-lt:  #E8C97A;
      --text:     #EAE0CF;
      --sub:      #9AB0BA;
      --muted:    #5A7A8A;
      --panel:    #0C1820;
    }
    html, body {
      height: 100%; background: var(--bg);
      font-family: 'Crimson Text', Georgia, serif;
      color: var(--text); overflow: hidden;
    }

    /* ── LAYOUT ── */
    #app {
      display: flex; height: 100vh; overflow: hidden;
    }

    /* ── LEFT: PORTRAIT ── */
    #portrait-col {
      flex: 1; min-width: 0; position: relative;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    #portrait-inner {
      position: relative;
      height: 100%; aspect-ratio: 3/4;
      flex-shrink: 0; overflow: hidden;
      background: #000;
    }
    .portrait-slide {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain; object-position: center top;
      opacity: 0; transition: opacity 2s ease;
    }
    .portrait-slide.active { opacity: 1; }

    #portrait-light {
      position: absolute; inset: 0; pointer-events: none; z-index: 1;
      background: linear-gradient(155deg, rgba(8,14,20,0.08) 0%, transparent 50%);
      animation: lightshift 20s ease-in-out infinite;
    }
    @keyframes lightshift { 0%,100%{opacity:1} 50%{opacity:.6} }

    #portrait-mist {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 2; pointer-events: none;
      height: 52%;
      background: linear-gradient(to top,
        rgba(8,14,20,.97) 0%, rgba(8,14,20,.8) 22%,
        rgba(8,14,20,.35) 50%, transparent 100%);
    }

    #guide-badge {
      position: absolute; top: 16px; left: 16px; z-index: 10;
      display: flex; align-items: center; gap: 10px;
    }
    .badge-avatar {
      width: 34px; height: 34px; border-radius: 50%; overflow: hidden;
      border: 1.5px solid rgba(42,127,168,.5);
    }
    .badge-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .badge-name {
      font-family: 'Playfair Display', serif;
      font-size: .95rem; color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,.8);
    }
    .online-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #4CC87A; box-shadow: 0 0 7px rgba(76,200,122,.7);
      animation: op 3s infinite;
    }
    @keyframes op { 0%,100%{box-shadow:0 0 5px rgba(76,200,122,.4)} 50%{box-shadow:0 0 12px rgba(76,200,122,.9)} }

    #sted-badge {
      position: absolute; top: 16px; right: 16px; z-index: 10;
      background: rgba(8,14,20,.6); backdrop-filter: blur(12px);
      border: 1px solid rgba(201,168,76,.25); border-radius: 4px;
      padding: 5px 12px; text-align: right;
    }
    #sted-region { font-size: 8px; letter-spacing: .35em; color: var(--gold); margin-bottom: 1px; }
    #sted-name { font-family: 'Playfair Display', serif; font-size: .88rem; color: var(--text); }

    #slide-dots {
      position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; gap: 6px; align-items: center;
    }
    .sdot {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255,255,255,.25); transition: all .3s;
      cursor: pointer;
    }
    .sdot.active { background: var(--gold); transform: scale(1.3); }

    #portrait-controls {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      z-index: 10; display: flex; flex-direction: column; gap: 8px;
    }
    .p-ctrl {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(8,14,20,.65); backdrop-filter: blur(10px);
      border: 1px solid rgba(42,127,168,.2); color: rgba(234,224,207,.65);
      cursor: pointer; font-size: .9rem; transition: all .22s;
      display: flex; align-items: center; justify-content: center;
    }
    .p-ctrl:hover { border-color: rgba(42,127,168,.55); color: var(--text); }
    .p-ctrl.active { border-color: var(--sea); color: var(--sea-lt); background: rgba(42,127,168,.15); }

    /* ── CHAT ── */
    #chat-area {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
      transition: opacity .35s, transform .35s;
    }
    #chat-area.hidden { opacity: 0; transform: translateY(10px); pointer-events: none; }

    #messages-wrap {
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 100%);
      pointer-events: none;
    }
    #messages {
      overflow-y: auto; padding: 10px 20px 6px;
      display: flex; flex-direction: column; gap: 9px;
      max-height: 44vh; pointer-events: all;
    }
    #messages::-webkit-scrollbar { width: 2px; }
    #messages::-webkit-scrollbar-thumb { background: rgba(42,127,168,.2); }

    .msg-row { display: flex; gap: 8px; align-items: flex-end; }
    .msg-row.user { justify-content: flex-end; }
    .msg-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      object-fit: cover; flex-shrink: 0;
      border: 1px solid rgba(42,127,168,.35);
    }
    .msg-bubble {
      max-width: 70%; padding: 9px 14px;
      line-height: 1.65; font-size: .9rem;
    }
    .msg-bubble.bot {
      background: rgba(10,16,24,0.84); backdrop-filter: blur(16px);
      color: #D8CCBC; border: 1px solid rgba(42,127,168,.2);
      border-radius: 12px 12px 12px 3px;
    }
    .msg-bubble.bot a { color: var(--sea); text-decoration: underline; text-underline-offset: 3px; }
    .msg-bubble.bot em { color: rgba(201,168,76,.65); font-style: italic; }
    .msg-bubble.user-b {
      background: rgba(20,38,52,.88); backdrop-filter: blur(16px);
      color: var(--text); border: 1px solid rgba(42,127,168,.18);
      border-radius: 12px 12px 3px 12px;
    }
    .msg-bubble.error { background: rgba(60,10,0,.85); color: #FF9966; border-radius: 8px; }
    .speak-btn {
      display: inline-block; margin-top: 6px; background: none;
      border: 1px solid rgba(42,127,168,.22); color: var(--muted);
      border-radius: 4px; padding: 2px 8px; font-size: .66rem;
      cursor: pointer; font-family: inherit; transition: all .2s;
    }
    .speak-btn:hover { border-color: var(--sea); color: var(--sea-lt); }
    .speak-btn.playing { border-color: var(--sea); color: var(--sea-lt); background: rgba(42,127,168,.1); }
    .speak-btn.loading { opacity: .5; cursor: default; }
    .typing { color: var(--sea); letter-spacing: .3em; animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }

    .sound-row { padding: 2px 20px 4px; display: flex; align-items: center; gap: 5px; }
    .sound-bars { display: flex; gap: 2px; align-items: flex-end; height: 10px; }
    .sound-bar { width: 2px; background: var(--sea); border-radius: 1px; animation: sw 1.2s ease-in-out infinite; }
    .sound-bar:nth-child(1){height:3px;animation-delay:0s}
    .sound-bar:nth-child(2){height:7px;animation-delay:.15s}
    .sound-bar:nth-child(3){height:10px;animation-delay:.3s}
    .sound-bar:nth-child(4){height:5px;animation-delay:.45s}
    .sound-bar:nth-child(5){height:8px;animation-delay:.6s}
    @keyframes sw { 0%,100%{transform:scaleY(.35);opacity:.35} 50%{transform:scaleY(1);opacity:1} }
    .sound-bars.paused .sound-bar { animation-play-state: paused; opacity: .2; }
    #sound-label { font-size: .6rem; color: var(--muted); letter-spacing: .08em; }

    #input-row {
      display: flex; gap: 8px; padding: 10px 16px 14px;
      background: rgba(8,14,20,.9); backdrop-filter: blur(20px);
      border-top: 1px solid rgba(42,127,168,.1);
    }
    #chat-input {
      flex: 1; background: rgba(10,18,28,.92);
      border: 1px solid var(--border);
      color: var(--text); padding: 10px 18px; border-radius: 22px;
      font-size: .9rem; outline: none;
      font-family: 'Crimson Text', Georgia, serif;
      transition: border-color .2s;
    }
    #chat-input:focus { border-color: rgba(42,127,168,.5); }
    #chat-input::placeholder { color: var(--muted); }
    #send-btn {
      width: 44px; height: 44px; border-radius: 50%; border: none;
      background: var(--sea); color: #fff; font-size: 1.1rem;
      cursor: pointer; transition: all .2s; flex-shrink: 0; align-self: center;
    }
    #send-btn:hover { background: #3A9FC8; transform: scale(1.06); }
    #send-btn:disabled { opacity: .35; cursor: default; transform: none; }

    /* ── HEADER ── */
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      height: 48px;
      background: rgba(8,14,20,.92); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; gap: 12px;
    }
    #back-btn {
      background: none; border: 1px solid rgba(201,168,76,.3); color: var(--gold);
      padding: 4px 12px; border-radius: 4px; cursor: pointer;
      font-size: .72rem; letter-spacing: .1em; font-family: inherit;
      transition: all .2s; text-decoration: none; display: inline-block;
    }
    #back-btn:hover { border-color: var(--gold); background: rgba(201,168,76,.08); }
    .hdr-spacer { flex: 1; }
    .hdr-title {
      font-family: 'Playfair Display', serif;
      font-size: .82rem; letter-spacing: .2em; color: var(--sub);
      text-align: center;
    }
    .hdr-title span { color: var(--gold); }
    .hdr-controls { flex: 1; display: flex; justify-content: flex-end; gap: 6px; }
    .hdr-btn {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(12,24,32,.7); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; font-size: .82rem;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    .hdr-btn:hover { border-color: var(--sea); color: var(--text); }
    .hdr-btn.active { border-color: var(--sea); color: var(--sea-lt); background: rgba(42,127,168,.15); }

    .api-banner { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 999; background: #0A1820; border-bottom: 2px solid var(--sea); padding: 10px 20px; align-items: center; gap: 12px; flex-wrap: wrap; }
    .api-banner.show { display: flex; }
    .api-banner label { font-size: .82rem; color: var(--text); }
    .api-banner label strong { color: var(--sea); }
    .api-banner input { flex: 1; min-width: 200px; background: #0A1420; border: 1px solid rgba(42,127,168,.4); color: var(--text); padding: 6px 12px; border-radius: 4px; font-size: .8rem; font-family: monospace; outline: none; }
    .api-banner button { background: var(--sea); border: none; color: #fff; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: .8rem; }
    .banner-close { background: none !important; color: var(--muted) !important; padding: 4px 8px !important; }

    #app { padding-top: 48px; }
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  </style>
</head>
<body>

<!-- HEADER -->
<header id="top-bar">
  <a href='/from-the-sofa' id='back-btn'>← Guider</a>
  <div class="hdr-spacer"></div>
  <div class="hdr-title">SOFATRAVELS · <span>BERGEN</span></div>
  <div class="hdr-controls">

</header>

<!-- API BANNER -->
<div id="eleven-banner" class="api-banner">

  <button id="eleven-key-save">Lagre</button>

</div>

<!-- MAIN -->
<div id="app">
  <div id="portrait-col">
    <div id="portrait-inner">

      <!-- Slideshow — bytt src med egne Bergen-bilder -->
      <img class="portrait-slide active" src="hilde-bergen.jpg" alt="Hilde i Bergen" id="slide-0" />
      <img class="portrait-slide" src="bergen-bryggen.jpg" alt="Bryggen" id="slide-1" />
      <img class="portrait-slide" src="bergen-fisketorget.jpg" alt="Fisketorget" id="slide-2" />
      <img class="portrait-slide" src="bergen-skostredet.jpg" alt="Skostredet" id="slide-3" />
      <img class="portrait-slide" src="bergen-natt.jpg" alt="Bergen om kvelden" id="slide-4" />

      <div id="portrait-light"></div>
      <div id="portrait-mist"></div>

      <!-- Guide badge -->
      <div id="guide-badge">
        <div class="badge-avatar"><img src="hilde-bergen.jpg" alt="Hilde" id="badge-img" /></div>
        <span class="badge-name">Hilde</span>
        <span class="online-dot"></span>
      </div>

      <!-- Sted badge -->
      <div id="sted-badge">
        <div id="sted-region">VESTLAND · NORGE</div>
        <div id="sted-name">Bergen</div>
      </div>

      <!-- Slide dots -->
      <div id="slide-dots">
        <div class="sdot active" data-idx="0"></div>
        <div class="sdot" data-idx="1"></div>
        <div class="sdot" data-idx="2"></div>

      <!-- Controls -->
      <div id="portrait-controls">
        <button class="p-ctrl" id="eye-btn" title="Skjul/vis chat">👁</button>
        <button class="p-ctrl" id="sound-ctrl-btn" title="Lyd">🔕</button>
      </div>

      <!-- Chat -->
      <div id="chat-area">
        <div id="messages-wrap">

        </div>
        <div class="sound-row">
          <div class="sound-bars paused" id="sound-bars">
            <div class="sound-bar"></div><div class="sound-bar"></div>
            <div class="sound-bar"></div><div class="sound-bar"></div>
            <div class="sound-bar"></div>
          </div>
          <span id="sound-label">Lyd av</span>
        </div>
        <div id="input-row">
          <input type="search" id="chat-input" autocomplete="off"
                 autocorrect="off" autocapitalize="off" spellcheck="false"
                 placeholder="Spør Hilde…" />

        </div>
      </div>

    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════
// SLIDESHOW
// ════════════════════════════════════════
const slides = document.querySelectorAll('.portrait-slide');
const dots = document.querySelectorAll('.sdot');
let currentSlide = 0;
let slideInterval;

function goToSlide(n) {
  slides[currentSlide].classList.remove('active');
  dots[currentSlide].classList.remove('active');
  currentSlide = (n + slides.length) % slides.length;
  slides[currentSlide].classList.add('active');
  dots[currentSlide].classList.add('active');
}

function startSlideshow() {
  slideInterval = setInterval(() => goToSlide(currentSlide + 1), 12000);
}

dots.forEach(dot => {
  dot.addEventListener('click', () => {
    clearInterval(slideInterval);
    goToSlide(parseInt(dot.dataset.idx));
    startSlideshow();
  });
});

startSlideshow();

// ════════════════════════════════════════
// ELEVENLABS
// ════════════════════════════════════════
let ELEVEN_KEY = localStorage.getItem('st_eleven') || '';
let voiceOn = false;
let currentAudio = null;
const HILDE_VOICE_ID = 'jsCqWAovK2LkecY7zXl4';

document.getElementById('eleven-key-save').onclick = () => {
  const v = document.getElementById('eleven-key-input').value.trim();
  if (v.length > 10) {
    ELEVEN_KEY = v; localStorage.setItem('st_eleven', v);
    document.getElementById('eleven-banner').classList.remove('show');
    enableVoice();
  }
};
document.getElementById('eleven-banner-close').onclick = () =>
  document.getElementById('eleven-banner').classList.remove('show');
document.getElementById('settings-btn').onclick = () =>
  document.getElementById('eleven-banner').classList.toggle('show');
document.getElementById('voice-btn').onclick = () => {
  if (!ELEVEN_KEY) { document.getElementById('eleven-banner').classList.add('show'); return; }
  voiceOn = !voiceOn; updateVoiceBtn();
};
function enableVoice() { voiceOn = true; updateVoiceBtn(); }
function updateVoiceBtn() {
  const b = document.getElementById('voice-btn');
  b.textContent = voiceOn ? '🔊' : '🔇';
  b.classList.toggle('active', voiceOn);
}
if (ELEVEN_KEY) enableVoice();

// ════════════════════════════════════════
// UI CONTROLS
// ════════════════════════════════════════
let chatHidden = false;
document.getElementById('eye-btn').onclick = () => {
  chatHidden = !chatHidden;
  document.getElementById('chat-area').classList.toggle('hidden', chatHidden);
  document.getElementById('eye-btn').classList.toggle('active', chatHidden);
};

let ambientOn = false;
let ambientAudio = null;
function toggleAmbient() {
  ambientOn = !ambientOn;
  if (ambientOn) {
    if (!ambientAudio) {
      ambientAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2515/2515-preview.mp3');
      ambientAudio.loop = true; ambientAudio.volume = 0.18;
    }
    ambientAudio.play().catch(()=>{});
    document.getElementById('sound-bars').classList.remove('paused');
  } else {
    if (ambientAudio) ambientAudio.pause();
    document.getElementById('sound-bars').classList.add('paused');
  }
  document.getElementById('sound-label').textContent = ambientOn ? 'Bergen · regn og havn' : 'Lyd av';
  document.getElementById('sound-ctrl-btn').textContent = ambientOn ? '🔔' : '🔕';
  document.getElementById('sound-ctrl-btn').classList.toggle('active', ambientOn);
}
document.getElementById('sound-btn').onclick = toggleAmbient;
document.getElementById('sound-ctrl-btn').onclick = toggleAmbient;

// ════════════════════════════════════════
// KNOWLEDGE BASE — BERGEN
// ════════════════════════════════════════
const BERGEN_KB = `
BERGEN — FAKTA OG HISTORIER

HILDES TILNÆRMING
Hilde beskriver aldri bygninger eller severdigheter i seg selv.
Hun forteller hva som skjedde der. Hva folk ikke vet.
Stedet er scenen — historien er det som teller.

HISTORIER PÅ STEDER

Bergenhus festning / Holmen:
Kristkirken stod her — Bergens opprinnelige domkirke fra 1000-tallet,
gravsted for kong Magnus Lagabøte. I 1531 beordret den dansk-norske
kongen at den skulle rives — ikke av religiøse grunner, men fordi den
lå for nær festningsmurene og ga fiender for godt skuddfelt.
Så grundig revet at ingen mur er igjen. Bare grunnplanet, markert
med hekker i gresset. De fleste går forbi uten å vite hva som ligger der.

Domkirken:
Anne Pedersdatter. Presteenke, 47 år. Brent på bålet på Nordnes
7. april 1590. 48 mennesker vitnet mot henne — naboer, venner.
Anklagene: at hun hadde tatt livet av seks mennesker, skadet husdyr,
og planlagt å ødelegge Bergen med brann og oversvømmelse.
Det virkelige oppgjøret handlet om en bitter maktkamp i byens elite
etter en teologisk strid år i forveien. Hun var et middel, ikke målet.

Enhjørningsgården på Bryggen:
Bak en uanselig dør i en av Bryggens eldste gårder ligger et rom
på størrelse med et lite soverom. Her holdt Theta-gruppen til —
19-22 år gamle ungdommer som fra 1940 sendte ukentlige rapporter
om tyske skipsposisjoner over Nordsjøen til britisk etterretning.
Avslørt av Gestapo i 1942, ved et uhell. Rommet er bevart.
De fleste Bryggen-besøkende vet ikke det finnes.

Hollendergaten:
En av Bergens eldste gater, nevnt i 1518. Nederlandske kjøpmenn
hadde sine boder her — kongelig pålegg om at innvandrere skulle
holde seg i bestemte strøk. Hollendergaten, Skottegaten,
Hamburgersmauet — Bergen sorterte folket etter nasjonalitet.
Trehusene er gjenreist etter bybrannen i 1702, men steinkjellerene
er eldre. Det som ser ut som 1700-tall er bygget over noe mye tyngre.

Dyvekes Vinkjeller, Hollendergaten:
Dyveke Sigbrittsdatter vokste opp her. I 1509 møtte hun den danske
tronfølgeren Christian på et vertshus i Bergen — han ble hodestups
forelsket. Da han ble konge tok han henne til København som sin frille.
Moren Sigbrit ble kongens viktigste rådgiver.
Dyveke døde 27 år gammel i 1517, trolig forgiftet.
Baren som bærer hennes navn hevder å ha røtter til 1300-tallet.

Skottegaten og Nøstet:
Skottegaten er oppkalt etter innvandrede skotske kjøpmenn fra 1600-tallet.
Kongen bestemte hvor de skulle bo. Nøstet under var arbeiderstrøket —
fiskere, sjøfolk, tobakksspinnere. Tett, uregelmessig, mange smau.
16. mai 1930 brøt det ut brann i bodene på Nøstet. 188 familier
ble husløse. 60 bygninger brant.
`;

// ════════════════════════════════════════
// HILDE — PERSONLIGHET (KONSTANT)
// ════════════════════════════════════════
const HILDE_KB = `
HVEM DU ER:
Du er Hilde. 35 år, oppvokst på Vestlandet, har levd langs
norskekysten det meste av livet ditt. Du er ikke guide i turistisk
forstand — du er en som ble værende på steder andre bare passerte
gjennom. Du kjenner Bergen godt. Du har en liten leilighet i Parkveien
oppe på høyden.

BAKGRUNN:
Du kjenner Norge fra innsiden. Ikke fra brosjyrer eller statistikk,
men fra å ha sittet lenge nok på de riktige stedene til at folk
begynte å fortelle deg ting. Du bærer på historier du ikke alltid
forteller med én gang.

PERSONLIGHET:
Varm — fordi du er genuint nysgjerrig på mennesker, ikke fordi du
er programmert til å være blid. En svak melankoli under overflaten —
ikke tristhet, men en bevissthet om at ting forgår og at det er
verdt å merke seg. Forsiktig humor, aldri på andres bekostning.
Tålmodig lytter. Husker hva folk sier.

HVORDAN DU SNAKKER:
- Korte setninger. Du lar dem lande før du fortsetter.
- Du starter gjerne med en observasjon, ikke et svar.
- Du ramser aldri opp severdigheter.
- Du forteller historier fremfor å liste fakta.
- Du innrømmer når du ikke vet — uten å unnskylde deg.
- Du avbryter aldri.
- Du sier aldri "dette må du se."

HILDES BERGEN:
Bergen kjennes ikke som en by hun besøker — mer som en by hun
bærer med seg. Lag på lag med handel, sjøfart og liv. Ikke tungt.
Mer som en vedvarende bakgrunnstone hun alltid hører.

Hun starter alltid ved Fisketorget — lukten av sjømat setter henne
i riktig modus. Går langs Bryggen på båtsiden, ikke inne i
turiststrømmen. Setter seg gjerne på Skostredet utpå kvelden.
Kjenner seg mest hjemme i de skjeve smauene mellom Øvregaten og
Bryggen — der ingen har hastverk.

Bergen er ikke et sted du reiser til. Det er et sted du faller tilbake til.
`;

// ════════════════════════════════════════
// SYSTEM PROMPT
// ════════════════════════════════════════
function getSystemPrompt(n) {
  const fase = n >= 8
    ? 'DYPERE LAG (melding ' + n + '): La noe av det skjulte komme frem. Én ting. Naturlig. Aldri brått.'
    : 'TIDLIG (melding ' + n + '): Bli kjent. Still spørsmål. Bergen kommer når det passer.';

  return HILDE_KB
    + '\n\n' + fase
    + '\n\nSTEDSKUNNSKAP BERGEN:\n' + BERGEN_KB
    + '\n\nSTIL — STRENGT:'
    + '\nMaks 50 ord per svar. Tell dem. Aldri mer.'
    + '\nAldri punktlister. Aldri oppsummeringer.'
    + '\nEn tanke. En detalj. En setning som henger igjen.'
    + '\nAvslutt med ett spørsmål ELLER én observasjon — aldri begge.'
    + '\nHandlinger på egen linje, kursiv, maks 5 ord: *setter fra seg kaffekoppen*'
    + '\nAltid norsk.';
}

// ════════════════════════════════════════
// MESSAGES
// ════════════════════════════════════════
let chatHistory = [], isLoading = false, userMsgCount = 0;
const messagesEl = document.getElementById('messages');
const chatInput = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');

function parseLinks(t) {
  const clean = t.replace(/<!--[^>]*-->/g, '').trim();
  return clean
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*([^*\n]+)\*/g,'<em>$1</em>')
    .replace(/\n\n\n+/g,'\n\n')
    .replace(/\n/g,'<br>');
}

function appendMessage(role, text, withSpeak=false) {
  const row = document.createElement('div');
  row.className = 'msg-row' + (role==='user' ? ' user' : '');
  if (role !== 'user') {
    const av = document.createElement('img');
    av.src = 'hilde-bergen.jpg'; av.className = 'msg-avatar'; av.alt = 'Hilde';
    row.appendChild(av);
  }
  const bub = document.createElement('div');
  bub.className = 'msg-bubble ' + (role==='user' ? 'user-b' : role==='error' ? 'error' : 'bot');
  bub.innerHTML = parseLinks(text);
  if (withSpeak && ELEVEN_KEY) {
    const sp = document.createElement('button');
    sp.className = 'speak-btn'; sp.textContent = '🔊 Hør';
    sp.onclick = () => speakText(text, sp);
    bub.appendChild(sp);
  }
  row.appendChild(bub);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row'; row.id = 'typing-row';
  const av = document.createElement('img');
  av.src = 'hilde-bergen.jpg'; av.className = 'msg-avatar'; av.alt = 'Hilde';
  row.appendChild(av);
  const bub = document.createElement('div');
  bub.className = 'msg-bubble bot';
  bub.innerHTML = '<span class="typing">···</span>';
  row.appendChild(bub);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row.id;
}
function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

async function sendMessage() {
  const msg = chatInput.value.trim();
  if (!msg || isLoading) return;
  chatInput.value = '';
  isLoading = true; sendBtn.disabled = true;
  userMsgCount++;
  appendMessage('user', msg);
  chatHistory.push({ role: 'user', content: msg });
  const tid = addTyping();
  try {
    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: chatHistory,
        system: getSystemPrompt(userMsgCount)
      })
    });
    removeTyping(tid);
    if (!res.ok) { appendMessage('error', 'Serverfeil ' + res.status); }
    else {
      const data = await res.json();
      if (data.error) { appendMessage('error', 'API-feil: ' + data.error.message); }
      else {
        const reply = data.content?.[0]?.text || '';
        chatHistory.push({ role: 'assistant', content: reply });
        appendMessage('assistant', reply, true);
        if (voiceOn && ELEVEN_KEY) speakText(reply, null);
      }
    }
  } catch(err) { removeTyping(tid); appendMessage('error', 'Nettverksfeil: ' + err.message); }
  isLoading = false; sendBtn.disabled = false;
  chatInput.focus();
}

sendBtn.onclick = sendMessage;
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

// ════════════════════════════════════════
// ELEVENLABS TTS
// ════════════════════════════════════════
async function speakText(text, btn) {
  if (!ELEVEN_KEY) return;
  const plain = text.replace(/<[^>]+>/g,'').replace(/\*[^*]+\*/g,'').trim();
  if (!plain) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (btn) { btn.textContent = '⏳'; btn.classList.add('loading'); }
  try {
    const r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${HILDE_VOICE_ID}`, {
      method: 'POST',
      headers: { 'xi-api-key': ELEVEN_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: plain, model_id: 'eleven_multilingual_v2',
        voice_settings: { stability: 0.48, similarity_boost: 0.82, style: 0.12, use_speaker_boost: true } })
    });
    if (!r.ok) throw new Error('TTS feil');
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    currentAudio = new Audio(url);
    if (btn) { btn.textContent = '⏸ Pause'; btn.classList.remove('loading'); btn.classList.add('playing'); }
    currentAudio.onended = () => {
      if (btn) { btn.textContent = '🔊 Hør'; btn.classList.remove('playing'); }
      currentAudio = null;
    };
    currentAudio.play();
    if (btn) btn.onclick = () => {
      if (currentAudio) { currentAudio.pause(); currentAudio = null;
        btn.textContent = '🔊 Hør'; btn.classList.remove('playing'); }
      else speakText(text, btn);
    };
  } catch(e) {
    if (btn) { btn.textContent = '🔊 Hør'; btn.classList.remove('loading','playing'); }
  }
}

  appendMessage('assistant', welcome);
});
