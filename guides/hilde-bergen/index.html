<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hilde · Bergen · SofaTravels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Crimson+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #080E14;
      --border: #1A2E3A;
      --sea:    #2A7FA8;
      --sea-lt: #4DCCF0;
      --gold:   #C9A84C;
      --text:   #EAE0CF;
      --sub:    #9AB0BA;
      --muted:  #5A7A8A;
    }
    html, body {
      height: 100%; background: var(--bg);
      font-family: 'Crimson Text', Georgia, serif;
      color: var(--text); overflow: hidden;
    }

    /* ══ TOP BAR ══ */
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 46px;
      background: rgba(8,14,20,.96); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; gap: 12px;
    }
    #back-btn {
      background: none; border: 1px solid rgba(201,168,76,.3); color: var(--gold);
      padding: 4px 12px; border-radius: 4px; cursor: pointer;
      font-size: .72rem; letter-spacing: .1em; font-family: inherit;
      transition: all .2s; text-decoration: none;
    }
    #back-btn:hover { border-color: var(--gold); background: rgba(201,168,76,.08); }
    .hdr-center {
      flex: 1; text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: .8rem; letter-spacing: .25em; color: var(--sub);
    }
    .hdr-center span { color: var(--gold); }
    .hdr-right { display: flex; gap: 6px; }
    .hdr-btn {
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(12,24,32,.7); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; font-size: .8rem;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    .hdr-btn:hover { border-color: var(--sea); color: var(--text); }
    .hdr-btn.active { border-color: var(--sea); color: var(--sea-lt); background: rgba(42,127,168,.15); }

    /* ══ MAIN ══ */
    #app {
      display: flex; height: 100vh; padding-top: 46px; overflow: hidden;
    }

    /* ══ LEFT — SLIDESHOW ══ */
    #left-col {
      flex: 0 0 62%; position: relative;
      background: #000; overflow: hidden;
      min-width: 300px;
    }
    .portrait-slide {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: center top;
      opacity: 0; transition: opacity 2.2s ease;
    }
    .portrait-slide.active { opacity: 1; }
    #left-mist {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
      height: 28%;
      background: linear-gradient(to top,
        rgba(8,14,20,1) 0%, rgba(8,14,20,.6) 40%, transparent 100%);
      pointer-events: none;
    }
    #left-mist-side {
      position: absolute; top: 0; right: 0; bottom: 0; z-index: 2;
      width: 18%;
      background: linear-gradient(to left,
        rgba(8,14,20,.85) 0%, transparent 100%);
      pointer-events: none;
    }

    /* Guide badge */
    #guide-badge {
      position: absolute; top: 14px; left: 14px; z-index: 10;
      display: flex; align-items: center; gap: 9px;
    }
    .badge-av {
      width: 32px; height: 32px; border-radius: 50%; overflow: hidden;
      border: 1.5px solid rgba(42,127,168,.5);
    }
    .badge-av img { width: 100%; height: 100%; object-fit: cover; }
    .badge-name {
      font-family: 'Playfair Display', serif;
      font-size: .9rem; color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,.9);
    }
    .online-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #4CC87A; box-shadow: 0 0 6px rgba(76,200,122,.8);
      animation: pulse-dot 3s infinite;
    }
    @keyframes pulse-dot {
      0%,100% { box-shadow: 0 0 4px rgba(76,200,122,.4); }
      50%      { box-shadow: 0 0 10px rgba(76,200,122,.9); }
    }

    /* Location badge */
    #loc-badge {
      position: absolute; top: 14px; right: 14px; z-index: 10;
      background: rgba(8,14,20,.65); backdrop-filter: blur(12px);
      border: 1px solid rgba(201,168,76,.25); border-radius: 4px;
      padding: 5px 12px; text-align: right;
    }
    #loc-region { font-size: 7.5px; letter-spacing: .35em; color: var(--gold); margin-bottom: 1px; }
    #loc-name { font-family: 'Playfair Display', serif; font-size: .85rem; color: var(--text); }

    /* Slide dots */
    #slide-dots {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; gap: 6px;
    }
    .sdot {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255,255,255,.22); transition: all .3s; cursor: pointer;
    }
    .sdot.active { background: var(--gold); transform: scale(1.35); }

    /* ══ RIGHT COL ══ */
    #right-col {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      background: var(--bg); overflow: hidden;
      border-left: 1px solid var(--border);
    }

    /* ── Right top: topics + hilde panel ── */
    #right-top {
      display: flex; flex-direction: row;
      flex: 0 0 44%;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    /* Topics */
    #topics-panel {
      flex: 0 0 48%;
      padding: 14px 14px 10px;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .tp-region { font-size: 7px; letter-spacing: .35em; color: var(--gold); margin-bottom: 1px; }
    .tp-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem; color: var(--text); margin-bottom: 1px;
    }
    .tp-tagline {
      font-size: .7rem; color: var(--muted); font-style: italic;
      margin-bottom: 10px; line-height: 1.4;
      transition: all .35s; overflow: hidden; max-height: 32px;
    }
    /* tagline alltid synlig */
    .tp-label { font-size: 7px; letter-spacing: .3em; color: var(--muted); margin-bottom: 6px; flex-shrink: 0; }
    #topics {
      display: flex; flex-direction: column; gap: 4px;
      overflow: hidden; flex: 1;
      transition: opacity .35s;
    }
    /* temaer alltid synlige */
    .topic-btn {
      background: rgba(10,20,30,.9);
      border: 1px solid rgba(42,127,168,.18);
      color: var(--sub); padding: 6px 10px; border-radius: 4px;
      font-size: .72rem; cursor: pointer; font-family: inherit;
      text-align: left; transition: all .2s; line-height: 1.35;
      flex-shrink: 0;
    }
    .topic-btn:hover {
      border-color: rgba(42,127,168,.55);
      color: var(--text); background: rgba(42,127,168,.1);
    }

    /* Hilde portrait panel */
    #hilde-panel {
      flex: 1; position: relative; overflow: hidden; background: #050A0F;
    }
    #hilde-panel video,
    #hilde-panel img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center top;
    }
    #hilde-panel-overlay {
      position: absolute; inset: 0; pointer-events: none;
      background:
        linear-gradient(to top,  rgba(8,14,20,.9) 0%, rgba(8,14,20,.2) 35%, transparent 65%),
        linear-gradient(to right, rgba(8,14,20,.6) 0%, transparent 40%);
    }
    #hilde-panel-name {
      position: absolute; bottom: 10px; left: 12px;
      font-family: 'Playfair Display', serif;
      font-size: .82rem; color: rgba(234,224,207,.8);
      letter-spacing: .05em;
    }
    #hilde-panel-sub {
      font-size: .6rem; letter-spacing: .15em;
      color: var(--gold); display: block; margin-bottom: 2px;
    }

    /* ── Chat ── */
    #chat-col {
      flex: 1; display: flex; flex-direction: column;
      min-height: 0; overflow: hidden;
    }
    #tip-bar {
      padding: 5px 16px 3px;
      font-size: .68rem; color: var(--muted);
      border-bottom: 1px solid rgba(26,46,58,.4);
      flex-shrink: 0;
    }
    #messages {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 12px 16px 6px;
      display: flex; flex-direction: column; gap: 8px;
    }
    #messages::-webkit-scrollbar { width: 2px; }
    #messages::-webkit-scrollbar-thumb { background: rgba(42,127,168,.2); }

    .msg-row { display: flex; gap: 7px; align-items: flex-end; }
    .msg-row.user { justify-content: flex-end; }
    .msg-av {
      width: 24px; height: 24px; border-radius: 50%;
      object-fit: cover; flex-shrink: 0;
      border: 1px solid rgba(42,127,168,.3);
    }
    .msg-bubble {
      max-width: 86%; padding: 8px 12px;
      line-height: 1.6; font-size: .88rem;
    }
    .msg-bubble.bot {
      background: rgba(10,20,30,.92);
      color: #D4C8B6;
      border: 1px solid rgba(42,127,168,.18);
      border-radius: 10px 10px 10px 2px;
    }
    .msg-bubble.bot em {
      color: rgba(201,168,76,.6); font-style: italic;
    }
    .msg-bubble.user-b {
      background: rgba(18,34,48,.92);
      color: var(--text);
      border: 1px solid rgba(42,127,168,.15);
      border-radius: 10px 10px 2px 10px;
    }
    .msg-bubble.error {
      background: rgba(60,10,0,.85); color: #FF9966; border-radius: 6px;
    }
    .speak-btn {
      display: inline-block; margin-top: 5px; background: none;
      border: 1px solid rgba(42,127,168,.2); color: var(--muted);
      border-radius: 4px; padding: 2px 7px; font-size: .64rem;
      cursor: pointer; font-family: inherit; transition: all .2s;
    }
    .speak-btn:hover { border-color: var(--sea); color: var(--sea-lt); }
    .speak-btn.playing { border-color: var(--sea); color: var(--sea-lt); background: rgba(42,127,168,.1); }
    .typing { color: var(--sea); letter-spacing: .3em; animation: blink 1.4s infinite; }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }

    #input-row {
      display: flex; gap: 8px; padding: 9px 14px 12px;
      background: rgba(8,14,20,.96); backdrop-filter: blur(16px);
      border-top: 1px solid var(--border); flex-shrink: 0;
    }
    #chat-input {
      flex: 1; background: rgba(10,18,28,.94);
      border: 1px solid var(--border); color: var(--text);
      padding: 9px 16px; border-radius: 20px;
      font-size: .88rem; outline: none;
      font-family: 'Crimson Text', Georgia, serif;
      transition: border-color .2s;
    }
    #chat-input:focus { border-color: rgba(42,127,168,.5); }
    #chat-input::placeholder { color: var(--muted); }
    #send-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: var(--sea); color: #fff; font-size: 1rem;
      cursor: pointer; transition: all .2s;
      flex-shrink: 0; align-self: center;
    }
    #send-btn:hover { background: #3A9FC8; transform: scale(1.06); }
    #send-btn:disabled { opacity: .35; cursor: default; transform: none; }

    /* API banner */
    .api-banner {
      display: none; position: fixed; top: 46px; left: 0; right: 0; z-index: 99;
      background: #0A1820; border-bottom: 2px solid var(--sea);
      padding: 8px 20px; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .api-banner.show { display: flex; }
    .api-banner label { font-size: .8rem; color: var(--text); }
    .api-banner label strong { color: var(--sea); }
    .api-banner input {
      flex: 1; min-width: 180px; background: #0A1420;
      border: 1px solid rgba(42,127,168,.4); color: var(--text);
      padding: 5px 10px; border-radius: 4px; font-size: .78rem;
      font-family: monospace; outline: none;
    }
    .api-banner button {
      background: var(--sea); border: none; color: #fff;
      padding: 5px 12px; border-radius: 4px; cursor: pointer;
      font-size: .78rem;
    }
    .banner-close { background: none !important; color: var(--muted) !important; }

    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  </style>
</head>
<body>

<!-- TOP BAR -->
<header id="top-bar">

<script>
// ══ SLIDESHOW ══
const slides = document.querySelectorAll('.portrait-slide');
const dots   = document.querySelectorAll('.sdot');
let cur = 0, timer;
function goTo(n) {
  slides[cur].classList.remove('active'); dots[cur].classList.remove('active');
  cur = (n + slides.length) % slides.length;
  slides[cur].classList.add('active'); dots[cur].classList.add('active');
}
function startTimer() { timer = setInterval(() => goTo(cur + 1), 12000); }
dots.forEach(d => d.addEventListener('click', () => {
  clearInterval(timer); goTo(+d.dataset.idx); startTimer();
}));
startTimer();

// ══ ELEVENLABS ══
let ELEVEN_KEY = localStorage.getItem('st_eleven') || '';
let voiceOn = false, currentAudio = null;
const VOICE_ID = 'jsCqWAovK2LkecY7zXl4';

document.getElementById('eleven-key-save').onclick = () => {
  const v = document.getElementById('eleven-key-input').value.trim();
  if (v.length > 10) {
    ELEVEN_KEY = v; localStorage.setItem('st_eleven', v);
    document.getElementById('eleven-banner').classList.remove('show');
    voiceOn = true; updateVoiceBtn();
  }
};
document.getElementById('eleven-banner-close').onclick = () =>
  document.getElementById('eleven-banner').classList.remove('show');
document.getElementById('settings-btn').onclick = () =>
  document.getElementById('eleven-banner').classList.toggle('show');
document.getElementById('voice-btn').onclick = () => {
  if (!ELEVEN_KEY) { document.getElementById('eleven-banner').classList.add('show'); return; }
  voiceOn = !voiceOn; updateVoiceBtn();
};
function updateVoiceBtn() {
  const b = document.getElementById('voice-btn');
  b.textContent = voiceOn ? '🔊' : '🔇';
  b.classList.toggle('active', voiceOn);
}
if (ELEVEN_KEY) { voiceOn = true; updateVoiceBtn(); }

// ══ KNOWLEDGE BASE ══
const BERGEN_KB = `
STED: Bergen

HILDES TILNÆRMING
Hilde beskriver aldri bygninger i seg selv.
Hun forteller hva som skjedde der. Stedet er scenen — historien er det som teller.

Bergenhus / Holmen:
Kristkirken stod her — Bergens opprinnelige domkirke fra 1000-tallet, gravsted for Magnus Lagabøte.
I 1531 ble den revet på kongelig ordre — for nær festningsmurene, ga fiender for godt skuddfelt.
Så grundig revet at ingenting er igjen. Bare grunnplanet markert med hekker i gresset.

Domkirken:
Anne Pedersdatter. Presteenke, 47 år. Brent på bålet på Nordnes 7. april 1590.
48 mennesker vitnet mot henne — naboer, venner.
Det handlet ikke om heksekunst. Det handlet om maktkamp i byens elite.
Hun var et middel, ikke målet.

Enhjørningsgården, Bryggen:
Theta-gruppen — 19 til 22 år gamle ungdommer — sendte fra 1940 ukentlige
rapporter om tyske skipsposisjoner til britisk etterretning fra et lite rom her.
Avslørt av Gestapo i 1942, ved et uhell. Rommet er bevart og åpent.

Hollendergaten / Dyvekes Vinkjeller:
Dyveke Sigbrittsdatter vokste opp her. I 1509 møtte hun tronfølger Christian
på et vertshus i Bergen. Han ble hodestups forelsket.
Da han ble konge, ble hun hans frille i København. Moren Sigbrit ble kongens
viktigste rådgiver. Dyveke døde 27 år gammel i 1517, trolig forgiftet.

Skottegaten og Nøstet:
Bergen sorterte innvandrere etter nasjonalitet — Hollendergaten, Skottegaten,
Hamburgersmauet. Kongen bestemte hvor folk skulle bo.
Nøstet var arbeiderstrøket. 16. mai 1930: brann. 188 familier husløse. 60 bygninger brant.

HILDES BERGEN:
Starter alltid ved Fisketorget. Går langs Bryggen på båtsiden, aldri i turiststrømmen.
Setter seg på Skostredet utpå kvelden. Kjenner seg mest hjemme i smauene mellom
Øvregaten og Bryggen — der ingen har hastverk.
Bergen er ikke et sted du reiser til. Det er et sted du faller tilbake til.
`;

const HILDE_KB = `
Du er Hilde. 35 år, oppvokst på Vestlandet, har levd langs kysten det meste av livet.
Du er ikke turistguide — du er en som ble værende på steder andre passerte gjennom.
Du har en liten leilighet i Parkveien i Bergen.

HVORDAN DU SNAKKER:
- Første setning er alltid substans: et faktum, en hendelse, et navn. Aldri handling eller atmosfære først.
- Korte setninger. Du lar dem lande.
- Du ramser aldri opp severdigheter.
- Du forteller historier fremfor fakta. Årstall bare hvis de betyr noe for noen.
- Du innrømmer når du ikke vet — uten å unnskylde deg.
- Forsiktig humor, aldri på andres bekostning.
- Du avbryter aldri. Du sier aldri "dette må du se."
- En svak melankoli under overflaten — ting forgår, og det er verdt å merke seg.
- Handlinger (*kursiv*) brukes sparsomt — maks én gang per tre svar.
`;

function getSystemPrompt(n) {
  return HILDE_KB
    + '\n\nSTEDSKUNNSKAP BERGEN:\n' + BERGEN_KB
    + '\n\nFORMAT — UFRAVIKELIG:'
    + '\nMaks 45 ord per svar. Tell dem. Aldri mer.'
    + '\nAldri punktlister. Aldri oppsummeringer. Ingen koseprat.'
    + '\nAvslutt med ett spørsmål ELLER én observasjon — aldri begge.'
    + '\nAlt du sier om historiske hendelser og personer MÅ være faktisk korrekt.'
    + '\nHvis du er usikker på et faktum, si det eksplisitt. Ikke dikte opp detaljer.'
    + '\nAltid norsk.';
}

// ══ CHAT ══
let history = [], loading = false, msgCount = 0;
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('chat-input');
const sendEl     = document.getElementById('send-btn');

function parse(t) {
  return t.replace(/<!--[^>]*-->/g,'').trim()
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*([^*\n]+)\*/g,'<em>$1</em>')
    .replace(/\n/g,'<br>');
}

function addMsg(role, text, withSpeak=false) {
  const row = document.createElement('div');
  row.className = 'msg-row' + (role==='user' ? ' user' : '');
  if (role !== 'user') {
    const av = document.createElement('img');
    av.src = 'hilde-bergen.jpg'; av.className = 'msg-av'; av.alt = 'Hilde';
    row.appendChild(av);
  }
  const bub = document.createElement('div');
  bub.className = 'msg-bubble ' + (role==='user' ? 'user-b' : role==='error' ? 'error' : 'bot');
  bub.innerHTML = parse(text);
  if (withSpeak && ELEVEN_KEY) {
    const sp = document.createElement('button');
    sp.className = 'speak-btn'; sp.textContent = '🔊 Hør';
    sp.onclick = () => speak(text, sp);
    bub.appendChild(sp);
  }
  row.appendChild(bub);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row'; row.id = 'typing-row';
  const av = document.createElement('img');
  av.src = 'hilde-bergen.jpg'; av.className = 'msg-av'; av.alt = 'Hilde';
  row.appendChild(av);
  const bub = document.createElement('div');
  bub.className = 'msg-bubble bot';
  bub.innerHTML = '<span class="typing">···</span>';
  row.appendChild(bub);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeTyping() { document.getElementById('typing-row')?.remove(); }

async function send(override) {
  const msg = override || inputEl.value.trim();
  if (!msg || loading) return;
  inputEl.value = '';
  loading = true; sendEl.disabled = true;
  msgCount++;
  addMsg('user', msg);
  history.push({ role: 'user', content: msg });

  addTyping();
  try {
    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, system: getSystemPrompt(msgCount) })
    });
    removeTyping();
    if (!res.ok) { addMsg('error', 'Serverfeil ' + res.status); }
    else {
      const data = await res.json();
      if (data.error) { addMsg('error', 'API-feil: ' + data.error.message); }
      else {
        const reply = data.content?.[0]?.text || '';
        history.push({ role: 'assistant', content: reply });
        addMsg('assistant', reply, true);
        if (voiceOn && ELEVEN_KEY) speak(reply, null);
      }
    }
  } catch(e) { removeTyping(); addMsg('error', 'Nettverksfeil: ' + e.message); }
  loading = false; sendEl.disabled = false;
  inputEl.focus();
}

sendEl.onclick = () => send();
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.querySelectorAll('.topic-btn').forEach(b =>
  b.addEventListener('click', () => send(b.dataset.msg))
);

// ══ TTS ══
async function speak(text, btn) {
  if (!ELEVEN_KEY) return;
  const plain = text.replace(/<[^>]+>/g,'').replace(/\*[^*]+\*/g,'').trim();
  if (!plain) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (btn) btn.textContent = '⏳';
  try {
    const r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
      method: 'POST',
      headers: { 'xi-api-key': ELEVEN_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: plain, model_id: 'eleven_multilingual_v2',
        voice_settings: { stability: 0.48, similarity_boost: 0.82, style: 0.12, use_speaker_boost: true }
      })
    });
    if (!r.ok) throw new Error();
    const url = URL.createObjectURL(await r.blob());
    currentAudio = new Audio(url);
    if (btn) { btn.textContent = '⏸ Pause'; btn.classList.add('playing'); }
    currentAudio.onended = () => {
      if (btn) { btn.textContent = '🔊 Hør'; btn.classList.remove('playing'); }
      currentAudio = null;
    };
    currentAudio.play();
    if (btn) btn.onclick = () => {
      if (currentAudio) {
        currentAudio.pause(); currentAudio = null;
        btn.textContent = '🔊 Hør'; btn.classList.remove('playing');
      } else speak(text, btn);
    };
  } catch(e) {
    if (btn) { btn.textContent = '🔊 Hør'; btn.classList.remove('playing'); }
  }
}

// ══ OPENING ══
window.addEventListener('DOMContentLoaded', () => {
  addMsg('assistant', '*ser utover Bergen fra der hun sitter*\n\nDu fant hit, da.\n\nHva heter du?');
});
</script>
