<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hilde · Lofoten & Vesterålen · SofaTravels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #0A0F14;
      --panel:  #0D1720;
      --card:   #111E28;
      --border: #1C3040;
      --sea:    #2A7FA8;
      --gold:   #C9A84C;
      --text:   #EAE0CF;
      --muted:  #6A8A9A;
      --sub:    #9AB0BA;
    }
    html, body {
      height: 100%; background: var(--bg);
      overflow: hidden; font-family: 'Crimson Text', Georgia, serif;
      color: var(--text);
    }

    /* ══════════════════════════════════════
       TOP HEADER BAR
    ══════════════════════════════════════ */
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      height: 52px;
      background: rgba(10,15,20,0.92); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; gap: 14px;
    }
    #back-btn {
      background: none; border: 1px solid rgba(201,168,76,.3); color: var(--gold);
      padding: 5px 12px; border-radius: 4px; cursor: pointer;
      font-size: .72rem; letter-spacing: .1em; font-family: inherit;
      transition: all .2s; text-decoration: none; display: inline-block; flex-shrink: 0;
    }
    #back-btn:hover { border-color: var(--gold); background: rgba(201,168,76,.08); }

    /* Knowledge barometer — bigger ring, strong contrast */
    #kb-wrap {
      display: flex; align-items: center; gap: 10px;
    }
    #kb-ring {
      position: relative; width: 44px; height: 44px; flex-shrink: 0;
      /* subtle background so ring is always visible on any bg */
      background: rgba(8,17,26,0.6); border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(42,127,168,.2);
    }
    #kb-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
    #kb-track { fill: none; stroke: rgba(255,255,255,.12); stroke-width: 3.5; }
    #kb-center {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: .62rem; color: #7DCCEE; font-weight: 600; letter-spacing: -.02em;
    }
    #kb-fill {
      fill: none; stroke: #4DCCF0; stroke-width: 3.5; stroke-linecap: round;
      stroke-dasharray: 119.4; stroke-dashoffset: 119.4;
      transition: stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1);
      filter: drop-shadow(0 0 4px rgba(77,204,240,.5));
    }
    #kb-text { font-size: .68rem; line-height: 1.45; }
    #kb-text strong { color: #7DCCEE; font-size: .72rem; display: block; letter-spacing: .2em; }
    #kb-text span { color: rgba(154,176,186,.65); letter-spacing: .08em; font-size: .62rem; }

    .header-spacer { flex: 1; }
    #loc-badge {
      text-align: center;
    }
    #loc-city { font-size: 8px; letter-spacing: .35em; color: var(--sea); }
    #loc-name { font-family: 'Playfair Display', serif; font-size: .88rem; color: var(--text); }

    .header-spacer2 { flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
    .hdr-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(13,23,32,.7); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; font-size: .9rem;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    .hdr-btn:hover { border-color: var(--sea); color: var(--text); }
    .hdr-btn.active { border-color: var(--sea); color: #7DCCEE; background: rgba(42,127,168,.15); }

    /* ══════════════════════════════════════
       MAIN LAYOUT — two columns below header
    ══════════════════════════════════════ */
    #main {
      position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
      display: flex; overflow: hidden;
    }

    /* ══════════════════════════════════════
       LEFT: PORTRAIT WINDOW
    ══════════════════════════════════════ */
    #portrait-col {
      flex: 1; min-width: 0; position: relative; overflow: hidden;
      background: #000;
      display: flex; align-items: center; justify-content: center;
    }

    /* Portrait image — full 3:4 portrait, never cropped, centred in black col */
    #portrait-col {
      display: flex; align-items: center; justify-content: center;
    }
    #portrait-inner {
      position: relative;
      /* Fixed 3:4 aspect ratio, max fills available height */
      height: 100%;
      aspect-ratio: 3/4;
      flex-shrink: 0;
      overflow: hidden;
      background: #000;
    }
    #backdrop-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain; object-position: center top;
      /* gentle breathe — no zoom so image stays crisp */
      animation: breathe 16s ease-in-out infinite;
      transform-origin: center 40%;
      transition: opacity 1.3s ease;
    }
    @keyframes breathe {
      0%   { transform: scale(1.00) translateY(0px); }
      40%  { transform: scale(1.015) translateY(-3px); }
      100% { transform: scale(1.00) translateY(0px); }
    }
    /* Subtle light shift */
    #portrait-light {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(155deg, rgba(10,15,20,0.06) 0%, rgba(10,15,20,0.0) 50%);
      animation: lightshift 20s ease-in-out infinite;
    }
    @keyframes lightshift { 0%,100%{opacity:1} 50%{opacity:.65} }

    /* Candy.AI controls — float inside portrait-inner */
    #portrait-controls {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 9px; z-index: 10;
    }
    .p-ctrl {
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(8,14,20,0.65); backdrop-filter: blur(10px);
      border: 1px solid rgba(42,127,168,.2); color: rgba(234,224,207,.65);
      cursor: pointer; font-size: .95rem; transition: all .22s;
      display: flex; align-items: center; justify-content: center;
    }
    .p-ctrl:hover { border-color: rgba(42,127,168,.55); color: var(--text); transform: scale(1.08); }
    .p-ctrl.active { border-color: var(--sea); color: #7DCCEE; background: rgba(42,127,168,.15); }

    /* Guide name top-left of portrait */
    #portrait-guide-badge {
      position: absolute; top: 12px; left: 14px; z-index: 10;
      display: flex; align-items: center; gap: 8px;
    }
    .guide-avatar {
      width: 32px; height: 32px; border-radius: 50%; overflow: hidden;
      border: 1.5px solid rgba(42,127,168,.5); flex-shrink: 0;
    }
    .guide-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .guide-badge-name { font-family: 'Playfair Display', serif; font-size: .9rem; color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,.7); letter-spacing: .04em; }
    .online-dot { width: 7px; height: 7px; border-radius: 50%; background: #4CC87A;
      box-shadow: 0 0 7px rgba(76,200,122,.7); animation: op 3s infinite; display: inline-block; }
    @keyframes op { 0%,100%{box-shadow:0 0 5px rgba(76,200,122,.4)} 50%{box-shadow:0 0 12px rgba(76,200,122,.8)} }

    /* Bottom mist inside portrait-inner */
    #portrait-mist {
      position: absolute; bottom: 0; left: 0; right: 0; pointer-events: none;
      height: 55%;
      background: linear-gradient(to top,
        rgba(10,15,20,0.97) 0%,
        rgba(10,15,20,0.82) 22%,
        rgba(10,15,20,0.42) 50%,
        transparent 100%);
    }

    /* ── CHAT inside portrait-inner ── */
    #chat-area {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
      transition: opacity .35s, transform .35s;
    }
    #chat-area.hidden { opacity: 0; transform: translateY(12px); pointer-events: none; }

    #messages-wrap {
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 32%, black 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 32%, black 100%);
      pointer-events: none;
    }
    #messages {
      overflow-y: auto; padding: 8px 16px 4px;
      display: flex; flex-direction: column; gap: 7px;
      max-height: 44vh; pointer-events: all;
    }
    #messages::-webkit-scrollbar { width: 2px; }
    #messages::-webkit-scrollbar-thumb { background: rgba(42,127,168,.25); }

    .msg-row { display: flex; gap: 8px; align-items: flex-end; }
    .msg-row.user { justify-content: flex-end; }
    .msg-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover;
      flex-shrink: 0; border: 1px solid rgba(42,127,168,.35); }
    .msg-bubble { max-width: 68%; padding: 8px 13px; line-height: 1.55; font-size: .88rem; }
    .msg-bubble.bot {
      background: rgba(10,20,30,0.82); backdrop-filter: blur(14px);
      color: #D8CCBC; border: 1px solid rgba(42,127,168,.2);
      border-radius: 11px 11px 11px 3px;
    }
    .msg-bubble.bot a { color: var(--sea); text-decoration: underline; text-underline-offset: 3px; }
    .msg-bubble.bot em { color: rgba(201,168,76,.65); font-style: italic; }
    .msg-bubble.user-b {
      background: rgba(20,40,56,0.88); backdrop-filter: blur(14px);
      color: var(--text); border: 1px solid rgba(42,127,168,.18);
      border-radius: 11px 11px 3px 11px;
    }
    .msg-bubble.error { background: rgba(60,10,0,.85); color: #FF9966; border-radius: 8px; }
    .speak-btn {
      display: inline-block; margin-top: 6px; background: none;
      border: 1px solid rgba(42,127,168,.25); color: var(--muted);
      border-radius: 4px; padding: 2px 8px; font-size: .66rem;
      cursor: pointer; font-family: inherit; transition: all .2s;
    }
    .speak-btn:hover { border-color: var(--sea); color: #7DCCEE; }
    .speak-btn.playing { border-color: var(--sea); color: #7DCCEE; background: rgba(42,127,168,.1); }
    .speak-btn.loading { opacity: .5; cursor: default; }
    .typing { color: var(--sea); letter-spacing: .3em; font-size: 1rem; animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }

    /* sound indicator */
    .sound-row { padding: 2px 18px 4px; display: flex; align-items: center; gap: 5px; }
    .sound-bars { display: flex; gap: 2px; align-items: flex-end; height: 10px; }
    .sound-bar { width: 2px; background: var(--sea); border-radius: 1px; animation: sw 1.2s ease-in-out infinite; }
    .sound-bar:nth-child(1){height:3px;animation-delay:0s} .sound-bar:nth-child(2){height:7px;animation-delay:.15s}
    .sound-bar:nth-child(3){height:10px;animation-delay:.3s} .sound-bar:nth-child(4){height:5px;animation-delay:.45s}
    .sound-bar:nth-child(5){height:8px;animation-delay:.6s}
    @keyframes sw { 0%,100%{transform:scaleY(.35);opacity:.35} 50%{transform:scaleY(1);opacity:1} }
    .sound-bars.paused .sound-bar { animation-play-state:paused; opacity:.2; }
    #sound-label { font-size: .6rem; color: var(--muted); letter-spacing: .08em; }

    #input-row {
      display: flex; gap: 8px; padding: 10px 14px 12px;
      background: rgba(10,15,20,0.9); backdrop-filter: blur(18px);
      border-top: 1px solid rgba(42,127,168,.1);
    }
    #chat-input {
      flex: 1; background: rgba(12,22,32,0.92); border: 1px solid var(--border);
      color: var(--text); padding: 10px 16px; border-radius: 20px;
      font-size: .88rem; outline: none; font-family: 'Crimson Text', Georgia, serif;
      transition: border-color .2s;
    }
    #chat-input:focus { border-color: rgba(42,127,168,.5); }
    #chat-input::placeholder { color: var(--muted); }
    #send-btn {
      width: 42px; height: 42px; border-radius: 50%; border: none;
      background: var(--sea); color: #fff; font-size: 1rem;
      cursor: pointer; transition: all .2s; flex-shrink: 0; align-self: center;
    }
    #send-btn:hover { background: #3A9FC8; transform: scale(1.07); }
    #send-btn:disabled { opacity: .35; cursor: default; transform: none; }

    /* ══════════════════════════════════════
       RIGHT: PROGRESSION PANEL (always visible)
    ══════════════════════════════════════ */
    #prog-col {
      width: 300px; flex-shrink: 0;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* Portrait thumbnail in panel */
    .pp-portrait { position: relative; height: 230px; overflow: hidden; flex-shrink: 0; }
    .pp-portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center 12%;
      transition: transform .5s; }
    #prog-col:hover .pp-portrait img { transform: scale(1.03); }
    .pp-fade { position: absolute; inset: 0; background: linear-gradient(to top, var(--panel) 0%, rgba(13,23,32,.15) 55%); }
    .pp-info { position: absolute; bottom: 12px; left: 14px; right: 14px; }
    .pp-region { font-size: 8px; letter-spacing: .3em; color: var(--sea); margin-bottom: 2px; }
    .pp-name { font-family: 'Playfair Display', serif; font-size: 1.28rem; font-weight: 700; color: var(--text); }
    .pp-tagline { font-size: .7rem; color: var(--muted); font-style: italic; margin-top: 2px; line-height: 1.5; }
    .pp-online { position: absolute; top: 10px; right: 10px;
      width: 8px; height: 8px; border-radius: 50%; background: #4CC87A;
      box-shadow: 0 0 8px rgba(76,200,122,.6); animation: op 3s infinite; }

    /* Tabs */
    .pp-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--card); }
    .pp-tab {
      flex: 1; padding: 9px 2px; text-align: center;
      font-size: .58rem; letter-spacing: .12em; color: var(--muted);
      cursor: pointer; border: none; border-bottom: 2px solid transparent;
      background: none; transition: all .2s; font-family: 'Crimson Text', serif;
    }
    .pp-tab:hover { color: var(--text); }
    .pp-tab.active { color: var(--sea); border-bottom-color: var(--sea); }

    /* Grid */
    .pp-content { flex: 1; overflow-y: auto; padding: 9px; }
    .pp-content::-webkit-scrollbar { width: 3px; }
    .pp-content::-webkit-scrollbar-thumb { background: var(--border); }
    .pp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

    .pp-card {
      border-radius: 7px; overflow: hidden; position: relative;
      aspect-ratio: 3/4; border: 1px solid var(--border);
      transition: transform .2s, border-color .2s;
    }
    .pp-card.unlocked { cursor: pointer; }
    .pp-card.unlocked:hover { transform: scale(1.03); border-color: rgba(42,127,168,.5); }
    .pp-card.active-card { border-color: var(--sea); box-shadow: 0 0 0 1px var(--sea); }
    .pp-card img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
    .pp-card.unlocked:hover img { transform: scale(1.07); }
    .pp-card-fade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,15,22,.9) 0%, transparent 55%); }
    .pp-card-label { position: absolute; bottom: 0; left: 0; right: 0; padding: 6px 8px; }
    .pp-card-place { font-size: .57rem; letter-spacing: .17em; color: var(--sea); margin-bottom: 1px; }
    .pp-card-name { font-family: 'Playfair Display', serif; font-size: .76rem; color: var(--text); line-height: 1.2; }
    .pp-card-preview { font-size: .57rem; color: var(--muted); font-style: italic; margin-top: 1px; }

    .pp-card.locked { cursor: default; background: linear-gradient(135deg, #0A1820, #0D2030); }
    .pp-card.locked img { opacity: .13; filter: blur(2px); }
    .lock-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
    .lock-icon { width: 26px; height: 26px; border-radius: 50%; background: rgba(42,127,168,.12); border: 1px solid rgba(42,127,168,.22); display: flex; align-items: center; justify-content: center; font-size: .8rem; }
    .lock-label { font-size: .57rem; color: rgba(106,138,154,.5); text-align: center; line-height: 1.55; padding: 0 5px; }

    @keyframes unlock-flash { 0%{box-shadow:0 0 0 0 rgba(42,127,168,.8)} 70%{box-shadow:0 0 0 14px rgba(42,127,168,0)} 100%{box-shadow:0 0 0 0 rgba(42,127,168,0)} }
    .pp-card.just-unlocked { animation: unlock-flash .9s ease-out; }

    /* Footer */
    .pp-footer { padding: 9px 12px; border-top: 1px solid var(--border); flex-shrink: 0; }
    .pp-foot-label { display: flex; justify-content: space-between; font-size: .6rem; color: var(--muted); letter-spacing: .1em; margin-bottom: 5px; }
    .pp-bar-track { height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
    .pp-bar-fill { height: 100%; background: var(--sea); border-radius: 1px; transition: width .8s cubic-bezier(.16,1,.3,1); }

    /* ══════════════════════════════════════
       OVERLAYS
    ══════════════════════════════════════ */
    .api-banner { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 999; background: #0A1A28; border-bottom: 2px solid var(--sea); padding: 12px 20px; align-items: center; gap: 12px; flex-wrap: wrap; }
    .api-banner.show { display: flex; }
    .api-banner label { font-size: .85rem; color: var(--text); }
    .api-banner label strong { color: var(--sea); }
    .api-banner input { flex: 1; min-width: 220px; background: #0A1420; border: 1px solid rgba(42,127,168,.4); color: var(--text); padding: 7px 12px; border-radius: 4px; font-size: .82rem; font-family: monospace; outline: none; }
    .api-banner button { background: var(--sea); border: none; color: #fff; padding: 7px 16px; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: .82rem; }
    .banner-close { background: none !important; color: var(--muted) !important; font-size: 1rem !important; padding: 4px 8px !important; }

    .unlock-toast {
      position: fixed; bottom: 80px; left: calc(50% - 150px); z-index: 60;
      background: rgba(10,22,32,0.96); backdrop-filter: blur(16px);
      border: 1px solid rgba(42,127,168,.45); border-radius: 10px;
      padding: 10px 16px; display: flex; align-items: center; gap: 10px;
      font-size: .82rem; color: var(--text);
      opacity: 0; transform: translateY(12px); transition: all .4s cubic-bezier(.16,1,.3,1);
      pointer-events: none; width: 300px;
    }
    .unlock-toast.show { opacity: 1; transform: translateY(0); }
    .toast-title { color: var(--sea); font-size: .63rem; letter-spacing: .15em; margin-bottom: 1px; }

    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  </style>
</head>
<body>

<!-- ══ TOP BAR ══ -->
<header id="top-bar">
  <a href="../../from-the-sofa.html" id="back-btn">← Guider</a>

  <!-- Knowledge barometer -->
  <div id="kb-wrap">
    <div id="kb-ring">
      <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
        <circle id="kb-track" cx="22" cy="22" r="19" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="3.5"/>
        <circle id="kb-fill" cx="22" cy="22" r="19" fill="none" stroke="#4DCCF0" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4"/>
      </svg>
      <div id="kb-center">0%</div>
    </div>
    <div id="kb-text">
      <strong id="kb-place">REINE</strong>
      <span>Kunnskap om stedet</span>
    </div>
  </div>

  <div class="header-spacer"></div>

  <!-- Location badge -->
  <div id="loc-badge">
    <div id="loc-city">REINE · LOFOTEN</div>
    <div id="loc-name">Hilde</div>
  </div>

  <div class="header-spacer2">
    <button class="hdr-btn" id="sound-btn" title="Ambientelyd">🌊</button>
    <button class="hdr-btn" id="voice-btn" title="Hildes stemme">🔇</button>
    <button class="hdr-btn" id="settings-btn" title="Innstillinger">⚙</button>
  </div>
</header>

<!-- ══ MAIN SPLIT ══ -->
<div id="main">

  <!-- LEFT: Portrait + Chat -->
  <div id="portrait-col">
    <!-- portrait-inner: fixed 3:4 ratio, black sides auto-fill col -->
    <div id="portrait-inner">
      <img id="backdrop-img" src="sted-aa.jpeg" alt="Hilde" />
      <div id="portrait-light"></div>
      <div id="portrait-mist"></div>

      <!-- Guide badge top-left -->
      <div id="portrait-guide-badge">
        <div class="guide-avatar"><img id="avatar-img" src="sted-aa.jpeg" alt="Hilde" /></div>
        <span class="guide-badge-name">Hilde</span>
        <span class="online-dot"></span>
      </div>

      <!-- Candy.AI style floating controls (right side of portrait) -->
      <div id="portrait-controls">
        <button class="p-ctrl" id="eye-btn" title="Skjul/vis chat">👁</button>
        <button class="p-ctrl" id="expand-btn" title="Fullskjerm">⤢</button>
        <button class="p-ctrl" id="mute-sound-btn" title="Lyd av/på">🔕</button>
      </div>

      <!-- Chat area -->
      <div id="chat-area">
      <div id="messages-wrap">
        <div id="messages" role="log" aria-live="polite"></div>
      </div>
      <div class="sound-row">
        <div class="sound-bars paused" id="sound-bars">
          <div class="sound-bar"></div><div class="sound-bar"></div>
          <div class="sound-bar"></div><div class="sound-bar"></div>
          <div class="sound-bar"></div>
        </div>
        <span id="sound-label">Lyd av</span>
      </div>
      <div id="input-row">
        <input type="text" id="chat-input" autocomplete="off" placeholder="Spør Hilde…" />
        <button id="send-btn">→</button>
      </div>
      </div><!-- /chat-area -->
    </div><!-- /portrait-inner -->
  </div><!-- /portrait-col -->

  <!-- RIGHT: Progression panel always visible -->
  <aside id="prog-col">
    <div class="pp-portrait">
      <img src="sted-aa.jpeg" alt="Hilde" id="pp-img" />
      <div class="pp-fade"></div>
      <div class="pp-online"></div>

// stedKnowledge replaced by stedTopics above — tag-based system

function updateKB(rawText) {
  // Parse <!--topics:...--> tag inserted by Claude
  const tagMatch = rawText.match(/<!--topics:([^-]*?)-->/);
  if (tagMatch && tagMatch[1].trim()) {
    const tagged = tagMatch[1].split(',').map(t => t.trim()).filter(Boolean);
    const validTopics = stedTopics[activeStedId] || [];
    tagged.forEach(t => {
      if (validTopics.includes(t)) topicsHit[activeStedId].add(t);
    });
  }

  const total = (stedTopics[activeStedId] || []).length;
  const hits  = topicsHit[activeStedId]?.size || 0;
  const pct   = total > 0 ? Math.round(hits / total * 100) : 0;
  const circ  = 119.4;
  document.getElementById('kb-fill').style.strokeDashoffset = circ - (circ * pct / 100);
  document.getElementById('kb-center').textContent = pct + '%';

  // Gold flash at 100%
  if (pct >= 100) {
    document.getElementById('kb-fill').style.stroke = '#C9A84C';
    document.getElementById('kb-fill').style.filter = 'drop-shadow(0 0 6px rgba(201,168,76,.8))';
    setTimeout(() => {
      document.getElementById('kb-fill').style.stroke = '#4DCCF0';
      document.getElementById('kb-fill').style.filter = 'drop-shadow(0 0 4px rgba(77,204,240,.5))';
    }, 2500);
    checkUnlocks();
  }
}
function resetKB() {
  const topics = stedTopics[activeStedId] || [];
  const hits   = topicsHit[activeStedId]?.size || 0;
  const pct    = topics.length > 0 ? Math.round(hits / topics.length * 100) : 0;
  const circ   = 119.4;
  document.getElementById('kb-fill').style.strokeDashoffset = circ - (circ * pct / 100);
  document.getElementById('kb-fill').style.stroke = pct >= 100 ? '#C9A84C' : '#4DCCF0';
  document.getElementById('kb-center').textContent = pct + '%';
  const names = {reine:'REINE',aa:'Å',nusfjord:'NUSFJORD',henningsvaer:'HENNINGSVÆR',kabelvag:'KABELVÅG',svolvaer:'SVOLVÆR',sortland:'SORTLAND',boe:'BØ',stoe:'STØ',andenes:'ANDENES',bleik:'BLEIK'};
  document.getElementById('kb-place').textContent = names[activeStedId] || activeStedId.toUpperCase();
}

const scenes = {

  kyst:{label:'Rolig kyst · svak vind'},fugl:{label:'Bleik · fugler og vind'},

function makeNoise(ctx,s=3){const b=ctx.createBuffer(1,ctx.sampleRate*s,ctx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const src=ctx.createBufferSource();src.buffer=b;src.loop=true;return src;}
function nl(ctx,f,q,g,dest){const s=makeNoise(ctx),fi=ctx.createBiquadFilter(),gn=ctx.createGain();fi.type='bandpass';fi.frequency.value=f;fi.Q.value=q;gn.gain.value=0;s.connect(fi);fi.connect(gn);gn.connect(dest);s.start();gn.gain.linearRampToValueAtTime(g,ctx.currentTime+2.5);return{src:s,gainNode:gn,baseGain:g};}
function wave(ctx,dest,i=1){const n=[];n.push(nl(ctx,60,.4,.07*i,dest));n.push(nl(ctx,280,.6,.05*i,dest));n.push(nl(ctx,2200,1.2,.025*i,dest));const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.12+Math.random()*.06;lg.gain.value=.03*i;lfo.connect(lg);lg.connect(n[1].gainNode.gain);lfo.start();n.push({src:lfo,gainNode:lg,baseGain:0});return n;}
function gull(ctx,dest,d=1){function s(){if(!ambientOn)return;const t=ctx.currentTime+1+Math.random()*(8/d);const o=ctx.createOscillator(),mo=ctx.createOscillator(),mg=ctx.createGain(),eg=ctx.createGain();const bf=900+Math.random()*400;o.frequency.value=bf;o.type='sine';mo.frequency.value=4+Math.random()*3;mg.gain.value=60+Math.random()*40;eg.gain.value=0;mo.connect(mg);mg.connect(o.frequency);o.connect(eg);eg.connect(dest);const dur=.6+Math.random()*.8;o.start(t);mo.start(t);eg.gain.setValueAtTime(0,t);eg.gain.linearRampToValueAtTime(.06,t+.08);eg.gain.setValueAtTime(.06,t+dur*.6);eg.gain.linearRampToValueAtTime(0,t+dur);o.frequency.setValueAtTime(bf,t);o.frequency.linearRampToValueAtTime(bf*.72,t+dur);o.stop(t+dur+.1);mo.stop(t+dur+.1);setTimeout(s,(t-ctx.currentTime+.5)*1000*(.5+Math.random()));}s();}
function boat(ctx,dest){const n=[],o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=42+Math.random()*8;f.type='lowpass';f.frequency.value=180;g.gain.value=0;o.connect(f);f.connect(g);g.connect(dest);o.start();g.gain.linearRampToValueAtTime(.04,ctx.currentTime+3);n.push({src:o,gainNode:g,baseGain:.04});n.push(nl(ctx,320,.5,.025,dest));return n;}
function wind(ctx,dest,i=1){const n=[];n.push(nl(ctx,180,.35,.05*i,dest));n.push(nl(ctx,900,.9,.02*i,dest));const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.05+Math.random()*.04;lg.gain.value=.025*i;lfo.connect(lg);lg.connect(n[0].gainNode.gain);lfo.start();n.push({src:lfo,gainNode:lg,baseGain:0});return n;}
function bird(ctx,dest){function s(){if(!ambientOn)return;const t=ctx.currentTime+.5+Math.random()*4;const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';const bf=2200+Math.random()*1200;o.frequency.value=bf;g.gain.value=0;o.connect(g);g.connect(dest);o.start(t);const c=2+Math.floor(Math.random()*4);for(let i=0;i<c;i++){const ct=t+i*.08;g.gain.setValueAtTime(0,ct);g.gain.linearRampToValueAtTime(.04,ct+.02);g.gain.linearRampToValueAtTime(0,ct+.055);o.frequency.setValueAtTime(bf+Math.random()*300,ct);}o.stop(t+c*.08+.1);setTimeout(s,(t-ctx.currentTime+.2)*1000*(.3+Math.random()*.7));}s();}
function buildScene(ctx,name){const m=ctx.createGain();m.gain.value=.82;m.connect(ctx.destination);const n=[];switch(name){case'havn':n.push(...wave(ctx,m,.85));gull(ctx,m,1);n.push(nl(ctx,400,.4,.01,m));break;case'storm':n.push(...wave(ctx,m,1.6));n.push(...wind(ctx,m,1.4));gull(ctx,m,.3);break;case'fiskehavn':n.push(...wave(ctx,m,.6));gull(ctx,m,1.4);n.push(...boat(ctx,m));break;case'fjell':n.push(...wind(ctx,m,1.2));n.push(nl(ctx,100,.3,.025,m));break;case'nordlys':n.push(nl(ctx,80,.2,.02,m));n.push(...wind(ctx,m,.25));break;case'baat':n.push(...wave(ctx,m,1.1));n.push(...boat(ctx,m));n.push(...wind(ctx,m,.6));gull(ctx,m,.5);break;case'kyst':n.push(...wave(ctx,m,.5));n.push(...wind(ctx,m,.4));gull(ctx,m,.6);break;case'fugl':n.push(...wave(ctx,m,.7));n.push(...wind(ctx,m,.8));bird(ctx,m);gull(ctx,m,.8);break;default:n.push(...wave(ctx,m,.8));gull(ctx,m,.8);}ambientNodes.push(...n,{src:null,gainNode:m,baseGain:.82});}
function startAmbient(scene='havn'){if(audioCtx)stopAmbient();currentScene=scene;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();buildScene(audioCtx,scene);}catch(e){}}

function setAmbientScene(scene){if(ambientOn){stopAmbient();setTimeout(()=>startAmbient(scene),400);}currentScene=scene;updateSoundLabel();}
function updateSoundLabel(){const sc=scenes[currentScene]||scenes.havn;document.getElementById('sound-label').textContent=ambientOn?sc.label:'Lyd av';document.getElementById('sound-bars').classList.toggle('paused',!ambientOn);}
document.getElementById('sound-btn').onclick=()=>{ambientOn=!ambientOn;const b=document.getElementById('sound-btn');if(ambientOn){startAmbient(currentScene);b.classList.add('active');b.textContent='🔊';}else{stopAmbient();b.classList.remove('active');b.textContent='🌊';}updateSoundLabel();document.getElementById('mute-sound-btn').textContent=ambientOn?'🔔':'🔕';document.getElementById('mute-sound-btn').classList.toggle('active',ambientOn);};

  bleik:        ['lundefugl','bleiksøya','havørn','sandstrand','fuglefjell','koloni','vind','natur'],
};

// Topics hit per sted (Set of topic strings)
let topicsHit = {};
Object.keys(stedTopics).forEach(k => topicsHit[k] = new Set());

function getKBpct(stedId) {
  const topics = stedTopics[stedId] || [];
  if (topics.length === 0) return 100;
  return Math.round((topicsHit[stedId]?.size || 0) / topics.length * 100);
}

function checkUnlocks() {
  // Check steder — unlock next when current KB = 100%
  const steder = progressionData.steder;
  steder.forEach((sted, idx) => {
    if (idx === 0) return; // always unlocked
    const prevSted = steder[idx - 1];
    const prevKB = getKBpct(prevSted.id);
    const wasLocked = !unlockedSteder.has(idx);
    if (prevKB >= 100 && wasLocked) {
      unlockedSteder.add(idx);
      const labels = { steder: 'NYTT STED ÅPNET' };
      document.getElementById('toast-title').textContent = 'NYTT STED ÅPNET';
      document.getElementById('toast-msg').textContent = `${sted.name} er nå tilgjengelig`;
      const t = document.getElementById('unlock-toast');
      t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 5000);
      setTimeout(() => renderProg(), 100);
    }
  });

  // Antrekk/historier/opplevelser still use message count
  ['antrekk','historier','opplevelser'].forEach(tab => {
    progressionData[tab].forEach(item => {
      if (userMsgCount >= item.unlockAt && userMsgCount - 1 < item.unlockAt) {
        const labels = { antrekk:'NYTT ANTREKK', historier:'SKJULT HISTORIE', opplevelser:'NY OPPLEVELSE' };
        document.getElementById('toast-title').textContent = labels[tab] || 'LÅST OPP';
        document.getElementById('toast-msg').textContent = `${item.name} er nå tilgjengelig`;
        const t = document.getElementById('unlock-toast');
        t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 4000);
        setTimeout(() => renderProg(), 100);
      }
    });
  });
}

// ════════ MESSAGES ════════
const messagesEl=document.getElementById('messages');
const chatInput=document.getElementById('chat-input');
const sendBtn=document.getElementById('send-btn');

function parseLinks(t){
  const clean = t.replace(/<!--topics:[^>]*-->/g,'').trim();
  return clean
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*([^*\n]+)\*/g,'<em>$1</em>')
    .replace(/\n\n\n+/g,'\n\n')
    .replace(/\n/g,'<br>');
}


function appendMessage(role,text,withSpeak=false){
  const row=document.createElement('div');
  row.className=`msg-row${role==='user'?' user':''}`;
  if(role!=='user'){const av=document.createElement('img');av.className='msg-avatar';av.src=document.getElementById('backdrop-img').src;av.alt='Hilde';row.appendChild(av);}
  const b=document.createElement('div');
  b.className=`msg-bubble ${role==='user'?'user-b':role==='error'?'error':'bot'}`;
  const t=document.createElement('div');
  t.innerHTML=role==='assistant'?parseLinks(text):text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  b.appendChild(t);
  if(withSpeak&&role==='assistant'){const btn=document.createElement('button');btn.className='speak-btn';btn.textContent='🔊 Hør Hilde';btn.onclick=()=>speakText(text,btn);b.appendChild(btn);}
  row.appendChild(b);messagesEl.appendChild(row);messagesEl.scrollTop=messagesEl.scrollHeight;
}
function showTyping(){const id='t'+Date.now();const r=document.createElement('div');r.className='msg-row';r.id=id;const av=document.createElement('img');av.className='msg-avatar';av.src=document.getElementById('backdrop-img').src;av.alt='';const b=document.createElement('div');b.className='msg-bubble bot';b.innerHTML='<span class="typing">···</span>';r.appendChild(av);r.appendChild(b);messagesEl.appendChild(r);messagesEl.scrollTop=messagesEl.scrollHeight;return id;}
function removeTyping(id){const e=document.getElementById(id);if(e)e.remove();}

// ════════ SEND ════════
sendBtn.onclick=()=>sendMessage();
chatInput.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}};

async function sendMessage(text){
  const msg=(text||chatInput.value).trim();
  if(!msg||isLoading)return;
  stopAudio();chatInput.value='';
  appendMessage('user',msg);chatHistory.push({role:'user',content:msg});
  userMsgCount++;checkUnlocks();renderProg();
  const tid=showTyping();isLoading=true;sendBtn.disabled=true;
  try{
    const res=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:220,system:getSystemPrompt(userMsgCount),messages:chatHistory.filter(m=>m.role!=='system')})});
    removeTyping(tid);
    if(!res.ok&&!res.headers.get('content-type')?.includes('application/json')){appendMessage('error',`Serverfeil ${res.status}`);}
    else{const data=await res.json();if(data.error){appendMessage('error',`API-feil: ${data.error.message}`);}else{const reply=data.content?.[0]?.text||'Tomt svar.';appendMessage('assistant',reply,true);chatHistory.push({role:'assistant',content:reply});updateKB(reply);if(voiceOn&&ELEVEN_KEY)speakText(reply);}}
  }catch(err){removeTyping(tid);appendMessage('error',`Nettverksfeil: ${err.message}`);}
  isLoading=false;sendBtn.disabled=false;chatInput.focus();
}

// ════════ ELEVENLABS TTS ════════
function stopAudio(){if(currentAudio){currentAudio.pause();currentAudio=null;}document.querySelectorAll('.speak-btn.playing').forEach(b=>{b.classList.remove('playing');b.textContent='🔊 Hør Hilde';});}
async function speakText(text,btn){
  if(!ELEVEN_KEY){document.getElementById('eleven-banner').classList.add('show');return;}
  stopAudio();if(btn){btn.classList.add('loading');btn.textContent='⏳ Laster…';}
  const trimmed=text.length>2500?text.substring(0,2500)+'…':text;
  try{
    const res=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${HILDE_VOICE_ID}`,{method:'POST',headers:{'Content-Type':'application/json','xi-api-key':ELEVEN_KEY},body:JSON.stringify({text:trimmed,model_id:'eleven_multilingual_v2',voice_settings:{stability:.5,similarity_boost:.75,style:.3,use_speaker_boost:true}})});
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const url=URL.createObjectURL(await res.blob());const audio=new Audio(url);currentAudio=audio;
    if(btn){btn.classList.remove('loading');btn.classList.add('playing');btn.textContent='⏹ Stopp';}
    audio.onended=()=>{currentAudio=null;URL.revokeObjectURL(url);if(btn){btn.classList.remove('playing');btn.textContent='🔊 Hør Hilde';}};
    if(btn)btn.onclick=()=>{stopAudio();btn.onclick=()=>speakText(text,btn);};
    audio.play();
  }catch(err){if(btn){btn.classList.remove('loading','playing');btn.textContent='⚠️ Feil';}}
}

// ════════ INIT ════════
function init(){
  renderProg(); resetKB();
  const welcome=`Ferjen fra Bodø legger til kai i Moskenes.\n\nDu ser dem før du går i land — Lofotveggen. Fjellene bare reiser seg fra havet uten forvarsel, uten kystlinje å forberede deg. Det er ikke noe som ligner.\n\nJeg er Hilde. Jeg har ventet her, ved kaien i Reine.\n\nVil du at vi begynner her — i det vakreste, det fotograferte — eller vil du at jeg tar deg til Å først, enden av veien, der Norge slutter?`;
  appendMessage('assistant',welcome);chatHistory.push({role:'assistant',content:welcome});
  setTimeout(()=>chatInput.focus(),600);
}
init();
