<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hilde · Lofoten & Vesterålen · SofaTravels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #08111A;
      --panel:    #0C1820;
      --card:     #0F1E28;
      --border:   #1E3A4A;
      --sea:      #2A7FA8;
      --sea-dim:  #1A5070;
      --gold:     #C9A84C;
      --text:     #EAE0CF;
      --muted:    #6A8A9A;
      --sub:      #9AB0BA;
      --input-bg: #0A1820;
      --msg-user: #1A2E3A;
      --msg-bot:  #0D1E28;
      --accent:   #1A4F6A;
    }
    html, body {
      height: 100%; background: var(--bg);
      color: var(--text); font-family: 'Crimson Text', Georgia, serif;
      overflow: hidden;
    }

    /* ── MAIN LAYOUT ── */
    #app { display: flex; height: 100vh; overflow: hidden; }

    /* ── LEFT: HILDE PORTRAIT + CHAT ── */
    .chat-left {
      flex: 1; overflow: hidden;
      position: relative; min-width: 0;
    }

    /* Portrait backdrop — full bleed behind chat */
    .portrait-backdrop {
      position: absolute; inset: 0; z-index: 0;
      overflow: hidden;
    }
    .portrait-backdrop img {
      width: 100%; height: 100%; object-fit: cover; object-position: center top;
      animation: breathe 12s ease-in-out infinite;
      transform-origin: center top;
      transition: opacity 1.2s ease;
    }
    @keyframes breathe {
      0%   { transform: scale(1.00) translateY(0px); }
      30%  { transform: scale(1.03) translateY(-4px); }
      60%  { transform: scale(1.02) translateY(-2px); }
      100% { transform: scale(1.00) translateY(0px); }
    }
    /* Light overlay that shifts subtly */
    .portrait-light {
      position: absolute; inset: 0;
      background: linear-gradient(
        160deg,
        rgba(8,17,26,0.15) 0%,
        rgba(8,17,26,0.45) 50%,
        rgba(8,17,26,0.92) 100%
      );
      animation: lightshift 18s ease-in-out infinite;
    }
    @keyframes lightshift {
      0%   { opacity: 1; }
      40%  { opacity: 0.85; }
      70%  { opacity: 0.95; }
      100% { opacity: 1; }
    }
    /* Fog/mist layer at bottom — deeper so messages float over it */
    .portrait-mist {
      position: absolute; bottom: 0; left: 0; right: 0; height: 65%;
      background: linear-gradient(to top,
        rgba(8,17,26,0.97) 0%,
        rgba(8,17,26,0.85) 25%,
        rgba(8,17,26,0.4) 55%,
        transparent 100%);
      pointer-events: none;
    }

    /* ── CHAT HEADER — absolute top ── */
    .chat-header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      padding: 14px 22px; display: flex; align-items: center; gap: 16px;
      background: rgba(8,17,26,0.72); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(42,127,168,0.15);
    }
    .back-btn {
      background: none; border: 1px solid rgba(201,168,76,.3); color: var(--gold);
      padding: 6px 14px; border-radius: 4px; cursor: pointer;
      font-size: .8rem; letter-spacing: .08em; font-family: inherit;
      transition: all .2s; text-decoration: none; display: inline-block;
    }
    .back-btn:hover { border-color: var(--gold); background: rgba(201,168,76,.08); }
    .header-guide-info { flex: 1; }
    .header-city { letter-spacing: .3em; font-size: 9px; color: var(--sea); margin-bottom: 2px; }
    .header-name { font-family: 'Playfair Display', serif; font-size: 1.05rem; color: var(--text); }
    .header-controls { display: flex; align-items: center; gap: 8px; }
    .ctrl-btn {
      background: rgba(8,17,26,0.6); border: 1px solid var(--border);
      color: var(--muted); padding: 5px 12px; border-radius: 20px;
      font-size: .75rem; cursor: pointer; font-family: inherit; transition: all .2s;
      white-space: nowrap;
    }
    .ctrl-btn:hover { border-color: var(--sea); color: var(--text); }
    .ctrl-btn.active { border-color: var(--sea); color: #7DCCEE; background: rgba(42,127,168,.12); }

    /* ── MESSAGES — Candy.AI style: bottom-anchored, image breathes above ── */
    .messages-wrap {
      position: absolute; bottom: 70px; left: 0; right: 0;
      z-index: 5; pointer-events: none;
      /* fade-out mask at top so messages dissolve upward */
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 28%, black 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 28%, black 100%);
    }
    .messages {
      overflow-y: auto; padding: 16px 24px 8px;
      display: flex; flex-direction: column; gap: 12px;
      max-height: 55vh;
      pointer-events: all;
    }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(42,127,168,.3); border-radius: 2px; }

    .msg-row { display: flex; gap: 10px; align-items: flex-start; }
    .msg-row.user { justify-content: flex-end; }
    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
      flex-shrink: 0; margin-top: 2px;
      border: 1px solid rgba(42,127,168,.4);
    }
    .msg-bubble {
      max-width: 68%; padding: 11px 16px; line-height: 1.85;
      font-size: .93rem; white-space: pre-wrap; position: relative;
    }
    .msg-bubble.bot {
      background: rgba(13,30,40,0.88); backdrop-filter: blur(8px);
      color: #D8CCBC; border: 1px solid rgba(42,127,168,.25);
      border-radius: 10px 10px 10px 2px;
    }
    .msg-bubble.bot a { color: var(--sea); text-decoration: underline; text-underline-offset: 3px; }
    .msg-bubble.user-bubble {
      background: rgba(26,47,58,0.9); backdrop-filter: blur(8px);
      color: var(--text); border: 1px solid rgba(42,127,168,.2);
      border-radius: 10px 10px 2px 10px;
    }
    .msg-bubble.error { background: rgba(60,10,0,.85); color: #FF9966; font-style: italic; border-radius: 8px; }
    .speak-btn {
      display: inline-block; margin-top: 8px; background: none;
      border: 1px solid rgba(42,127,168,.3); color: var(--muted);
      border-radius: 4px; padding: 3px 10px; font-size: .72rem;
      cursor: pointer; font-family: inherit; transition: all .2s; letter-spacing: .04em;
    }
    .speak-btn:hover { border-color: var(--sea); color: #7DCCEE; }
    .speak-btn.playing { border-color: var(--sea); color: #7DCCEE; background: rgba(42,127,168,.1); }
    .speak-btn.loading { opacity: .5; cursor: default; }
    .typing { color: var(--sea); letter-spacing: .3em; font-size: 1.1rem; animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }

    /* ── INPUT ROW — pinned to bottom, above messages ── */
    .input-row {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
      display: flex; gap: 8px; padding: 14px 22px;
      background: rgba(8,17,26,0.88); backdrop-filter: blur(16px);
      border-top: 1px solid rgba(42,127,168,.15);
    }
    #chat-input {
      flex: 1; background: rgba(10,24,32,0.9); border: 1px solid var(--border);
      color: var(--text); padding: 12px 18px; border-radius: 24px;
      font-size: .93rem; outline: none; font-family: 'Crimson Text', Georgia, serif;
      transition: border-color .2s;
    }
    #chat-input:focus { border-color: rgba(42,127,168,.5); }
    #chat-input::placeholder { color: var(--muted); }
    #send-btn {
      width: 48px; height: 48px; border-radius: 50%; border: none;
      background: var(--sea); color: #fff; font-size: 1.2rem;
      cursor: pointer; transition: all .2s; flex-shrink: 0;
    }
    #send-btn:hover { background: #3A9FC8; transform: scale(1.05); }
    #send-btn:disabled { opacity: .4; cursor: default; transform: none; }

    /* ── RIGHT PANEL ── */
    .chat-right {
      width: 280px; flex-shrink: 0;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      transform: translateX(100%); opacity: 0;
      transition: transform .7s cubic-bezier(.16,1,.3,1), opacity .7s ease;
      overflow: hidden;
    }
    .chat-right.visible { transform: translateX(0); opacity: 1; }

    /* Guide portrait in right panel */
    .right-portrait {
      position: relative; height: 260px; overflow: hidden; flex-shrink: 0;
    }
    .right-portrait img {
      width: 100%; height: 100%; object-fit: cover; object-position: center 15%;
      transition: transform .6s ease;
    }
    .chat-right:hover .right-portrait img { transform: scale(1.03); }
    .right-portrait-fade {
      position: absolute; inset: 0;
      background: linear-gradient(to top, var(--panel) 0%, rgba(12,24,32,0.3) 55%);
    }
    .right-portrait-info { position: absolute; bottom: 14px; left: 16px; right: 16px; }
    .right-city { letter-spacing: .25em; font-size: 9px; color: var(--sea); margin-bottom: 3px; }
    .right-name { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--text); font-weight: 700; }
    .right-tagline { font-size: .78rem; color: var(--muted); font-style: italic; margin-top: 2px; line-height: 1.5; }
    .online-dot {
      position: absolute; top: 12px; right: 12px;
      width: 9px; height: 9px; border-radius: 50%;
      background: #4CC87A; border: 2px solid #4CC87A;
      box-shadow: 0 0 8px rgba(76,200,122,.5);
      animation: onlinepulse 3s ease-in-out infinite;
    }
    @keyframes onlinepulse { 0%,100%{box-shadow:0 0 6px rgba(76,200,122,.4)} 50%{box-shadow:0 0 14px rgba(76,200,122,.7)} }

    /* ── PROGRESSION TABS ── */
    .prog-tabs {
      display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
      background: var(--card);
    }
    .prog-tab {
      flex: 1; padding: 10px 4px; text-align: center;
      font-size: .68rem; letter-spacing: .12em; color: var(--muted);
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: all .2s; font-family: 'Crimson Text', serif;
      background: none; border-top: none; border-left: none; border-right: none;
    }
    .prog-tab:hover { color: var(--text); }
    .prog-tab.active { color: var(--sea); border-bottom-color: var(--sea); }

    /* ── PROGRESSION PANEL CONTENT ── */
    .prog-content { flex: 1; overflow-y: auto; padding: 12px; }
    .prog-content::-webkit-scrollbar { width: 3px; }
    .prog-content::-webkit-scrollbar-thumb { background: var(--border); }

    .prog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .prog-card {
      border-radius: 8px; overflow: hidden; position: relative;
      aspect-ratio: 3/4; cursor: pointer;
      border: 1px solid var(--border);
      transition: transform .2s, border-color .2s;
    }
    .prog-card.unlocked:hover { transform: scale(1.02); border-color: rgba(42,127,168,.5); }
    .prog-card.unlocked.active-card { border-color: var(--sea); box-shadow: 0 0 0 1px var(--sea); }

    .prog-card img {
      width: 100%; height: 100%; object-fit: cover; object-position: center top;
      transition: transform .4s;
    }
    .prog-card.unlocked:hover img { transform: scale(1.06); }

    .prog-card-fade {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(8,17,26,0.9) 0%, transparent 55%);
    }
    .prog-card-label {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 8px 10px;
    }
    .prog-card-place { font-size: .65rem; letter-spacing: .18em; color: var(--sea); margin-bottom: 1px; }
    .prog-card-name { font-family: 'Playfair Display', serif; font-size: .85rem; color: var(--text); line-height: 1.2; }

    /* Locked card */
    .prog-card.locked {
      cursor: default;
      background: linear-gradient(135deg, #0A1820, #0D2030);
    }
    .prog-card.locked img { opacity: 0.18; filter: blur(2px); }
    .lock-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    }
    .lock-icon {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(42,127,168,.15); border: 1px solid rgba(42,127,168,.3);
      display: flex; align-items: center; justify-content: center; font-size: .85rem;
    }
    .lock-label { font-size: .62rem; color: rgba(106,138,154,.6); letter-spacing: .08em; text-align: center; line-height: 1.5; padding: 0 6px; }

    /* Newly unlocked animation */
    @keyframes unlock-flash {
      0% { box-shadow: 0 0 0 0 rgba(42,127,168,.8); }
      70% { box-shadow: 0 0 0 12px rgba(42,127,168,0); }
      100% { box-shadow: 0 0 0 0 rgba(42,127,168,0); }
    }
    .prog-card.just-unlocked { animation: unlock-flash .8s ease-out; }

    /* Progress indicator */
    .prog-footer {
      padding: 10px 14px; border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .prog-bar-label {
      display: flex; justify-content: space-between; align-items: center;
      font-size: .65rem; color: var(--muted); letter-spacing: .1em; margin-bottom: 6px;
    }
    .prog-bar-track {
      height: 2px; background: var(--border); border-radius: 1px; overflow: hidden;
    }
    .prog-bar-fill {
      height: 100%; background: var(--sea); border-radius: 1px;
      transition: width .8s cubic-bezier(.16,1,.3,1);
    }

    /* Ambient sound indicator */
    .sound-indicator {
      display: flex; align-items: center; gap: 6px;
      font-size: .65rem; color: var(--muted); letter-spacing: .08em;
    }
    .sound-bars { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
    .sound-bar {
      width: 2px; background: var(--sea); border-radius: 1px;
      animation: soundwave 1.2s ease-in-out infinite;
    }
    .sound-bar:nth-child(1) { height: 4px; animation-delay: 0s; }
    .sound-bar:nth-child(2) { height: 8px; animation-delay: .15s; }
    .sound-bar:nth-child(3) { height: 12px; animation-delay: .3s; }
    .sound-bar:nth-child(4) { height: 6px; animation-delay: .45s; }
    .sound-bar:nth-child(5) { height: 10px; animation-delay: .6s; }
    @keyframes soundwave {
      0%,100% { transform: scaleY(0.4); opacity: .5; }
      50% { transform: scaleY(1); opacity: 1; }
    }
    .sound-bars.paused .sound-bar { animation-play-state: paused; opacity: .3; }

    /* ── ELEVEN LABS BANNER ── */
    .api-banner {
      display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      background: #0A1A28; border-bottom: 2px solid var(--sea);
      padding: 12px 20px; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .api-banner.show { display: flex; }
    .api-banner label { font-size: .85rem; color: var(--text); }
    .api-banner label strong { color: var(--sea); }
    .api-banner input {
      flex: 1; min-width: 240px; background: #0A1420; border: 1px solid rgba(42,127,168,.4);
      color: var(--text); padding: 7px 12px; border-radius: 4px;
      font-size: .82rem; font-family: monospace; outline: none;
    }
    .api-banner input:focus { border-color: var(--sea); }
    .api-banner button {
      background: var(--sea); border: none; color: #fff;
      padding: 7px 16px; border-radius: 4px; cursor: pointer;
      font-size: .82rem; font-weight: 700;
    }
    .banner-close {
      background: none !important; color: var(--muted) !important;
      font-size: 1rem !important; padding: 4px 8px !important;
    }

    /* ── UNLOCK TOAST ── */
    .unlock-toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(12,28,40,0.95); backdrop-filter: blur(16px);
      border: 1px solid rgba(42,127,168,.5); border-radius: 10px;
      padding: 12px 20px; display: flex; align-items: center; gap: 12px;
      font-size: .85rem; color: var(--text); z-index: 100;
      opacity: 0; transition: all .4s cubic-bezier(.16,1,.3,1);
      pointer-events: none; max-width: 340px;
    }
    .unlock-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .unlock-toast-icon { font-size: 1.3rem; flex-shrink: 0; }
    .unlock-toast-text { line-height: 1.5; }
    .unlock-toast-title { color: var(--sea); font-size: .7rem; letter-spacing: .15em; margin-bottom: 2px; }

    /* Scrollbar */
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  </style>
</head>
<body>

<!-- ── ELEVENLABS BANNER ── -->
<div id="eleven-banner" class="api-banner" role="alert">
  <label><strong>ElevenLabs API-nøkkel</strong> — for Hildes stemme — hentes fra elevenlabs.io</label>
  <input type="password" id="eleven-key-input" placeholder="sk_..." autocomplete="off" />
  <button id="eleven-key-save">Lagre stemme</button>
  <button class="banner-close" id="eleven-banner-close">✕</button>
</div>

<!-- ── UNLOCK TOAST ── -->
<div class="unlock-toast" id="unlock-toast">
  <div class="unlock-toast-icon">🔓</div>
  <div class="unlock-toast-text">
    <div class="unlock-toast-title">NYTT STED ÅPNET</div>
    <div id="unlock-toast-msg">Andøya er nå tilgjengelig</div>
  </div>
</div>

<!-- ── MAIN APP ── -->
<div id="app">

  <!-- LEFT: Portrait + Chat -->
  <div class="chat-left">

    <!-- Animated portrait backdrop -->
    <div class="portrait-backdrop">
      <img id="backdrop-img" src="hilde-collage-1.jpeg" alt="Hilde i Lofoten" />
      <div class="portrait-light"></div>
      <div class="portrait-mist"></div>
    </div>

    <!-- Header -->
    <header class="chat-header">
      <a href="../../from-the-sofa.html" class="back-btn">← Guider</a>
      <div class="header-guide-info">
        <p class="header-city" id="header-city">REINE · LOFOTEN</p>
        <p class="header-name">Hilde</p>
      </div>
      <div class="header-controls">
        <div class="sound-indicator" id="sound-indicator">
          <div class="sound-bars paused" id="sound-bars">
            <div class="sound-bar"></div>
            <div class="sound-bar"></div>
            <div class="sound-bar"></div>
            <div class="sound-bar"></div>
            <div class="sound-bar"></div>
          </div>
          <span id="sound-label">Lyd av</span>
        </div>
        <button class="ctrl-btn" id="sound-btn" title="Slå ambientelyd av/på">🌊 Lyd</button>
        <button class="ctrl-btn" id="voice-btn" title="Slå stemmesvar av/på">🔇 Stemme</button>
        <button class="ctrl-btn" id="eleven-settings-btn" style="font-size:.7rem">⚙️</button>
      </div>
    </header>

    <!-- Messages -->
    <div class="messages-wrap">
      <div class="messages" id="messages" role="log" aria-live="polite"></div>
    </div>

    <!-- Input -->
    <div class="input-row">
      <input type="text" id="chat-input" autocomplete="off"
             placeholder="Spør Hilde om Reine, Lofoten…"
             aria-label="Skriv melding til Hilde" />
      <button id="send-btn">→</button>
    </div>
  </div>

  <!-- RIGHT: Progression Panel -->
  <aside class="chat-right" id="chat-right">

    <!-- Portrait -->
    <div class="right-portrait">
      <img src="hilde-collage-1.jpeg" alt="Hilde" id="right-portrait-img" />
      <div class="right-portrait-fade"></div>
      <div class="online-dot" title="Hilde er tilgjengelig nå"></div>
      <div class="right-portrait-info">
        <p class="right-city">LOFOTEN · VESTERÅLEN</p>
        <p class="right-name">Hilde</p>
        <p class="right-tagline" id="right-tagline">"Fiskernes paradis — magisk og uberørt"</p>
      </div>
    </div>

    <!-- Tabs -->
    <div class="prog-tabs" id="prog-tabs">
      <button class="prog-tab active" data-tab="steder">STEDER</button>
      <button class="prog-tab" data-tab="antrekk">ANTREKK</button>
      <button class="prog-tab" data-tab="historier">HISTORIER</button>
      <button class="prog-tab" data-tab="opplevelser">OPPLEVELSER</button>
    </div>

    <!-- Tab content -->
    <div class="prog-content" id="prog-content"></div>

    <!-- Progress bar footer -->
    <div class="prog-footer">
      <div class="prog-bar-label">
        <span>SAMTALE-FREMGANG</span>
        <span id="prog-count">0 / 8 steder</span>
      </div>
      <div class="prog-bar-track">
        <div class="prog-bar-fill" id="prog-bar" style="width:12%"></div>
      </div>
    </div>

  </aside>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════
// ELEVEN LABS KEY
// ════════════════════════════════════════════════════════════════════════
let ELEVEN_KEY = localStorage.getItem('st_eleven') || '';
let voiceOn = false;
let currentAudio = null;

document.getElementById('eleven-key-save').addEventListener('click', () => {
  const v = document.getElementById('eleven-key-input').value.trim();
  if (v.length > 10) {
    ELEVEN_KEY = v;
    localStorage.setItem('st_eleven', v);
    document.getElementById('eleven-banner').classList.remove('show');
    enableVoice();
  }
});
document.getElementById('eleven-banner-close').addEventListener('click', () =>
  document.getElementById('eleven-banner').classList.remove('show'));
document.getElementById('eleven-settings-btn').addEventListener('click', () =>
  document.getElementById('eleven-banner').classList.toggle('show'));

document.getElementById('voice-btn').addEventListener('click', () => {
  if (!ELEVEN_KEY) { document.getElementById('eleven-banner').classList.add('show'); return; }
  voiceOn = !voiceOn; updateVoiceBtn();
});
function enableVoice() { voiceOn = true; updateVoiceBtn(); }
function updateVoiceBtn() {
  const btn = document.getElementById('voice-btn');
  btn.textContent = voiceOn ? '🔊 Stemme' : '🔇 Stemme';
  btn.classList.toggle('active', voiceOn);
}
if (ELEVEN_KEY) enableVoice();

// ════════════════════════════════════════════════════════════════════════
// AMBIENT SOUND ENGINE — Web Audio API

// ── Core noise buffer ──
function makeNoise(ctx, durationSec = 3) {
  const len = ctx.sampleRate * durationSec;
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf; src.loop = true;
  return src;
}

// ── Filtered noise layer ──
function noiseLayer(ctx, freq, q, gain, dest) {
  const src = makeNoise(ctx);
  const filt = ctx.createBiquadFilter();
  filt.type = 'bandpass'; filt.frequency.value = freq; filt.Q.value = q;
  const g = ctx.createGain(); g.gain.value = 0;
  src.connect(filt); filt.connect(g); g.connect(dest);
  src.start();
  g.gain.linearRampToValueAtTime(gain, ctx.currentTime + 2.5);
  return { src, gainNode: g, baseGain: gain };
}

// ── Rhythmic wave surges ──
function waveEngine(ctx, dest, intensity = 1.0) {
  const nodes = [];
  // Low rumble — ocean bed
  nodes.push(noiseLayer(ctx, 60, 0.4, 0.07 * intensity, dest));
  // Mid splash — breaking waves
  nodes.push(noiseLayer(ctx, 280, 0.6, 0.05 * intensity, dest));
  // High hiss — foam and spray
  nodes.push(noiseLayer(ctx, 2200, 1.2, 0.025 * intensity, dest));

  // Rhythmic swell — LFO on mid layer
  const lfo = ctx.createOscillator();
  const lfoGain = ctx.createGain();
  lfo.frequency.value = 0.12 + Math.random() * 0.06; // ~every 8-10 sec
  lfoGain.gain.value = 0.03 * intensity;
  lfo.connect(lfoGain);
  lfoGain.connect(nodes[1].gainNode.gain);
  lfo.start();
  nodes.push({ src: lfo, gainNode: lfoGain, baseGain: 0 });
  return nodes;
}

// ── Seagull synthesizer ──
function seagullEngine(ctx, dest, density = 1.0) {
  const nodes = [];
  function scheduleGull() {
    if (!ambientOn) return;
    const t = ctx.currentTime + 1 + Math.random() * (8 / density);
    // Seagull cry — FM synthesis
    const osc = ctx.createOscillator();
    const modOsc = ctx.createOscillator();
    const modGain = ctx.createGain();
    const envGain = ctx.createGain();
    const baseFreq = 900 + Math.random() * 400;
    osc.frequency.value = baseFreq;
    osc.type = 'sine';
    modOsc.frequency.value = 4 + Math.random() * 3; // vibrato
    modOsc.type = 'sine';
    modGain.gain.value = 60 + Math.random() * 40;
    envGain.gain.value = 0;
    modOsc.connect(modGain);
    modGain.connect(osc.frequency);
    osc.connect(envGain);
    envGain.connect(dest);
    const dur = 0.6 + Math.random() * 0.8;
    osc.start(t); modOsc.start(t);
    // Envelope: attack, sustain, release
    envGain.gain.setValueAtTime(0, t);
    envGain.gain.linearRampToValueAtTime(0.06, t + 0.08);
    envGain.gain.setValueAtTime(0.06, t + dur * 0.6);
    envGain.gain.linearRampToValueAtTime(0, t + dur);
    // Frequency sweep (gull cry descends)
    osc.frequency.setValueAtTime(baseFreq, t);
    osc.frequency.linearRampToValueAtTime(baseFreq * 0.72, t + dur);
    osc.stop(t + dur + 0.1); modOsc.stop(t + dur + 0.1);
    // Sometimes double-cry
    if (Math.random() > 0.6) {
      const t2 = t + dur + 0.15 + Math.random() * 0.2;
      const o2 = ctx.createOscillator();
      const g2 = ctx.createGain();
      o2.frequency.value = baseFreq * 0.85;
      o2.type = 'sine';
      g2.gain.value = 0;
      o2.connect(g2); g2.connect(dest);
      o2.start(t2);
      g2.gain.setValueAtTime(0, t2);
      g2.gain.linearRampToValueAtTime(0.04, t2 + 0.06);
      g2.gain.linearRampToValueAtTime(0, t2 + 0.35);
      o2.stop(t2 + 0.4);
    }
    setTimeout(scheduleGull, (t - ctx.currentTime + 0.5) * 1000 * (0.5 + Math.random()));
  }
  scheduleGull();
  return nodes;
}

// ── Boat motor synthesizer ──
function boatMotorEngine(ctx, dest) {
  const nodes = [];
  // Diesel thrum — low oscillator + noise
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.value = 42 + Math.random() * 8;
  const filt = ctx.createBiquadFilter();
  filt.type = 'lowpass'; filt.frequency.value = 180;
  const g = ctx.createGain(); g.gain.value = 0;
  osc.connect(filt); filt.connect(g); g.connect(dest);
  osc.start();
  g.gain.linearRampToValueAtTime(0.04, ctx.currentTime + 3);
  nodes.push({ src: osc, gainNode: g, baseGain: 0.04 });
  // Water churn from propeller
  nodes.push(noiseLayer(ctx, 320, 0.5, 0.025, dest));
  return nodes;
}

// ── Wind engine ──
function windEngine(ctx, dest, intensity = 1.0) {
  const nodes = [];
  nodes.push(noiseLayer(ctx, 180, 0.35, 0.05 * intensity, dest));
  nodes.push(noiseLayer(ctx, 900, 0.9, 0.02 * intensity, dest));
  // Gusts — slow LFO
  const lfo = ctx.createOscillator();
  const lfoG = ctx.createGain();
  lfo.frequency.value = 0.05 + Math.random() * 0.04;
  lfoG.gain.value = 0.025 * intensity;
  lfo.connect(lfoG); lfoG.connect(nodes[0].gainNode.gain);
  lfo.start();
  nodes.push({ src: lfo, gainNode: lfoG, baseGain: 0 });
  return nodes;
}

// ── Lundefugl / small bird engine ──
function birdEngine(ctx, dest) {
  const nodes = [];
  function scheduleBird() {
    if (!ambientOn) return;
    const t = ctx.currentTime + 0.5 + Math.random() * 4;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    const baseFreq = 2200 + Math.random() * 1200;
    osc.frequency.value = baseFreq;
    g.gain.value = 0;
    osc.connect(g); g.connect(dest);
    osc.start(t);
    const chirps = 2 + Math.floor(Math.random() * 4);
    for (let i = 0; i < chirps; i++) {
      const ct = t + i * 0.08;
      g.gain.setValueAtTime(0, ct);
      g.gain.linearRampToValueAtTime(0.04, ct + 0.02);
      g.gain.linearRampToValueAtTime(0, ct + 0.055);
      osc.frequency.setValueAtTime(baseFreq + Math.random() * 300, ct);
    }
    osc.stop(t + chirps * 0.08 + 0.1);
    setTimeout(scheduleBird, (t - ctx.currentTime + 0.2) * 1000 * (0.3 + Math.random() * 0.7));
  }
  scheduleBird();
  return nodes;
}

// ── Scene builder ──
function buildScene(ctx, sceneName) {
  const master = ctx.createGain();
  master.gain.value = 0.85;
  master.connect(ctx.destination);
  const nodes = [];

  switch(sceneName) {
    case 'havn':
      // Waves + seagulls — classic Lofoten harbour
      nodes.push(...waveEngine(ctx, master, 0.85));
      seagullEngine(ctx, master, 1.0);
      nodes.push(noiseLayer(ctx, 400, 0.4, 0.01, master)); // distant dock sounds
      break;

    case 'storm':
      // Å — heavy waves, strong wind, dramatic
      nodes.push(...waveEngine(ctx, master, 1.6));
      nodes.push(...windEngine(ctx, master, 1.4));
      seagullEngine(ctx, master, 0.3); // fewer gulls in storm
      break;

    case 'fiskehavn':
      // Kabelvåg/Svolvær — harbour with boat activity
      nodes.push(...waveEngine(ctx, master, 0.6));
      seagullEngine(ctx, master, 1.4); // more gulls near fish
      nodes.push(...boatMotorEngine(ctx, master));
      nodes.push(noiseLayer(ctx, 500, 0.3, 0.015, master)); // harbour chatter
      break;

    case 'fjell':
      // Reinebringen — wind, distant sea, silence
      nodes.push(...windEngine(ctx, master, 1.2));
      nodes.push(noiseLayer(ctx, 100, 0.3, 0.025, master)); // distant sea rumble
      break;

    case 'nordlys':
      // Winter night — near silence, very faint wind
      nodes.push(noiseLayer(ctx, 80, 0.2, 0.02, master));
      nodes.push(...windEngine(ctx, master, 0.25));
      break;

    case 'baat':
      // Open sea fishing boat
      nodes.push(...waveEngine(ctx, master, 1.1));
      nodes.push(...boatMotorEngine(ctx, master));
      nodes.push(...windEngine(ctx, master, 0.6));
      seagullEngine(ctx, master, 0.5);
      break;

    case 'kyst':
      // Sortland/Bø — gentle coast, light wind
      nodes.push(...waveEngine(ctx, master, 0.5));
      nodes.push(...windEngine(ctx, master, 0.4));
      seagullEngine(ctx, master, 0.6);
      break;

    case 'fugl':
      // Bleik — bird colony, wind, sea below
      nodes.push(...waveEngine(ctx, master, 0.7));
      nodes.push(...windEngine(ctx, master, 0.8));
      birdEngine(ctx, master);
      seagullEngine(ctx, master, 0.8);
      break;

    default:
      nodes.push(...waveEngine(ctx, master, 0.8));
      seagullEngine(ctx, master, 0.8);
  }

  ambientNodes.push(...nodes, { src: null, gainNode: master, baseGain: 0.85 });
}

function startAmbient(scene = 'havn') {
  if (audioCtx) stopAmbient();
  currentScene = scene;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    buildScene(audioCtx, scene);
  } catch(e) { console.warn('Audio error:', e); }
}

function modulateGain(gainNode, baseGain, rate) {
  // kept for compatibility — not used in new engine
}

function stopAmbient() {
  ambientNodes.forEach(n => {
    try {
      if (n.gainNode) n.gainNode.gain.linearRampToValueAtTime(0, (audioCtx?.currentTime || 0) + 1);
      if (n.src && n.src.stop) setTimeout(() => { try { n.src.stop(); } catch(e){} }, 1100);
    } catch(e) {}
  });
  ambientNodes = [];
  setTimeout(() => {
    if (audioCtx) { try { audioCtx.close(); } catch(e){} audioCtx = null; }
  }, 1300);
}

function setAmbientScene(scene) {
  if (ambientOn) { stopAmbient(); setTimeout(() => startAmbient(scene), 400); }
  currentScene = scene;
  updateSoundLabel();
}

function updateSoundLabel() {
  const sc = scenes[currentScene] || scenes.havn;
  document.getElementById('sound-label').textContent = ambientOn ? sc.label : 'Lyd av';
  const bars = document.getElementById('sound-bars');
  bars.classList.toggle('paused', !ambientOn);
}

document.getElementById('sound-btn').addEventListener('click', () => {
  ambientOn = !ambientOn;
  const btn = document.getElementById('sound-btn');
  if (ambientOn) {
    startAmbient(currentScene);
    btn.classList.add('active');
    btn.textContent = '🌊 Lyd på';
  } else {
    stopAmbient();
    btn.classList.remove('active');
    btn.textContent = '🌊 Lyd';
  }
  updateSoundLabel();
});

function countUnlocked(tab) {
  return progressionData[tab].filter(item => userMsgCount >= item.unlockAt).length;
}

function renderProgContent() {
  const container = document.getElementById('prog-content');
  const items = progressionData[activeTab];
  if (!items) return;

  container.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'prog-grid';

  items.forEach(item => {
    const isUnlocked = userMsgCount >= item.unlockAt;
    const card = document.createElement('div');
    card.className = `prog-card ${isUnlocked ? 'unlocked' : 'locked'}`;
    if (activeTab === 'steder' && item.id === activeStedId && isUnlocked) {
      card.classList.add('active-card');
    }

    if (isUnlocked) {
      card.innerHTML = `
        <img src="${item.img}" alt="${item.name}"
             style="object-position: ${item.imgPos || 'center'}" />
        <div class="prog-card-fade"></div>
        <div class="prog-card-label">
          <div class="prog-card-place">${item.place}</div>
          <div class="prog-card-name">${item.name}</div>
          ${item.preview ? `<div style="font-size:.6rem;color:var(--muted);font-style:italic;margin-top:2px">${item.preview}</div>` : ''}
        </div>`;

      if (activeTab === 'steder') {
        card.addEventListener('click', () => {
          activeStedId = item.id;
          setAmbientScene(item.soundScene || 'havn');
          // Update backdrop
          document.getElementById('backdrop-img').style.opacity = '0';
          setTimeout(() => {
            document.getElementById('backdrop-img').src = item.backdropImg || item.img;
            document.getElementById('backdrop-img').style.opacity = '1';
          }, 600);
          document.getElementById('header-city').textContent = item.headerCity || 'LOFOTEN';
          renderProgContent();
        });
      } else if (activeTab === 'historier') {
        card.addEventListener('click', () => {
          sendMessage(`Fortell meg om: ${item.name}`);
        });
      } else if (activeTab === 'opplevelser') {
        card.addEventListener('click', () => {
          sendMessage(`Jeg vil gjerne oppleve: ${item.name}`);
        });
      }
    } else {
      // locked — calculate messages needed
      const needed = item.unlockAt - userMsgCount;
      card.innerHTML = `
        <img src="${item.img}" alt="" style="object-position: ${item.imgPos || 'center'}" />
        <div class="prog-card-fade"></div>
        <div class="lock-overlay">
          <div class="lock-icon">🔒</div>
          <div class="lock-label">${item.name}<br><span style="color:rgba(106,138,154,.4)">${needed} meldinger igjen</span></div>
        </div>`;
    }

    grid.appendChild(card);
  });

  container.appendChild(grid);

  // Update progress bar (based on steder)
  const totalSteder = progressionData.steder.length;
  const unlockedSteder = countUnlocked('steder');
  const pct = Math.round((unlockedSteder / totalSteder) * 100);
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-count').textContent = `${unlockedSteder} av ${totalSteder} steder`;
}

// ════════════════════════════════════════════════════════════════════════
// UNLOCK CHECKING
// ════════════════════════════════════════════════════════════════════════
function checkUnlocks() {
  const tabs = ['steder', 'antrekk', 'historier', 'opplevelser'];
  tabs.forEach(tab => {
    const items = progressionData[tab];
    items.forEach(item => {
      if (userMsgCount >= item.unlockAt && userMsgCount - 1 < item.unlockAt) {
        // Just unlocked!
        showUnlockToast(item.name, tab);
        // Flash the card
        setTimeout(() => {
          renderProgContent();
          const cards = document.querySelectorAll('.prog-card.unlocked');
          if (cards.length > 0) {
            const lastUnlocked = cards[cards.length - 1];
            lastUnlocked.classList.add('just-unlocked');
            setTimeout(() => lastUnlocked.classList.remove('just-unlocked'), 1000);
          }
        }, 100);
      }
    });
  });
}

function showUnlockToast(name, tab) {
  const labels = { steder: 'NYTT STED ÅPNET', antrekk: 'NYTT ANTREKK', historier: 'SKJULT HISTORIE', opplevelser: 'NY OPPLEVELSE' };
  const toast = document.getElementById('unlock-toast');
  document.querySelector('.unlock-toast-title').textContent = labels[tab] || 'LÅST OPP';
  document.getElementById('unlock-toast-msg').textContent = `${name} er nå tilgjengelig`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 4000);
}

// MESSAGES
// ════════════════════════════════════════════════════════════════════════
const messagesEl = document.getElementById('messages');
const chatInput  = document.getElementById('chat-input');
const sendBtn    = document.getElementById('send-btn');

function parseMarkdownLinks(text) {
  const escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return escaped
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\n/g,'<br>');
}

function appendMessage(role, text, withSpeakBtn = false) {
  const row = document.createElement('div');
  row.className = `msg-row${role === 'user' ? ' user' : ''}`;

  if (role !== 'user') {
    const img = document.createElement('img');
    img.className = 'msg-avatar';
    img.src = 'hilde-collage-3.jpeg';
    img.alt = 'Hilde';
    row.appendChild(img);
  }

  const bubble = document.createElement('div');
  bubble.className = `msg-bubble ${role === 'user' ? 'user-bubble' : role === 'error' ? 'error' : 'bot'}`;

  const textNode = document.createElement('div');
  if (role === 'assistant') {
    textNode.innerHTML = parseMarkdownLinks(text);
  } else {
    textNode.textContent = text;
  }
  bubble.appendChild(textNode);

  if (withSpeakBtn && role === 'assistant') {
    const btn = document.createElement('button');
    btn.className = 'speak-btn';
    btn.textContent = '🔊 Hør Hilde';
    btn.addEventListener('click', () => speakText(text, btn));
    bubble.appendChild(btn);
  }

  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

function showTyping() {
  const id = 'typing-' + Date.now();
  const row = document.createElement('div');
  row.className = 'msg-row'; row.id = id;
  const img = document.createElement('img');
  img.className = 'msg-avatar'; img.src = 'hilde-collage-3.jpeg'; img.alt = '';
  const bub = document.createElement('div');
  bub.className = 'msg-bubble bot';
  bub.innerHTML = '<span class="typing">···</span>';
  row.appendChild(img); row.appendChild(bub);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return id;
}
function removeTyping(id) { const el = document.getElementById(id); if (el) el.remove(); }

// ════════════════════════════════════════════════════════════════════════
// SEND MESSAGE
// ════════════════════════════════════════════════════════════════════════
sendBtn.addEventListener('click', () => sendMessage());
chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

async function sendMessage(text) {
  const msg = (text || chatInput.value).trim();
  if (!msg || isLoading) return;
  stopAudio();
  chatInput.value = '';
  appendMessage('user', msg);
  chatHistory.push({ role: 'user', content: msg });
  userMsgCount++;
  checkUnlocks();
  renderProgContent();

  const typingId = showTyping();
  isLoading = true;
  sendBtn.disabled = true;

  try {
    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 600,
        system: getSystemPrompt(userMsgCount),
        messages: chatHistory.filter(m => m.role !== 'system'),
      }),
    });

    removeTyping(typingId);

    if (!res.ok && !res.headers.get('content-type')?.includes('application/json')) {
      appendMessage('error', `Serverfeil ${res.status}`);
    } else {
      const data = await res.json();
      if (data.error) {
        appendMessage('error', `API-feil: ${data.error.message}`);
      } else {
        const reply = data.content?.[0]?.text || 'Tomt svar — prøv igjen.';
        appendMessage('assistant', reply, true);
        chatHistory.push({ role: 'assistant', content: reply });
        if (voiceOn && ELEVEN_KEY) speakText(reply);
      }
    }
  } catch (err) {
    removeTyping(typingId);
    appendMessage('error', `Nettverksfeil: ${err.message}`);
  }
  isLoading = false;
  sendBtn.disabled = false;
  chatInput.focus();
}

// ════════════════════════════════════════════════════════════════════════
// ELEVENLABS TTS
// ════════════════════════════════════════════════════════════════════════
const HILDE_VOICE_ID = 'jsCqWAovK2LkecY7zXl4';

function stopAudio() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.querySelectorAll('.speak-btn.playing').forEach(b => {
    b.classList.remove('playing'); b.textContent = '🔊 Hør Hilde';
  });
}

async function speakText(text, btn) {
  if (!ELEVEN_KEY) { document.getElementById('eleven-banner').classList.add('show'); return; }
  stopAudio();
  if (btn) { btn.classList.add('loading'); btn.textContent = '⏳ Laster…'; }

  const trimmed = text.length > 2500 ? text.substring(0, 2500) + '…' : text;

  try {
    const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${HILDE_VOICE_ID}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'xi-api-key': ELEVEN_KEY },
      body: JSON.stringify({
        text: trimmed,
        model_id: 'eleven_multilingual_v2',
        voice_settings: { stability: 0.5, similarity_boost: 0.75, style: 0.3, use_speaker_boost: true },
      }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;
    if (btn) { btn.classList.remove('loading'); btn.classList.add('playing'); btn.textContent = '⏹ Stopp'; }
    audio.addEventListener('ended', () => {
      currentAudio = null; URL.revokeObjectURL(url);
      if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 Hør Hilde'; }
    });
    if (btn) btn.onclick = () => { stopAudio(); btn.onclick = () => speakText(text, btn); };
    audio.play();
  } catch (err) {
    if (btn) { btn.classList.remove('loading', 'playing'); btn.textContent = '⚠️ Feil'; }
    console.error('ElevenLabs feil:', err.message);
  }
}

  const welcome = `Ferjen fra Bodø legger til kai i Moskenes.\n\nDu ser dem før du går i land — Lofotveggen. Fjellene bare reiser seg fra havet uten forvarsel, uten kystlinje å forberede deg. Det er ikke noe som ligner.\n\nJeg er Hilde. Jeg har ventet her, ved kaien i Reine.\n\nVil du at vi begynner her — i det vakreste, det fotograferte — eller vil du at jeg tar deg til Å først, enden av veien, der Norge slutter?`;

  appendMessage('assistant', welcome);
  chatHistory.push({ role: 'assistant', content: welcome });

  // Focus input
  setTimeout(() => chatInput.focus(), 800);
}

init();
